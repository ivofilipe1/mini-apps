 to the end)."},{"k":"tr","prompt":"Translate: \"They found their keys again.\"","ans":["zij vonden hun sleutels terug"],"why":"terugvinden -> vonden terug (simple past, plural; separable verb)."},{"k":"tr","prompt":"Translate: \"The workers cleared the rubble.\"","ans":["de arbeiders ruimden het puin"],"why":"ruimen -> ruimden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The drivers shifted gears too late.\"","ans":["de chauffeurs schakelden te laat"],"why":"schakelen -> schakelden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The artist sketched the landscape.\"","ans":["de kunstenaar schetste het landschap"],"why":"schetsen -> schetste (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The news shocked everyone.\"","ans":["het nieuws schokte iedereen"],"why":"schokken -> schokte (simple past, singular)."},{"k":"tr","prompt":"Translate: \"He shook her hand.\"","ans":["hij schudde haar hand"],"why":"schudden -> schudde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The teacher flagged the problem right away.\"","ans":["de leraar signaleerde het probleem meteen"],"why":"signaleren -> signaleerde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The soup tasted delicious.\"","ans":["de soep smaakte heerlijk"],"why":"smaken -> smaakte (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The tourist stepped into the taxi.\"","ans":["de toerist stapte in de taxi"],"why":"stappen -> stapte (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The neighbors supported the family.\"","ans":["de buren steunden het gezin"],"why":"steunen -> steunden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The teachers punished the students.\"","ans":["de leraren straften de leerlingen"],"why":"straffen -> straften (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The children took off their shoes.\"","ans":["de kinderen trokken hun schoenen uit"],"why":"uittrekken -> trokken uit (simple past, plural; separable prefix uit moves to the end)."},{"k":"tr","prompt":"Translate: \"The children caught the ball.\"","ans":["de kinderen vingen de bal"],"why":"vangen -> vingen (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The soldier fought bravely.\"","ans":["de soldaat vocht dapper"],"why":"vechten -> vocht (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The cables connected the two computers.\"","ans":["de kabels verbonden de twee computers"],"why":"verbinden -> verbonden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"We compared the two prices.\"","ans":["wij vergeleken de twee prijzen"],"why":"vergelijken -> vergeleken (simple past, plural)."},{"k":"tr","prompt":"Translate: \"She sold her old car.\"","ans":["zij verkocht haar oude auto"],"why":"verkopen -> verkocht (simple past, singular)."},{"k":"tr","prompt":"Translate: \"We lost the match.\"","ans":["wij verloren de wedstrijd"],"why":"verliezen -> verloren (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The trains departed on time.\"","ans":["de treinen vertrokken op tijd"],"why":"vertrekken -> vertrokken (simple past, plural)."},{"k":"tr","prompt":"Translate: \"I found my wallet.\"","ans":["ik vond mijn portemonnee"],"why":"vinden -> vond (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The students asked a difficult question.\"","ans":["de studenten vroegen een moeilijke vraag"],"why":"vragen -> vroegen (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The guides pointed at the map.\"","ans":["de gidsen wezen naar de kaart"],"why":"wijzen -> wezen (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The dog ran away.\"","ans":["de hond liep weg"],"why":"weglopen -> liep weg (simple past, singular; separable prefix weg moves to the end)."},{"k":"tr","prompt":"Translate: \"You all were very tired.\"","ans":["jullie waren erg moe"],"why":"zijn -> waren (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The boys kicked the ball.\"","ans":["de jongens trapten de bal"],"why":"trappen -> trapten (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The company expanded its team.\"","ans":["het bedrijf breidde zijn team uit"],"why":"uitbreiden -> breidde uit (simple past, singular; separable prefix uit moves to the end)."},{"k":"tr","prompt":"Translate: \"The children played a prank.\"","ans":["de kinderen haalden een grap uit"],"why":"uithalen -> haalden uit (simple past, plural; separable prefix uit moves to the end; 'een grap uithalen' = to play a prank)."},{"k":"tr","prompt":"Translate: \"The tourists got off the train.\"","ans":["de toeristen stapten uit de trein"],"why":"uitstappen -> stapten uit (simple past, plural; separable prefix uit combines with 'de trein')."},{"k":"tr","prompt":"Translate: \"The news surprised everyone.\"","ans":["het nieuws verbaasde iedereen"],"why":"verbazen -> verbaasde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"My parents earned a lot of money.\"","ans":["mijn ouders verdienden veel geld"],"why":"verdienen -> verdienden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"My parents rented out the apartment.\"","ans":["mijn ouders verhuurden het appartement"],"why":"verhuren -> verhuurden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"She longed for home.\"","ans":["zij verlangde naar huis"],"why":"verlangen -> verlangde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The soldiers destroyed the bridge.\"","ans":["de soldaten vernietigden de brug"],"why":"vernietigen -> vernietigden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The movers moved the furniture.\"","ans":["de verhuizers verplaatsten de meubels"],"why":"verplaatsen -> verplaatsten (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The exercise strengthened her muscles.\"","ans":["de oefening versterkte haar spieren"],"why":"versterken -> versterkte (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The students translated the book.\"","ans":["de studenten vertaalden het boek"],"why":"vertalen -> vertaalden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The painters painted the fence.\"","ans":["de schilders verfden het hek"],"why":"verven -> verfden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"He removed the old file.\"","ans":["hij verwijderde het oude bestand"],"why":"verwijderen -> verwijderde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The vets cared for the sick dog.\"","ans":["de dierenartsen verzorgden de zieke hond"],"why":"verzorgen -> verzorgden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The refugees fled from the war.\"","ans":["de vluchtelingen vluchtten voor de oorlog"],"why":"vluchten -> vluchtten (simple past, plural)."},{"k":"tr","prompt":"Translate: \"He fed the horse.\"","ans":["hij voerde het paard"],"why":"voeren -> voerde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The students completed the project.\"","ans":["de studenten voltooiden het project"],"why":"voltooien -> voltooiden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"We filled the boxes.\"","ans":["wij vulden de dozen"],"why":"vullen -> vulden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"She walked through the park.\"","ans":["zij wandelde door het park"],"why":"wandelen -> wandelde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"My parents woke the children early.\"","ans":["mijn ouders wekten de kinderen vroeg"],"why":"wekken -> wekten (simple past, plural)."},{"k":"tr","prompt":"Translate: \"The organizers changed the schedule.\"","ans":["de organisatoren wijzigden het schema"],"why":"wijzigen -> wijzigden (simple past, plural)."},{"k":"tr","prompt":"Translate: \"He struggled with the heavy box.\"","ans":["hij worstelde met de zware doos"],"why":"worstelen -> worstelde (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The lovers kissed each other.\"","ans":["de geliefden zoenden elkaar"],"why":"zoenen -> zoenden (simple past, plural)."}],"pool":500},{"id":"conj","group":"Word order","name":"Conjunctions","title":"Conjunctions: Spot the Type, Get the Order Right","rule":"<h2>The rule<\/h2><p>Two families. Get the family right and the word order follows automatically.<\/p><h3>Coordinating — normal word order continues after them<\/h3><table>\n<tr><th>Conjunction<\/th><th>Meaning<\/th><th>Behavior<\/th><\/tr>\n<tr><td><code>en<\/code><\/td><td>and<\/td><td>V2 continues in the next clause.<\/td><\/tr>\n<tr><td><code>maar<\/code><\/td><td>but<\/td><td>V2 continues in the next clause.<\/td><\/tr>\n<tr><td><code>of<\/code><\/td><td>or<\/td><td>V2 continues in the next clause.<\/td><\/tr>\n<tr><td><code>want<\/code><\/td><td>because (reason)<\/td><td>V2 continues — the classic trap vs. <code>omdat<\/code>.<\/td><\/tr>\n<tr><td><code>dus<\/code><\/td><td>so, therefore<\/td><td>V2 continues (comma + <code>dus<\/code> + subject-verb).<\/td><\/tr>\n<tr><td><code>noch ... noch<\/code><\/td><td>neither ... nor<\/td><td>Joins two words/phrases inside one clause — already negative, never add <code>niet<\/code>/<code>geen<\/code>.<\/td><\/tr>\n<\/table><h3>Subordinating — the conjugated verb goes to the end of their clause<\/h3><table>\n<tr><th>Conjunction<\/th><th>Meaning<\/th><th>Behavior<\/th><\/tr>\n<tr><td><code>omdat<\/code><\/td><td>because (a reason)<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>dat<\/code><\/td><td>that<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>als<\/code><\/td><td>if / when<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>terwijl<\/code><\/td><td>while<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>hoewel<\/code><\/td><td>although<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>voordat<\/code><\/td><td>before<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>nadat<\/code><\/td><td>after<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>sinds<\/code><\/td><td>since (time)<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>totdat<\/code><\/td><td>until<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>zodat<\/code><\/td><td>so that (purpose/result)<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>tenzij<\/code><\/td><td>unless<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>doordat<\/code><\/td><td>because — an impersonal cause, not a person's motive<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>mits<\/code><\/td><td>provided that — a stricter, more formal condition than <code>als<\/code><\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>zodra<\/code><\/td><td>as soon as<\/td><td>Verb-final.<\/td><\/tr>\n<tr><td><code>aangezien<\/code><\/td><td>since / given that — formal; treats the reason as already obvious<\/td><td>Verb-final.<\/td><\/tr>\n<\/table><div class=\"callout\">\n<strong>Remember the twist from Verb last:<\/strong> if a subordinating clause comes first in the sentence, it counts as the whole \"position 1\" for the main clause — so the main clause still inverts (verb before subject) right after the comma. Coordinating conjunctions never create this fronting situation the same way; each clause they join keeps its own ordinary shape.\n<\/div><p>Verified against Dutchgrammar.com — Word Order §10 and Elon.io — Causal Conjunctions: Omdat, Doordat, Want, Aangezien for the less common items (<code>doordat<\/code>, <code>mits<\/code>, <code>zodra<\/code>, <code>aangezien<\/code>).<\/p>","items":[{"k":"match","prompt":"Match 1. Match the coordinating conjunction to its English meaning.","L":[{"key":"1","t":"en","say":"en"},{"key":"2","t":"maar","say":"maar"},{"key":"3","t":"of","say":"of"},{"key":"4","t":"want","say":"want"},{"key":"5","t":"dus","say":"dus"}],"R":[{"key":"2","t":"but","say":""},{"key":"5","t":"so","say":""},{"key":"1","t":"and","say":""},{"key":"4","t":"because","say":""},{"key":"3","t":"or","say":""}]},{"k":"match","prompt":"Match 2. Match the subordinating conjunction to its English meaning.","L":[{"key":"1","t":"omdat","say":""},{"key":"2","t":"dat","say":""},{"key":"3","t":"als","say":""},{"key":"4","t":"terwijl","say":""},{"key":"5","t":"hoewel","say":""}],"R":[{"key":"5","t":"although","say":""},{"key":"4","t":"while","say":""},{"key":"3","t":"if / when","say":""},{"key":"2","t":"that","say":""},{"key":"1","t":"because","say":""}]},{"k":"match","prompt":"Match 3. Match the subordinating conjunction to its English meaning.","L":[{"key":"1","t":"voordat","say":""},{"key":"2","t":"nadat","say":""},{"key":"3","t":"sinds","say":""},{"key":"4","t":"totdat","say":""},{"key":"5","t":"zodat","say":""}],"R":[{"key":"4","t":"until","say":""},{"key":"5","t":"so that","say":""},{"key":"1","t":"before","say":""},{"key":"3","t":"since","say":""},{"key":"2","t":"after","say":""}]},{"k":"match","prompt":"Match 4. Match the subordinating conjunction to its English meaning.","L":[{"key":"1","t":"tenzij","say":""},{"key":"2","t":"doordat","say":""},{"key":"3","t":"mits","say":""},{"key":"4","t":"zodra","say":""},{"key":"5","t":"aangezien","say":""}],"R":[{"key":"4","t":"as soon as","say":""},{"key":"5","t":"since / given that","say":""},{"key":"1","t":"unless","say":""},{"key":"2","t":"because (an impersonal cause)","say":""},{"key":"3","t":"provided that","say":""}]},{"k":"match","prompt":"Match 5. Match the conjunction to its category and role.","L":[{"key":"1","t":"noch ... noch","say":"noch"},{"key":"2","t":"want","say":"want"},{"key":"3","t":"omdat","say":"omdat"},{"key":"4","t":"terwijl","say":"terwijl"},{"key":"5","t":"zodra","say":"zodra"}],"R":[{"key":"4","t":"subordinating — marks two things happening at once, verb goes to the end","say":""},{"key":"1","t":"coordinating — pairs two negative items, word order untouched","say":""},{"key":"5","t":"subordinating — marks the very next moment, verb goes to the end","say":""},{"key":"2","t":"coordinating — gives a reason, word order untouched (the omdat trap)","say":""},{"key":"3","t":"subordinating — gives a reason, verb goes to the end","say":""}]},{"k":"match","prompt":"Match 6. Match the conjunction to its category and role.","L":[{"key":"1","t":"dus","say":""},{"key":"2","t":"dat","say":""},{"key":"3","t":"hoewel","say":""},{"key":"4","t":"mits","say":""},{"key":"5","t":"aangezien","say":""}],"R":[{"key":"3","t":"subordinating — marks a contrast, verb goes to the end","say":""},{"key":"5","t":"subordinating — states an already-obvious reason, verb goes to the end","say":""},{"key":"1","t":"coordinating — marks a result, word order untouched","say":""},{"key":"4","t":"subordinating — sets a strict condition, verb goes to the end","say":""},{"key":"2","t":"subordinating — introduces a reported fact, verb goes to the end","say":""}]},{"k":"match","prompt":"Match 7. Match the coordinating conjunction to a correctly-ordered clause that continues it.","L":[{"key":"1","t":"en","say":"en"},{"key":"2","t":"maar","say":"maar"},{"key":"3","t":"of","say":"of"},{"key":"4","t":"want","say":"want"},{"key":"5","t":"dus","say":"dus"}],"R":[{"key":"5","t":"... dus ik ga naar bed","say":""},{"key":"3","t":"... of we bellen morgen","say":""},{"key":"4","t":"... want de winkel is dicht","say":""},{"key":"1","t":"... en zij ruimt op","say":""},{"key":"2","t":"... maar hij komt wel","say":""}]},{"k":"match","prompt":"Match 8. Match the subordinating conjunction to the clause that ends with its verb.","L":[{"key":"1","t":"omdat","say":"omdat"},{"key":"2","t":"terwijl","say":"terwijl"},{"key":"3","t":"voordat","say":"voordat"},{"key":"4","t":"nadat","say":"nadat"},{"key":"5","t":"zodat","say":"zodat"}],"R":[{"key":"5","t":"... zodat niemand het mist","say":""},{"key":"3","t":"... voordat de winkel sluit","say":""},{"key":"1","t":"... omdat het te laat is","say":""},{"key":"4","t":"... nadat de gasten weggingen","say":""},{"key":"2","t":"... terwijl de kinderen slapen","say":""}]},{"k":"match","prompt":"Match 9. Match the subordinating conjunction to the clause that ends with its verb.","L":[{"key":"1","t":"sinds","say":""},{"key":"2","t":"totdat","say":""},{"key":"3","t":"tenzij","say":""},{"key":"4","t":"doordat","say":""},{"key":"5","t":"zodra","say":""}],"R":[{"key":"3","t":"... tenzij hij eerder vertrekt","say":""},{"key":"5","t":"... zodra de bel gaat","say":""},{"key":"1","t":"... sinds de winkel verhuisd is","say":""},{"key":"4","t":"... doordat de wifi uitviel","say":""},{"key":"2","t":"... totdat de zon ondergaat","say":""}]},{"k":"match","prompt":"Match 10. Match the conjunction to a correctly-ordered example that uses it.","L":[{"key":"1","t":"dat","say":"dat"},{"key":"2","t":"hoewel","say":"hoewel"},{"key":"3","t":"mits","say":"mits"},{"key":"4","t":"aangezien","say":"aangezien"},{"key":"5","t":"noch ... noch","say":"noch"}],"R":[{"key":"3","t":"... mits iedereen akkoord gaat","say":""},{"key":"5","t":"hij drinkt noch bier noch wijn","say":""},{"key":"1","t":"... dat hij gelijk heeft","say":""},{"key":"4","t":"... aangezien niemand bezwaar maakte","say":""},{"key":"2","t":"... hoewel ze moe was","say":""}]},{"k":"tr","prompt":"Translate: \"I'm learning Dutch because my partner is Dutch.\"","ans":["ik leer nederlands omdat mijn partner nederlands is"],"why":"'omdat' — subordinating, reason. 'is' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"I'm not going outside, because it's cold.\" (want-version — keep normal order after \"want\")","ans":["ik ga niet naar buiten, want het is koud","ik ga niet naar buiten want het is koud"],"why":"'want' — coordinating. The clause after it keeps normal V2: 'het is koud', not 'het koud is'."},{"k":"tr","prompt":"Translate: \"I make coffee and she makes tea.\"","ans":["ik maak koffie en zij maakt thee"],"why":"'en' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"He listens to music while he works.\"","ans":["hij luistert naar muziek terwijl hij werkt"],"why":"'terwijl' — subordinating, simultaneity. 'werkt' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"I know that you are busy.\"","ans":["ik weet dat je druk bent"],"why":"'dat' — subordinating. 'bent' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"I like tea but I don't like coffee.\"","ans":["ik hou van thee maar ik hou niet van koffie","ik houd van thee maar ik houd niet van koffie"],"why":"'maar' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"I'm going for a run, although it's raining.\"","ans":["ik ga hardlopen, hoewel het regent","ik ga hardlopen hoewel het regent"],"why":"'hoewel' — subordinating, concession. 'regent' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"You can call me or you can send an email.\"","ans":["je kan me bellen of je kan een e-mail sturen","je kunt me bellen of je kunt een e-mail sturen"],"why":"'of' — coordinating. Both clauses keep normal V2 (modal + infinitive at the end of each, as usual)."},{"k":"tr","prompt":"Translate: \"I always check my phone before I leave the house.\"","ans":["ik check altijd mijn telefoon voordat ik het huis verlaat"],"why":"'voordat' — subordinating. 'verlaat' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"It was raining, so we stayed inside.\"","ans":["het regende, dus we bleven binnen","het regende dus we bleven binnen","het regende, dus bleven we binnen","het regende dus bleven we binnen"],"why":"'dus' — coordinating (normal order, 'dus we bleven'). The inverted form 'dus bleven we' is also common but that's 'dus' working as a fronted adverb, not as the plain coordinator."},{"k":"tr","prompt":"Translate: \"I feel calmer after I've talked to her.\"","ans":["ik voel me rustiger nadat ik met haar heb gepraat","ik voel me rustiger nadat ik met haar gepraat heb"],"why":"'nadat' — subordinating. The verb cluster 'heb gepraat' (or 'gepraat heb') sits together at the end of the clause."},{"k":"tr","prompt":"Translate: \"I'll call you if I have news.\"","ans":["ik bel je als ik nieuws heb"],"why":"'als' — subordinating, condition/time. 'heb' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"She's happy, because she passed her exam.\" (want-version)","ans":["ze is blij, want ze is geslaagd voor haar examen","ze is blij want ze is geslaagd voor haar examen"],"why":"'want' — coordinating. Normal V2 continues: 'ze is geslaagd', not 'ze geslaagd is'."},{"k":"tr","prompt":"Translate: \"Everything has felt lighter since we talked.\"","ans":["alles voelt lichter sinds we gepraat hebben","alles voelt lichter sinds we hebben gepraat"],"why":"'sinds' — subordinating, time. The verb cluster 'gepraat hebben' (or 'hebben gepraat') sits together at the end."},{"k":"tr","prompt":"Translate: \"He reads a lot and he writes even more.\"","ans":["hij leest veel en hij schrijft nog meer"],"why":"'en' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"We'll keep practicing until we get it right.\"","ans":["we blijven oefenen totdat we het goed doen"],"why":"'totdat' — subordinating. 'doen' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"I'm writing this down so that I don't forget it.\"","ans":["ik schrijf dit op zodat ik het niet vergeet"],"why":"'zodat' — subordinating, purpose. 'vergeet' moves to the end of the clause (the main clause's own separable verb 'opschrijven' still splits normally: 'schrijf ... op')."},{"k":"tr","prompt":"Translate: \"He wants to come but he doesn't have time.\"","ans":["hij wil komen maar hij heeft geen tijd"],"why":"'maar' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"We're going hiking unless it's raining.\"","ans":["we gaan wandelen tenzij het regent"],"why":"'tenzij' — subordinating, condition. 'regent' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"The trip was delayed because the train broke down.\" (impersonal-cause version)","ans":["de reis liep vertraging op doordat de trein kapotging"],"why":"'doordat' — subordinating, an impersonal mechanical cause (contrast with 'omdat', a person's reason). The separable verb 'kapotgaan' rejoins as one word at the end of the clause: 'kapotging'."},{"k":"tr","prompt":"Translate: \"We can stay home or we can go for a walk.\"","ans":["we kunnen thuisblijven of we kunnen een stukje lopen"],"why":"'of' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"You may borrow my car, provided that you refuel it.\"","ans":["je mag mijn auto lenen, mits je hem bijtankt","je mag mijn auto lenen mits je hem bijtankt"],"why":"'mits' — subordinating, a strict condition (stricter/more formal than 'als'). 'bijtankt' — the separable verb 'bijtanken' rejoins as one word at the end of the clause."},{"k":"tr","prompt":"Translate: \"I'll text you as soon as I arrive.\"","ans":["ik app je zodra ik aankom"],"why":"'zodra' — subordinating, 'the very next moment.' 'aankom' — the separable verb 'aankomen' rejoins as one word at the end of the clause."},{"k":"tr","prompt":"Translate: \"I was hungry, so I made a sandwich.\"","ans":["ik had honger, dus ik maakte een boterham","ik had honger dus ik maakte een boterham","ik had honger, dus maakte ik een boterham","ik had honger dus maakte ik een boterham"],"why":"'dus' — coordinating (normal order, 'dus ik maakte'). The inverted form is also common when 'dus' works as a fronted adverb instead."},{"k":"tr","prompt":"Translate: \"We're taking the train, since the roads are busy today.\"","ans":["we nemen de trein, aangezien de wegen vandaag druk zijn","we nemen de trein aangezien de wegen vandaag druk zijn"],"why":"'aangezien' — subordinating, formal; treats the reason as already obvious. 'zijn' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"I drink neither coffee nor tea.\"","ans":["ik drink noch koffie noch thee","ik drink noch thee noch koffie"],"why":"'noch ... noch' — coordinating; joins two objects inside one clause. Already negative — no extra 'niet' or 'geen', and 'drink' stays in its normal spot."},{"k":"tr","prompt":"Translate: \"Because he was busy, he called back later.\"","ans":["omdat hij druk was, belde hij later terug","omdat hij druk was belde hij later terug"],"why":"'omdat' fronted — the whole clause counts as position 1, so the main clause inverts: 'belde hij', not 'hij belde'. Separable 'terugbellen' splits normally in the (now-inverted) main clause."},{"k":"tr","prompt":"Translate: \"She hopes that everything goes well.\"","ans":["ze hoopt dat alles goed gaat"],"why":"'dat' — subordinating. 'gaat' moves to the end of the clause."},{"k":"tr","prompt":"Translate: \"He's staying in bed, because he has a fever.\" (want-version)","ans":["hij blijft in bed, want hij heeft koorts","hij blijft in bed want hij heeft koorts"],"why":"'want' — coordinating. Normal V2 continues: 'hij heeft koorts', not 'hij koorts heeft'."},{"k":"tr","prompt":"Translate: \"While she was traveling, I took care of the dog.\"","ans":["terwijl zij op reis was, zorgde ik voor de hond","terwijl zij op reis was zorgde ik voor de hond"],"why":"'terwijl' fronted — the whole clause counts as position 1, so the main clause inverts: 'zorgde ik', not 'ik zorgde'."},{"k":"tr","prompt":"Translate: \"We walk to the station and we take the train.\"","ans":["we lopen naar het station en we nemen de trein"],"why":"'en' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"Although she was nervous, she gave a great presentation.\"","ans":["hoewel ze zenuwachtig was, gaf ze een geweldige presentatie","hoewel ze zenuwachtig was gaf ze een geweldige presentatie"],"why":"'hoewel' fronted — the whole clause counts as position 1, so the main clause inverts: 'gaf ze', not 'ze gaf'."},{"k":"tr","prompt":"Translate: \"Before you sign, read the contract carefully.\" (imperative — command form)","ans":["voordat je tekent, lees het contract goed door","voordat je tekent lees het contract goed door"],"why":"'voordat' fronted — 'tekent' ends the subordinate clause. The main clause here is an imperative, which is already verb-first by nature: 'lees ... door'."},{"k":"tr","prompt":"Translate: \"We are tired but we keep going.\"","ans":["we zijn moe maar we gaan door"],"why":"'maar' — coordinating. Both clauses keep normal V2 (the second clause's separable verb 'doorgaan' splits normally: 'gaan door')."},{"k":"tr","prompt":"Translate: \"After we arrived, we unpacked our suitcases.\"","ans":["nadat we waren aangekomen, pakten we onze koffers uit","nadat we waren aangekomen pakten we onze koffers uit","nadat we aangekomen waren, pakten we onze koffers uit","nadat we aangekomen waren pakten we onze koffers uit"],"why":"'nadat' fronted — the aux+participle cluster 'waren aangekomen'/'aangekomen waren' are both standard. Main clause inverts: 'pakten we ... uit'."},{"k":"tr","prompt":"Translate: \"If you need help, just ask.\" (imperative — command form)","ans":["als je hulp nodig hebt, vraag het gewoon","als je hulp nodig hebt vraag het gewoon"],"why":"'als' fronted — 'hebt' ends the subordinate clause. The main clause is an imperative, already verb-first: 'vraag het gewoon'."},{"k":"tr","prompt":"Translate: \"She works on Monday or she works on Tuesday.\"","ans":["ze werkt op maandag of ze werkt op dinsdag"],"why":"'of' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"Since he started this job, he seems more confident.\"","ans":["sinds hij deze baan is begonnen, lijkt hij zelfverzekerder","sinds hij deze baan is begonnen lijkt hij zelfverzekerder","sinds hij deze baan begonnen is, lijkt hij zelfverzekerder","sinds hij deze baan begonnen is lijkt hij zelfverzekerder"],"why":"'sinds' fronted — the aux+participle cluster 'is begonnen'/'begonnen is' are both standard. Main clause inverts: 'lijkt hij'."},{"k":"tr","prompt":"Translate: \"Until the rain stops, we're staying inside.\"","ans":["totdat de regen stopt, blijven we binnen","totdat de regen stopt blijven we binnen"],"why":"'totdat' fronted — 'stopt' ends the subordinate clause, main clause inverts: 'blijven we'."},{"k":"tr","prompt":"Translate: \"She was tired, so she went to bed early.\"","ans":["ze was moe, dus ze ging vroeg naar bed","ze was moe dus ze ging vroeg naar bed","ze was moe, dus ging ze vroeg naar bed","ze was moe dus ging ze vroeg naar bed"],"why":"'dus' — coordinating (normal order, 'dus ze ging'). The inverted form is also common when 'dus' works as a fronted adverb instead."},{"k":"tr","prompt":"Translate: \"She speaks slowly so that everyone can follow.\"","ans":["ze spreekt langzaam zodat iedereen het kan volgen"],"why":"'zodat' — subordinating, purpose. The modal+infinitive cluster 'kan volgen' sits together at the end of the clause."},{"k":"tr","prompt":"Translate: \"Unless something changes, I'm quitting my job.\"","ans":["tenzij er iets verandert, stop ik met mijn baan","tenzij er iets verandert stop ik met mijn baan"],"why":"'tenzij' fronted — 'verandert' ends the subordinate clause, main clause inverts: 'stop ik'."},{"k":"tr","prompt":"Translate: \"We're going out to eat, because it's her birthday.\" (want-version)","ans":["we gaan uit eten, want het is haar verjaardag","we gaan uit eten want het is haar verjaardag"],"why":"'want' — coordinating. Normal V2 continues: 'het is haar verjaardag', not 'het haar verjaardag is'."},{"k":"tr","prompt":"Translate: \"Because the printer was broken, we couldn't print the tickets.\" (impersonal-cause version)","ans":["doordat de printer stuk was, konden we de tickets niet printen","doordat de printer stuk was konden we de tickets niet printen"],"why":"'doordat' fronted — an impersonal cause. 'was' ends the subordinate clause; main clause inverts with the modal cluster: 'konden we ... printen'."},{"k":"tr","prompt":"Translate: \"The picnic will go ahead, provided that the weather stays dry.\"","ans":["de picknick gaat door, mits het droog blijft","de picknick gaat door mits het droog blijft"],"why":"'mits' — subordinating, a strict condition. 'blijft' moves to the end of the clause; the main clause's separable verb 'doorgaan' splits normally: 'gaat door'."},{"k":"tr","prompt":"Translate: \"She loves music and she plays the piano every day.\"","ans":["ze houdt van muziek en ze speelt elke dag piano"],"why":"'en' — coordinating. Both clauses keep normal V2."},{"k":"tr","prompt":"Translate: \"As soon as it gets dark, the streetlights turn on.\"","ans":["zodra het donker wordt, gaan de straatlantaarns aan","zodra het donker wordt gaan de straatlantaarns aan"],"why":"'zodra' fronted — 'wordt' ends the subordinate clause. Main clause inverts and its separable verb 'aangaan' splits normally: 'gaan ... aan'."},{"k":"tr","prompt":"Translate: \"Since everyone already knows the plan, I'll keep this short.\"","ans":["aangezien iedereen het plan al kent, hou ik dit kort","aangezien iedereen het plan al kent houd ik dit kort","aangezien iedereen het plan al kent hou ik dit kort"],"why":"'aangezien' fronted — formal, treats the reason as obvious. 'kent' ends the subordinate clause; main clause inverts: 'hou(d) ik'."},{"k":"tr","prompt":"Translate: \"He speaks neither French nor German.\"","ans":["hij spreekt noch frans noch duits"],"why":"'noch ... noch' — coordinating; joins two objects inside one clause. Already negative — no extra 'niet' or 'geen'."},{"k":"tr","prompt":"Translate: \"She is small but she is strong.\"","ans":["ze is klein maar ze is sterk"],"why":"'maar' — coordinating. Both clauses keep normal V2."}]}]</script>
<script>
(function(){
'use strict';
var TOPICS = JSON.parse(document.getElementById('data').textContent);
var LS = 'ritme.v1';
var CHIPS = {v2:1, verbfinal:1, clusters:1, pronouns:1, conj:1};
var GROUPS = ['Word order','Verbs','Words and sound'];
var INT = [0,1,3,7,14];
var RUN_N = 12;

/* ---------- data ---------- */
var ITEMS = [], BYID = {}, TOP = {};
TOPICS.forEach(function(t){
  TOP[t.id] = t;
  t.items.forEach(function(it, n){ it.id = t.id + ':' + n; it.topic = t.id; ITEMS.push(it); BYID[it.id] = it; });
});

/* ---------- storage ---------- */
var S = load();
function load(){
  try{
    var r = localStorage.getItem(LS);
    if (r){ var o = JSON.parse(r); if (o && o.v === 1 && o.items) return o; }
  }catch(e){}
  return {v:1, items:{}, set:{chips:true}, runs:0};
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function today(){ var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*6e4)/864e5); }
function record(id, ok){
  var r = S.items[id] || (S.items[id] = {b:0, d:0, s:0, o:0, l:0});
  r.s++; if (ok) r.o++; r.l = ok ? 1 : 0;
  if (ok){ r.b = Math.min(r.b + 1, INT.length - 1); r.d = today() + INT[r.b]; }
  else { r.b = 0; r.d = today(); }
  save();
}

/* ---------- helpers ---------- */
function h(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(sel, el){ return (el || document).querySelector(sel); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[.,!?;:"“”'‘’`]/g,'').replace(/\s+/g,' ').trim();
}
function lev1(a, b){
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  var i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (a.length === b.length) return a.slice(i+1) === b.slice(i+1);
  if (a.length > b.length) return a.slice(i+1) === b.slice(i);
  return b.slice(i+1) === a.slice(i);
}
function ico(n){
  var p = {
    play:'<path d="M7 4.5v15l12-7.5z"/>',
    book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H19v-5"/>',
    bars:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    back:'<path d="M15 5l-7 7 7 7"/>'
  };
  return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + p[n] + '</svg>';
}
var voice = null;
function speak(text, rate){
  if (!('speechSynthesis' in window) || !text) return false;
  try{
    var u = new SpeechSynthesisUtterance(text); u.lang = 'nl-NL'; u.rate = rate || .9;
    if (!voice){ var vs = speechSynthesis.getVoices(); for (var i = 0; i < vs.length; i++){ if (/^nl/i.test(vs[i].lang)){ voice = vs[i]; break; } } }
    if (voice) u.voice = voice;
    speechSynthesis.cancel(); speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}
function ringHTML(p, seen){
  var c = seen ? (p >= 80 ? 'var(--good)' : p >= 55 ? 'var(--acc)' : 'var(--bad)') : 'var(--line)';
  return '<span class="ring" style="--p:' + (seen ? p : 0) + ';--c:' + c + '"><i>' + (seen ? p : '') + '</i></span>';
}
function topicStats(t){
  var seen = 0, good = 0, due = 0, td = today();
  t.items.forEach(function(it){
    var r = S.items[it.id]; if (!r) return;
    seen++; if (r.l) good++; if (r.d <= td) due++;
  });
  return {seen:seen, total:t.items.length, acc: seen ? Math.round(100*good/seen) : 0, due:due};
}
function mistakeItems(){ return ITEMS.filter(function(it){ var r = S.items[it.id]; return r && !r.l; }); }

/* ---------- views ---------- */
var view = 'home', R = null;
var $main = $('#main'), $tabs = $('#tabs'), $sheet = $('#sheet'), $ov = $('#ov');

function go(v){ view = v; hideSheet(); closeOv(); render(); window.scrollTo(0,0); }
function render(){
  var run = (view === 'run' || view === 'done');
  $tabs.style.display = run ? 'none' : 'flex';
  $main.className = view === 'run' ? 'run' : '';
  if (view === 'home') home();
  else if (view === 'rules') rules();
  else if (view === 'rule') rulePage(view.topic);
  else if (view === 'progress') progress();
  else if (view === 'run') showCard();
  else if (view === 'done') done();
  if (!run){
    $tabs.innerHTML = [['home','play','Practice'],['rules','book','Rules'],['progress','bars','Progress']].map(function(t){
      var cur = (view === t[0]) || (view === 'rule' && t[0] === 'rules');
      return '<button data-go="' + t[0] + '"' + (cur ? ' aria-current="page"' : '') + '>' + ico(t[1]) + t[2] + '</button>';
    }).join('');
  }
}
var curTopic = null;
function openTopic(id){ curTopic = id; view = 'rule'; hideSheet(); render(); window.scrollTo(0,0); }

function tileHTML(t){
  var st = topicStats(t);
  return '<button class="tile" data-topic="' + t.id + '">' + ringHTML(st.acc, st.seen) +
    '<span><b>' + h(t.name) + '</b><span class="m">' + (st.seen ? st.seen + ' of ' + st.total + ' seen' : st.total + ' cards, new') + '</span></span></button>';
}
function home(){
  var td = today(), due = ITEMS.filter(function(it){ var r = S.items[it.id]; return r && r.d <= td; }).length;
  var mis = mistakeItems().length;
  var out = '<h1>Ritme</h1><p class="sub">Dutch grammar: the rule first, then practice that comes back.</p>';
  out += '<div class="panel edge" style="margin-top:20px"><div class="m">Today’s run</div>' +
    '<div style="font-size:17px;font-weight:600;margin:2px 0 4px">' + RUN_N + ' cards, about 5 min</div>' +
    '<div class="m" style="margin-bottom:12px">' + (due ? due + ' due for review, the rest new.' : 'Mixed topics, weakest first.') + '</div>' +
    '<button class="btn" data-act="run">Start</button></div>';
  out += mis ? '<button class="rowbtn" data-act="fix"><span>Fix my mistakes</span><span class="m">' + mis + ' waiting</span></button>'
             : '<div class="rowbtn" style="color:var(--dim)"><span>Fix my mistakes</span><span class="m">nothing waiting</span></div>';
  GROUPS.forEach(function(g){
    out += '<h2>' + g + '</h2><div class="grid">' + TOPICS.filter(function(t){ return t.group === g; }).map(tileHTML).join('') + '</div>';
  });
  $main.innerHTML = out;
}
function rules(){
  var out = '<h1>Rules</h1><p class="sub">One short card per topic. Tap to read it, then practise it.</p>';
  GROUPS.forEach(function(g){
    out += '<h2>' + g + '</h2>';
    TOPICS.filter(function(t){ return t.group === g; }).forEach(function(t){
      var st = topicStats(t);
      out += '<button class="rowbtn" data-topic="' + t.id + '"><span class="row">' + ringHTML(st.acc, st.seen) +
        '<span><b style="font-weight:500">' + h(t.name) + '</b><br><span class="m">' + h(t.title) + '</span></span></span></button>';
    });
  });
  $main.innerHTML = out;
}
function ruleBody(t){
  return '<div class="rule">' + t.rule + '</div>';
}
function decorateRule(root){
  $all('blockquote.example', root).forEach(function(b){
    var nl = $('.nl', b); if (!nl || $('.say', b)) return;
    var t = nl.textContent.replace(/→.*$/, '').trim();
    var btn = document.createElement('button'); btn.className = 'say'; btn.setAttribute('data-say', t); btn.setAttribute('aria-label', 'Hear it');
    nl.appendChild(btn);
  });
  $all('table', root).forEach(function(tb){
    var w = document.createElement('div'); w.className = 'scroll'; tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
  });
}
function $all(sel, el){ return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
function rulePage(){
  var t = TOP[curTopic];
  $main.innerHTML = '<button class="x" data-go="rules" aria-label="Back to rules" style="margin-bottom:10px">' + ico('back') + '</button>' +
    '<div class="k">' + h(t.group) + '</div><h1 style="margin:2px 0 4px">' + h(t.name) + '</h1><p class="sub">' + h(t.title) + '</p>' +
    ruleBody(t) +
    '<div style="margin-top:22px"><button class="btn" data-act="topicrun" data-topic="' + t.id + '">Practise this topic</button></div>';
  decorateRule($main);
}
function progress(){
  var seen = 0, good = 0;
  ITEMS.forEach(function(it){ var r = S.items[it.id]; if (r){ seen++; if (r.l) good++; } });
  var out = '<h1>Progress</h1><p class="sub">Stored on this device only.</p>';
  out += '<div class="stat" style="margin-top:18px"><div><b>' + seen + '</b><span class="m">of ' + ITEMS.length + ' cards seen</span></div>' +
    '<div><b>' + (seen ? Math.round(100*good/seen) + '%' : '-') + '</b><span class="m">last answer right</span></div>' +
    '<div><b>' + (S.runs || 0) + '</b><span class="m">runs finished</span></div></div>';
  out += '<h2>By topic</h2>';
  TOPICS.forEach(function(t){
    var st = topicStats(t);
    out += '<div class="srow">' + ringHTML(st.acc, st.seen) + '<div class="sp"><div>' + h(t.name) + '</div><div class="m">' +
      (st.seen ? st.seen + ' of ' + st.total + ' seen' : 'not started') + (st.due ? ', ' + st.due + ' due' : '') + '</div></div></div>';
  });
  out += '<h2>Settings</h2><button class="sw" data-act="chips" aria-pressed="' + (S.set.chips !== false) + '"><span>Word chips for word-order topics<br><span class="m">Off means you type the sentence.</span></span><i></i></button>';
  out += '<h2>Your data</h2><div class="row"><button class="btn sec" data-act="backup">Download backup</button><button class="btn sec" data-act="restore">Restore</button></div>' +
    '<input type="file" id="file" accept="application/json,.json" style="display:none">' +
    '<div style="margin-top:10px"><button class="btn sec" data-act="reset" style="color:var(--bad)">Reset all data</button></div>' +
    '<p class="m" id="msg" role="status" style="margin-top:10px"></p>';
  out += '<h2>About</h2><div class="about">' +
    '<p>Everything is in this one file. It makes no network requests, and its only stored data is the key <code>ritme.v1</code> in this browser.</p>' +
    '<p>The Dutch is read aloud by your device’s own speech voice. Add a Dutch voice in your device settings if it sounds off.</p>' +
    '<p><b>De / het items</b> use gender tags and English glosses from <a href="https://en.wiktionary.org">Wiktionary</a>, via the kaikki.org extract, and a selection ranked with the <a href="https://github.com/hermitdave/FrequencyWords">FrequencyWords</a> Dutch list (OpenSubtitles). Both are licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Changes: 150 of 1,000 items selected, example sentences added. Those items are shared under the same licence.</p>' +
    '</div>';
  $main.innerHTML = out;
}

/* ---------- runs ---------- */
function buildRun(topicId, mode){
  var td = today(), pool = topicId ? ITEMS.filter(function(i){ return i.topic === topicId; }) : ITEMS, q = [];
  if (mode === 'fix'){
    return shuffle(mistakeItems()).slice(0, RUN_N);
  }
  var due = pool.filter(function(i){ var r = S.items[i.id]; return r && r.d <= td; })
    .sort(function(a, b){ var x = S.items[a.id], y = S.items[b.id]; return (x.b - y.b) || (x.d - y.d); });
  q = due.slice(0, 8);
  var fresh = pool.filter(function(i){ return !S.items[i.id]; });
  if (!topicId){
    var tops = TOPICS.slice().sort(function(a, b){ return weak(a) - weak(b); });
    var by = {}; tops.forEach(function(t){ by[t.id] = shuffle(fresh.filter(function(i){ return i.topic === t.id; })); });
    var k = 0, guard = 0;
    while (q.length < RUN_N && guard++ < 400){
      var t = tops[k % tops.length]; k++;
      if (by[t.id].length) q.push(by[t.id].pop());
    }
  } else {
    shuffle(fresh).slice(0, RUN_N - q.length).forEach(function(i){ q.push(i); });
  }
  if (q.length < RUN_N){
    var have = {}; q.forEach(function(i){ have[i.id] = 1; });
    pool.filter(function(i){ return S.items[i.id] && !have[i.id]; })
      .sort(function(a, b){ return S.items[a.id].d - S.items[b.id].d; })
      .slice(0, RUN_N - q.length).forEach(function(i){ q.push(i); });
  }
  return shuffle(q);
}
function weak(t){ var s = topicStats(t); return s.seen ? s.acc : 50; }
function startRun(topicId, mode){
  var q = buildRun(topicId, mode);
  if (!q.length){ return; }
  R = {q:q, i:0, total:q.length, first:{}, ok:0, missed:[], typed:{}};
  view = 'run'; render(); window.scrollTo(0,0);
}

/* ---------- cards ---------- */
var cur = null;
function showCard(){
  hideSheet();
  var it = R.q[R.i];
  var done = Object.keys(R.first).length;
  var head = '<div class="top"><button class="x" data-act="exit" aria-label="Leave this run">' + ico('x') + '</button><div class="bar"><i style="width:' + Math.round(100*done/R.total) + '%"></i></div><span class="m">' + Math.min(done + 1, R.total) + '/' + R.total + '</span></div>';
  $main.innerHTML = head + '<div id="card"></div>';
  cur = {item:it, locked:false};
  var el = $('#card');
  if (it.k === 'mc') mcCard(it, el);
  else if (it.k === 'fill') fillCard(it, el);
  else if (it.k === 'tr') trCard(it, el);
  else matchCard(it, el);
}
function chipMode(it){
  if (R.typed[it.id] !== undefined) return !R.typed[it.id];
  return !!CHIPS[it.topic] && S.set.chips !== false;
}
function finish(it, ok, o){
  if (cur.locked) return; cur.locked = true;
  if (!(it.id in R.first)){
    R.first[it.id] = ok; record(it.id, ok);
    if (ok) R.ok++; else R.missed.push(it);
  }
  R.back = R.back || {};
  if (!ok && !R.back[it.id]){
    R.back[it.id] = 1; R.q.splice(Math.min(R.i + 4, R.q.length), 0, it);
    R.total = Object.keys(R.first).length + (R.q.length - R.i - 1);
  }
  var last = R.i >= R.q.length - 1;
  var html = '<div class="st">' + (ok ? 'Correct' : 'Not quite') + '</div><div class="why">' + (o.html || '') + '</div>' +
    (!ok && R.back[it.id] === 1 && !last ? '<div class="m" style="margin-bottom:10px">This one comes back in a few cards.</div>' : '') +
    '<div class="m" style="margin-bottom:10px"><button class="link" data-act="seerule" style="padding:0;text-align:left">Open the ' + h(TOP[it.topic].name.toLowerCase()) + ' rule</button></div>' +
    '<div class="row">' + (o.say ? '<button class="say big" data-say="' + h(o.say) + '" aria-label="Hear the sentence"></button>' : '') +
    '<button class="btn" data-act="next" id="nextbtn">' + (last ? 'Finish' : 'Next') + '</button></div>';
  showSheet(ok, html);
  var nb = $('#nextbtn'); if (nb) nb.focus({preventScroll:true});
}
function showSheet(ok, html){ $sheet.className = (ok ? '' : 'bad ') + 'show'; $sheet.innerHTML = html; }
function hideSheet(){ $sheet.className = ''; $sheet.innerHTML = ''; }
function next(){
  if (R.i >= R.q.length - 1){ S.runs = (S.runs || 0) + 1; save(); view = 'done'; hideSheet(); render(); window.scrollTo(0,0); return; }
  R.i++; showCard(); window.scrollTo(0,0);
}

function labelFor(it){
  if (it.k === 'mc'){ return {A:'Pick the right sentence', C:'Spot the mistake', D:'Build the sentence', article:'De or het?', hear:'What did they actually say?'}[it.sub] || 'Pick one'; }
  if (it.k === 'fill') return 'Fill in the blank';
  if (it.k === 'tr') return 'Translate it';
  return 'Match the pairs';
}
function blankify(p, fill){ return h(p).replace(/_{2,}/g, '<span class="slot">' + (fill ? h(fill) : '&nbsp;') + '</span>'); }

function mcCard(it, el){
  var correct = it.opts.filter(function(o){ return o.ok; })[0];
  var isArt = it.sub === 'article', isHear = it.sub === 'hear', isSpot = it.sub === 'C';
  var opts = isArt ? it.opts.slice().sort(function(a, b){ return a.t < b.t ? -1 : 1; }) : shuffle(it.opts);
  var out = '<div class="k lab">' + labelFor(it) + '</div>';
  if (isHear){
    out += '<div class="listen"><button class="play" data-say="' + h(it.say) + '" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></button>' +
      '<span class="m">Tap to hear it again</span><button class="link" data-slow="' + h(it.say) + '" style="padding:2px">Play slowly</button>' +
      '<div id="reveal" class="prompt serif" style="display:none;margin:6px 0 0">“' + h(it.say) + '”</div>' +
      '<button class="link" id="showtext" style="padding:2px">Show the text</button></div>';
    if (!('speechSynthesis' in window)) out += '<p class="m">This browser has no speech, so the text is shown.</p><p class="prompt serif">“' + h(it.say) + '”</p>';
  } else if (isArt){
    out += '<p class="prompt serif" style="font-size:22px">' + blankify(it.prompt) + '</p>';
  } else {
    out += '<p class="prompt' + (isSpot ? '' : ' serif') + '">' + h(it.prompt) + '</p>';
  }
  if (it.gloss && !isArt) out += '<p class="gloss">' + h(it.gloss) + '</p>';
  out += '<div class="' + (isArt ? 'two' : 'opts') + '">' + opts.map(function(o, i){ return '<button class="opt" data-i="' + i + '">' + h(o.t) + '</button>'; }).join('') + '</div>';
  el.innerHTML = out;
  if (isHear){
    $('#showtext', el).onclick = function(){ $('#reveal', el).style.display = 'block'; this.style.display = 'none'; };
    if (!('speechSynthesis' in window)) $('#showtext', el).click();
  }
  $all('.opt', el).forEach(function(b){
    b.onclick = function(){
      if (cur.locked) return;
      var o = opts[+b.getAttribute('data-i')];
      $all('.opt', el).forEach(function(x){ x.disabled = true; });
      b.classList.add(o.ok ? 'good' : 'bad');
      if (!o.ok) $all('.opt', el).forEach(function(x){ if (opts[+x.getAttribute('data-i')].ok) x.classList.add('good'); });
      var why, say = '';
      var fixwhy = function(s){ return s.replace(/^(Correct|This one is correct)\s*[—-]\s*/i, ''); };
      if (isSpot){
        why = o.ok ? o.why : '<b>That sentence is fine.</b> ' + h(fixwhy(o.why)) + '<br><b>The mistake is:</b> ' + h(correct.t) + ' ' + h(correct.why);
        if (o.ok) why = h(o.why);
      } else if (isArt){
        why = o.ok ? h(o.why) : h(o.why);
        say = it.prompt.replace(/_{2,}/g, correct.t);
        if (it.gloss) why += '<br><span class="m">' + h(it.gloss) + '</span>';
      } else {
        why = o.ok ? h(o.why) : h(o.why) + '<br><b>Answer:</b> ' + h(correct.t);
        say = isHear ? it.say : correct.t;
      }
      if (isHear) $('#reveal', el).style.display = 'block';
      finish(it, o.ok, {html: why, say: say});
    };
  });
}
function fillCard(it, el){
  el.innerHTML = '<div class="k lab">Fill in the blank</div><p class="prompt serif">' + blankify(it.prompt) + '</p>' +
    (it.gloss ? '<p class="gloss">' + h(it.gloss) + '</p>' : '') +
    '<input class="inp" id="in" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="type the missing word" aria-label="Your answer">' +
    '<div style="margin-top:12px"><button class="btn" id="chk">Check</button></div>';
  var inp = $('#in', el);
  function check(){
    if (cur.locked) return;
    var v = norm(inp.value); if (!v) return;
    var answers = it.ans.map(norm), ok = answers.indexOf(v) >= 0;
    var near = !ok && answers.some(function(a){ return a.length >= 4 && lev1(v, a); });
    inp.classList.add(ok ? 'good' : 'bad'); inp.readOnly = true;
    $('.slot', el).textContent = it.ans[0];
    finish(it, ok, {html: (ok ? '' : (near ? 'One letter off. ' : '') + '<b>Answer:</b> ' + h(it.ans[0]) + '. ') + h(it.why),
      say: it.prompt.replace(/_{2,}/g, it.ans[0])});
  }
  $('#chk', el).onclick = check;
  inp.onkeydown = function(e){ if (e.key === 'Enter') check(); };
}
function trCard(it, el){
  var en = it.prompt.replace(/^Translate:\s*/i, '');
  var chips = chipMode(it);
  var head = '<div class="k lab">Translate it</div><p class="prompt">' + h(en) + '</p>';
  if (!chips){
    el.innerHTML = head + '<input class="inp" id="in" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="type the Dutch sentence" aria-label="Your answer">' +
      '<div style="margin-top:12px"><button class="btn" id="chk">Check</button></div>' +
      (CHIPS[it.topic] ? '<div style="text-align:center"><button class="link" id="tog">Use word chips</button></div>' : '');
    var inp = $('#in', el);
    var check = function(){
      if (cur.locked) return;
      var v = norm(inp.value); if (!v) return;
      var ok = it.ans.map(norm).indexOf(v) >= 0;
      inp.classList.add(ok ? 'good' : 'bad'); inp.readOnly = true;
      finish(it, ok, {html: (ok ? '' : '<b>A correct version:</b> ' + h(it.ans[0]) + '. ') + h(it.why), say: it.ans[0]});
    };
    $('#chk', el).onclick = check; inp.onkeydown = function(e){ if (e.key === 'Enter') check(); };
    var tg = $('#tog', el); if (tg) tg.onclick = function(){ R.typed[it.id] = false; showCard(); };
    return;
  }
  var toks = it.ans[0].split(' ').map(function(t, i){ return {t:t, id:i}; });
  var own = {}; toks.forEach(function(x){ own[x.t] = 1; });
  var pool = [];
  TOP[it.topic].items.forEach(function(o){ if (o.k === 'tr' && o !== it) o.ans[0].split(' ').forEach(function(w){ if (!own[w] && pool.indexOf(w) < 0) pool.push(w); }); });
  var extra = shuffle(pool).slice(0, 3).map(function(t, i){ return {t:t, id:100 + i}; });
  var bank = shuffle(toks.concat(extra)), placed = [];
  function draw(){
    $('#line', el).innerHTML = placed.map(function(x){ return '<button class="chip" data-p="' + x.id + '">' + h(x.t) + '</button>'; }).join('');
    $('#bank', el).innerHTML = bank.map(function(x){ return '<button class="chip' + (placed.indexOf(x) >= 0 ? ' used' : '') + '" data-b="' + x.id + '"' + (placed.indexOf(x) >= 0 ? ' tabindex="-1" aria-hidden="true"' : '') + '>' + h(x.t) + '</button>'; }).join('');
  }
  el.innerHTML = head + '<div class="line" id="line" aria-label="Your sentence"></div><div class="bank" id="bank"></div>' +
    '<div style="margin-top:16px"><button class="btn" id="chk">Check</button></div><div style="text-align:center"><button class="link" id="tog">Type it instead</button></div>';
  draw();
  el.onclick = function(e){
    if (cur.locked) return;
    var b = e.target.closest('.chip'); if (!b) return;
    if (b.hasAttribute('data-b')){ var x = bank.filter(function(y){ return String(y.id) === b.getAttribute('data-b'); })[0]; if (placed.indexOf(x) < 0) placed.push(x); }
    else { var id = b.getAttribute('data-p'); placed = placed.filter(function(y){ return String(y.id) !== id; }); }
    draw();
  };
  $('#chk', el).onclick = function(){
    if (cur.locked || !placed.length) return;
    var v = norm(placed.map(function(x){ return x.t; }).join(' '));
    var ok = it.ans.map(norm).indexOf(v) >= 0;
    $('#line', el).classList.add(ok ? 'good' : 'bad');
    finish(it, ok, {html: (ok ? '' : '<b>A correct version:</b> ' + h(it.ans[0]) + '. ') + h(it.why), say: it.ans[0]});
  };
  $('#tog', el).onclick = function(){ R.typed[it.id] = true; showCard(); };
}
function matchCard(it, el){
  var L = it.L, Rr = shuffle(it.R), sel = null, left = L.length, mistakes = 0;
  el.innerHTML = '<div class="k lab">Match the pairs</div><p class="prompt">' + h(it.prompt) + '</p><p class="gloss">Tap one on the left, then its match on the right.</p>' +
    '<div class="cols"><div class="col" id="cl">' + L.map(function(x, i){ return '<button class="mi" data-s="l" data-i="' + i + '">' + h(x.t) + '</button>'; }).join('') + '</div>' +
    '<div class="col" id="cr">' + Rr.map(function(x, i){ return '<button class="mi" data-s="r" data-i="' + i + '">' + h(x.t) + '</button>'; }).join('') + '</div></div>';
  el.onclick = function(e){
    if (cur.locked) return;
    var b = e.target.closest('.mi'); if (!b || b.classList.contains('done')) return;
    var side = b.getAttribute('data-s'), i = +b.getAttribute('data-i');
    if (side === 'l'){
      $all('#cl .mi', el).forEach(function(x){ x.classList.remove('sel'); });
      sel = b; b.classList.add('sel'); if (L[i].say) speak(L[i].say);
      return;
    }
    if (!sel) return;
    var lk = L[+sel.getAttribute('data-i')].key;
    if (Rr[i].key === lk){
      sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel = null; left--;
      if (!left) finish(it, mistakes <= 1, {html: mistakes ? mistakes + ' wrong tap' + (mistakes > 1 ? 's' : '') + '. A board counts as right with one slip at most.' : 'No slips.'});
    } else {
      mistakes++; b.classList.add('flash'); setTimeout(function(){ b.classList.remove('flash'); }, 500);
    }
  };
}

function done(){
  var good = R.ok, n = Object.keys(R.first).length;
  var out = '<div class="done"><div class="k">Run finished</div><div class="big">' + good + ' of ' + n + '</div><p class="sub">right on the first try.</p>';
  if (R.missed.length){
    out += '<h2>Coming back</h2>';
    var seen = {};
    R.missed.forEach(function(it){ seen[it.topic] = (seen[it.topic] || 0) + 1; });
    Object.keys(seen).forEach(function(id){ out += '<button class="rowbtn" data-topic="' + id + '"><span>' + h(TOP[id].name) + '</span><span class="m">' + seen[id] + ' missed, read the rule</span></button>'; });
  }
  out += '<div style="margin-top:24px" class="row"><button class="btn" data-act="run">Another run</button><button class="btn sec" data-go="home">Home</button></div></div>';
  $main.innerHTML = out;
}

/* ---------- overlay: rule during a run ---------- */
function openOv(id){
  var t = TOP[id];
  $ov.innerHTML = '<div class="in"><button class="x" data-act="closeov" aria-label="Close the rule" style="margin-bottom:10px">' + ico('x') + '</button><div class="k">' + h(t.group) + '</div><h1 style="margin:2px 0 4px">' + h(t.name) + '</h1>' + ruleBody(t) +
    '<div style="margin-top:22px"><button class="btn sec" data-act="closeov">Back to the run</button></div></div>';
  decorateRule($ov); $ov.className = 'show'; $ov.scrollTop = 0;
  var c = $('.x', $ov); if (c) c.focus();
}
function closeOv(){ $ov.className = ''; $ov.innerHTML = ''; }

/* ---------- backup ---------- */
function msg(t){ var m = $('#msg'); if (m) m.textContent = t; }
function backup(){
  var blob = new Blob([JSON.stringify({app:'ritme', v:1, data:S})], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'ritme-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  msg('Backup downloaded. It holds your progress only, no personal details.');
}
function restore(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var o = JSON.parse(fr.result);
      if (!o || o.app !== 'ritme' || o.v !== 1 || !o.data || typeof o.data.items !== 'object') throw 0;
      var items = {};
      Object.keys(o.data.items).forEach(function(id){
        var r = o.data.items[id];
        if (BYID[id] && r && isFinite(r.b) && isFinite(r.d) && isFinite(r.s) && isFinite(r.o))
          items[id] = {b: Math.max(0, Math.min(INT.length-1, r.b|0)), d: r.d|0, s: r.s|0, o: r.o|0, l: r.l ? 1 : 0};
      });
      S = {v:1, items:items, set:{chips: !(o.data.set && o.data.set.chips === false)}, runs: (o.data.runs|0)};
      save(); render(); msg('Restored ' + Object.keys(items).length + ' cards.');
    }catch(e){ msg('That file is not a Ritme backup.'); }
  };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var d;
  if ((d = b.getAttribute('data-say')) !== null && b.id !== 'chk'){ speak(d); return; }
  if ((d = b.getAttribute('data-slow')) !== null){ speak(d, .6); return; }
  if ((d = b.getAttribute('data-go'))){ go(d); return; }
  var tp = b.getAttribute('data-topic');
  var act = b.getAttribute('data-act');
  if (act === 'run'){ startRun(null); return; }
  if (act === 'fix'){ startRun(null, 'fix'); return; }
  if (act === 'topicrun'){ startRun(tp); return; }
  if (act === 'exit'){ go('home'); return; }
  if (act === 'next'){ next(); return; }
  if (act === 'seerule'){ openOv(cur.item.topic); return; }
  if (act === 'closeov'){ closeOv(); var nb = $('#nextbtn'); if (nb) nb.focus({preventScroll:true}); return; }
  if (act === 'chips'){ S.set.chips = !(S.set.chips !== false); save(); render(); return; }
  if (act === 'backup'){ backup(); return; }
  if (act === 'restore'){ var f = $('#file'); if (f){ f.onchange = function(){ if (f.files[0]) restore(f.files[0]); }; f.click(); } return; }
  if (act === 'reset'){
    if (confirm('Delete all your Ritme progress on this device? This cannot be undone.')){
      S = {v:1, items:{}, set:{chips:true}, runs:0}; try{ localStorage.removeItem(LS); }catch(x){} render(); msg('All progress deleted.');
    }
    return;
  }
  if (tp){ if (view === 'done' || view === 'run') { R = null; } openTopic(tp); return; }
});
if ('speechSynthesis' in window){ try{ speechSynthesis.onvoiceschanged = function(){ voice = null; }; }catch(e){} }
render();
})();
</script>
</body>
