l you today.\"","opts":[{"t":"Omdat ik morgen aankom, bel ik je vandaag op.","ok":true,"why":"Correct in both halves — aankom stays attached in the omdat-clause, bel inverts before ik, and op ends up at the very end."},{"t":"Omdat ik morgen kom aan, bel ik je vandaag op.","ok":false,"why":"The omdat-clause is wrong — the prefix can't split there: it should be '... aankom', not '... kom aan'."},{"t":"Omdat ik morgen aankom, ik bel je vandaag op.","ok":false,"why":"The main clause isn't inverted after the fronted omdat-clause — it should be 'bel ik', not 'ik bel'."}]},{"k":"mc","sub":"D","prompt":"\"While I clean up, he calls his mother.\"","opts":[{"t":"Terwijl ik ruim op, belt hij zijn moeder op.","ok":false,"why":"The terwijl-clause is wrong — opruim can't split there: it should be 'ik opruim', not 'ik ruim op'."},{"t":"Terwijl ik opruim, belt hij zijn moeder op.","ok":true,"why":"Correct in both halves — opruim stays attached in the terwijl-clause, belt inverts before hij, and op ends the main clause."},{"t":"Terwijl ik opruim, hij belt zijn moeder op.","ok":false,"why":"The main clause isn't inverted after the fronted terwijl-clause — it should be 'belt hij', not 'hij belt'."}]},{"k":"mc","sub":"D","prompt":"\"I try to come back before six.\"","opts":[{"t":"Ik probeer voor zessen terug te komen.","ok":true,"why":"Correct — te wedges between terug and komen, and the time phrase precedes the whole cluster."},{"t":"Ik probeer voor zessen te terugkomen.","ok":false,"why":"te is glued to the front of the whole verb instead of wedging between the prefix and the stem."},{"t":"Ik probeer voor zessen terug komen te.","ok":false,"why":"te has drifted to the very end instead of sitting between terug and komen."}]},{"k":"mc","sub":"D","prompt":"\"I know that she has already put on her coat.\"","opts":[{"t":"Ik weet dat ze haar jas al heeft aangetrokken.","ok":true,"why":"Correct — ge- wedges between aan and getrokken, written as one word: aangetrokken."},{"t":"Ik weet dat ze haar jas al heeft geaantrokken.","ok":false,"why":"ge- is glued to the front of the whole word instead of wedging between the prefix and the stem — 'geaantrokken' isn't a word."},{"t":"Ik weet dat ze haar jas al heeft aan getrokken.","ok":false,"why":"The participle is one word, not two — 'aan getrokken' should be 'aangetrokken'."}]},{"k":"mc","sub":"D","prompt":"\"Because I met him yesterday, I'm happy.\"","opts":[{"t":"Omdat ik hem gisteren ontmoette, ben ik blij.","ok":true,"why":"Correct — ontmoeten never splits, and the main clause inverts properly after the fronted omdat-clause."},{"t":"Omdat ik hem gisteren ontmoette op, ben ik blij.","ok":false,"why":"ontmoeten has no separable prefix 'op' to strand — this invents a split that doesn't exist."},{"t":"Omdat ik hem gisteren ontmoette, ik ben blij.","ok":false,"why":"The main clause isn't inverted after the fronted omdat-clause — it should be 'ben ik', not 'ik ben'."}]},{"k":"mc","sub":"D","prompt":"\"Although he is tired, the meeting goes ahead.\"","opts":[{"t":"Hoewel hij moe is, gaat de vergadering door.","ok":true,"why":"Correct — is ends the hoewel-clause, and gaat inverts before de vergadering with door stranded at the end."},{"t":"Hoewel hij is moe, gaat de vergadering door.","ok":false,"why":"The hoewel-clause verb isn't at the end — it should be 'hij moe is', not 'hij is moe'."},{"t":"Hoewel hij moe is, de vergadering gaat door.","ok":false,"why":"The main clause isn't inverted after the fronted hoewel-clause — it should be 'gaat de vergadering', not 'de vergadering gaat'."}]},{"k":"mc","sub":"D","prompt":"\"She hopes to suggest a good plan tomorrow.\"","opts":[{"t":"Ze hoopt morgen een goed plan voor te stellen.","ok":true,"why":"Correct — te wedges between voor and stellen: voor te stellen."},{"t":"Ze hoopt morgen een goed plan te voorstellen.","ok":false,"why":"te is glued to the front of the whole verb instead of wedging between the prefix and the stem."},{"t":"Ze hoopt morgen een goed plan voorstellen te.","ok":false,"why":"te has drifted to the very end instead of sitting between voor and stellen."}]},{"k":"mc","sub":"D","prompt":"\"I have already brought my laptop today.\"","opts":[{"t":"Ik heb mijn laptop vandaag al meegenomen.","ok":true,"why":"Correct — ge- wedges between mee and nomen, written as one word: meegenomen."},{"t":"Ik heb mijn laptop vandaag al gemeenomen.","ok":false,"why":"ge- is glued to the front of the whole word instead of wedging in: it should be mee-ge-nomen, 'meegenomen'."},{"t":"Ik heb meegenomen mijn laptop vandaag al.","ok":false,"why":"The participle has drifted out of its clause-final position — it belongs after vandaag al, not right after heb."}]},{"k":"mc","sub":"D","prompt":"\"I know that he still needs to come back.\"","opts":[{"t":"Ik weet dat hij nog moet terugkomen.","ok":true,"why":"Correct — moet is the finite verb, so terugkomen stays whole as a single-word infinitive at the end."},{"t":"Ik weet dat hij nog moet komen terug.","ok":false,"why":"terugkomen is split even though it's not the finite verb here — moet is, so terugkomen should stay whole."},{"t":"Ik weet dat hij nog moet terugkomt.","ok":false,"why":"A modal has to be followed by an infinitive, not a conjugated form — it should be 'moet terugkomen', not 'moet terugkomt'."}]},{"k":"mc","sub":"D","prompt":"\"Although he forgot the tickets, we went out anyway.\"","opts":[{"t":"Hoewel hij de kaartjes vergat, gingen we toch uit.","ok":true,"why":"Correct — vergat never splits, and the main clause inverts properly with uit stranded at the end."},{"t":"Hoewel hij de kaartjes vergat op, gingen we toch uit.","ok":false,"why":"vergeten has no separable prefix 'op' to strand — this invents a split that doesn't exist."},{"t":"Hoewel hij de kaartjes vergat, we gingen toch uit.","ok":false,"why":"The main clause isn't inverted after the fronted hoewel-clause — it should be 'gingen we', not 'we gingen'."}]},{"k":"tr","prompt":"Translate: \"I call my sister every day.\"","ans":["ik bel mijn zus elke dag op","ik bel elke dag mijn zus op"],"why":"op detaches to the very end either way; the object and time phrase can trade places in the middle field."},{"k":"tr","prompt":"Translate: \"The train arrives at nine.\"","ans":["de trein komt om negen uur aan"],"why":"komt stays in position 2, aan travels to the very end."},{"k":"tr","prompt":"Translate: \"I'm happy because he's coming back tomorrow.\"","ans":["ik ben blij omdat hij morgen terugkomt"],"why":"terugkomt stays one unbroken unit at the end of the omdat-clause."},{"k":"tr","prompt":"Translate: \"I think that she's suggesting a good idea.\"","ans":["ik denk dat ze een goed idee voorstelt","ik denk dat zij een goed idee voorstelt"],"why":"voorstelt is kept together as one unit at the end of the dat-clause, not stelt ... voor."},{"k":"tr","prompt":"Translate: \"I promise to come back soon.\"","ans":["ik beloof snel terug te komen"],"why":"te wedges between terug and komen: terug te komen."},{"k":"tr","prompt":"Translate: \"I try to clean up my room every week.\"","ans":["ik probeer elke week mijn kamer op te ruimen","ik probeer mijn kamer elke week op te ruimen"],"why":"op te ruimen stays together as a unit at the end; the object and time phrase can trade places before it."},{"k":"tr","prompt":"Translate: \"I have suggested a new plan.\"","ans":["ik heb een nieuw plan voorgesteld"],"why":"ge- wedges between voor and gesteld: voorgesteld."},{"k":"tr","prompt":"Translate: \"He has put on his coat.\"","ans":["hij heeft zijn jas aangetrokken"],"why":"ge- wedges between aan and getrokken: aangetrokken."},{"k":"tr","prompt":"Translate: \"I forgot to call him.\"","ans":["ik ben vergeten hem te bellen","ik heb vergeten hem te bellen"],"why":"vergeten never splits and never takes ge- — and since it's inseparable, te stays in front of bellen rather than wedging inside vergeten."},{"k":"tr","prompt":"Translate: \"He has just begun.\"","ans":["hij is net begonnen"],"why":"begonnen has no ge- — beginnen's be- is already an inseparable, unstressed prefix, so Dutch skips the extra ge-."},{"k":"match","prompt":"Match the separable verb to its meaning.","L":[{"key":"1","t":"opbellen","say":"opbellen"},{"key":"2","t":"aankomen","say":"aankomen"},{"key":"3","t":"opstaan","say":"opstaan"},{"key":"4","t":"uitgaan","say":"uitgaan"},{"key":"5","t":"meenemen","say":"meenemen"}],"R":[{"key":"3","t":"to get up","say":""},{"key":"1","t":"to call up / phone","say":""},{"key":"5","t":"to take along","say":""},{"key":"2","t":"to arrive","say":""},{"key":"4","t":"to go out","say":""}]},{"k":"match","prompt":"Match the verb to its correct past participle.","L":[{"key":"1","t":"aankomen","say":"aankomen"},{"key":"2","t":"opruimen","say":"opruimen"},{"key":"3","t":"aantrekken","say":"aantrekken"},{"key":"4","t":"vergeten","say":"vergeten"},{"key":"5","t":"beginnen","say":"beginnen"}],"R":[{"key":"4","t":"vergeten","say":""},{"key":"2","t":"opgeruimd","say":""},{"key":"5","t":"begonnen","say":""},{"key":"1","t":"aangekomen","say":""},{"key":"3","t":"aangetrokken","say":""}]}]},{"id":"connectors","group":"Words and sound","name":"Connectors","title":"Connectors & Flavor Particles: Sounding Like a Real Conversation","rule":"<h2>The rule<\/h2><h3>Connectors: dressing up sentences you can already build<\/h3><p>Mechanically, most of these are nothing new — they're ordinary adverbs. When one leads the sentence, Verb second's V2 rule still applies: the adverb takes position 1, the conjugated verb must follow in position 2. When one sits mid-sentence instead, it just slots into the \"middle field\" after the subject and verb, changing nothing else. The new part is knowing which word to reach for, and where it naturally lives.<\/p><table>\n<tr><th>Connector<\/th><th>Meaning<\/th><th>Where it goes<\/th><\/tr>\n<tr><td><code>eigenlijk<\/code><\/td><td>actually / to be honest<\/td><td>fronts (triggers inversion, Verb second's rule) or sits after subject + verb — both natural<\/td><\/tr>\n<tr><td><code>trouwens<\/code><\/td><td>by the way / incidentally<\/td><td>almost always mid-clause, right after subject + verb<\/td><\/tr>\n<tr><td><code>dus<\/code><\/td><td>so / therefore<\/td><td>plain conjunction, no inversion (behaves like <code>want<\/code> from Verb last) <em>or<\/em> fronted adverb, with inversion — both are accepted<\/td><\/tr>\n<tr><td><code>namelijk<\/code><\/td><td>namely / you see<\/td><td>mid-clause, after subject + verb — it explains something already said, so it never leads<\/td><\/tr>\n<tr><td><code>overigens<\/code><\/td><td>moreover / incidentally (the more formal, written cousin of <code>trouwens<\/code>)<\/td><td>mid-clause, after subject + verb<\/td><\/tr>\n<tr><td><code>enerzijds ... anderzijds<\/code><\/td><td>on the one hand ... on the other hand<\/td><td>each half fronts its own clause and triggers inversion; formal register — <code>aan de ene kant ... aan de andere kant<\/code> is the everyday spoken version<\/td><\/tr>\n<tr><td><code>tenminste<\/code><\/td><td>at least<\/td><td>mid-clause, or as a standalone hedge tacked onto a claim<\/td><\/tr>\n<tr><td><code>sowieso<\/code><\/td><td>anyway / regardless / in any case<\/td><td>mid-clause, right after the verb<\/td><\/tr>\n<tr><td><code>hoe dan ook<\/code><\/td><td>anyway / no matter what<\/td><td>fixed three-word unit, usually set off with a comma — treat it as one block<\/td><\/tr>\n<\/table><p>Three worth a closer look, because they behave differently from their English \"equivalents\":<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ze komt niet naar de vergadering, ze is namelijk ziek.<\/span><br><\/br>\n<span class=\"gloss\">She's not coming to the meeting — she's sick, you see. English \"namely\" would lead with the explanation; Dutch <code>namelijk<\/code> sits inside the clause it's explaining, after the fact.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Ik ben moe, dus ik ga naar bed. <em>or<\/em> Ik ben moe, dus ga ik naar bed.<\/span><br><\/br>\n<span class=\"gloss\">I'm tired, so I'm going to bed. Both orders are genuinely correct: <code>dus<\/code> can act like <code>want<\/code> (no inversion) or like a fronted adverb (inversion) — pick whichever comes out.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Hij komt morgen. Tenminste, dat zei hij.<\/span><br><\/br>\n<span class=\"gloss\">He's coming tomorrow. At least, that's what he said. A hedge tacked on after the fact — you're reporting a claim without fully backing it.<\/span>\n<\/blockquote><h3>Flavor particles: words that carry tone, not meaning<\/h3><p>These are the words that resist a dictionary. Drop one in and the sentence's factual content doesn't change at all — only its emotional shading does: warmer, more hedged, more reassuring, more pointed. Skipping them entirely is what makes fluent-on-paper Dutch sound flat out loud; the honest note is that their placement bends with register and speaker, so treat the examples below as reliable defaults, not rigid law.<\/p><blockquote class=\"example\">\n<span class=\"nl\">Dat is toch niet zo moeilijk?<\/span><br><\/br>\n<span class=\"gloss\">That's not so hard, is it? <strong>toch<\/strong> invites agreement — it turns a flat statement into a nudge for confirmation. Said warmly it's reassuring; said sharply, the exact same sentence can sound like a challenge (see the callout below).<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Het eten ziet er niet indrukwekkend uit, maar het is wel lekker.<\/span><br><\/br>\n<span class=\"gloss\">The food doesn't look like much, but it IS tasty. <strong>wel<\/strong> affirms something against a doubt or expectation that was just raised — it only does real work when there's a contrast to push back against; tacked onto a sentence with nothing to contrast, it does nothing.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Maak je geen zorgen, het komt goed, hoor.<\/span><br><\/br>\n<span class=\"gloss\">Don't worry, it'll be fine. <strong>hoor<\/strong> always sits at the very end of the sentence — it's the verbal equivalent of a reassuring hand on the shoulder, and it's informal only; never in writing that needs to be formal.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Kun je dat even voor me pakken?<\/span><br><\/br>\n<span class=\"gloss\">Can you just grab that for me? <strong>even<\/strong> frames the ask as quick, no big deal — it softens a request into a small favor.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Kom maar binnen, de deur is open.<\/span><br><\/br>\n<span class=\"gloss\">Come on in, the door's open. <strong>maar<\/strong> turns an instruction into an invitation — without it, \"Kom binnen\" alone can land as a flat order.<\/span>\n<\/blockquote><div class=\"callout\">\n<strong>The one heuristic to keep:<\/strong> if a sentence you've built sounds correct but stiff, ask whether dropping in <code>toch<\/code> or <code>wel<\/code> would soften it into something a real person would actually say. A flat, particle-free statement is what a textbook sounds like; leaning on one of these two is what a person sounds like.\n<\/div><div class=\"callout\">\n<strong>Watch out — toch cuts both ways:<\/strong> the exact same word can sound like a warm invitation to agree (\"Dat is toch een goed idee?\" — \"That's a good idea, right?\") or like an accusation (\"Dat is toch van mij?!\" — \"That's mine, isn't it?!\"). The grammar never changes; only tone does. With someone you're close to, this is worth getting right — a sentence meant to be warm can land as a challenge if it comes out flat and sharp.\n<\/div>","items":[{"k":"mc","sub":"A","prompt":"\"Actually, I don't have much time.\"","opts":[{"t":"Eigenlijk ik heb niet veel tijd.","ok":false,"why":"No inversion after the fronted adverb — 'eigenlijk' occupies position 1, so 'ik' can't sit right after it."},{"t":"Eigenlijk heb ik niet veel tijd.","ok":true,"why":"Correct — 'eigenlijk' takes position 1, 'heb' is second, and 'ik' inverts to third, the same V2 mechanic as any fronted adverb."},{"t":"Eigenlijk ik niet veel tijd heb.","ok":false,"why":"The verb has drifted to the end — that's the subordinate-clause pattern, not what a fronted adverb triggers."}]},{"k":"mc","sub":"A","prompt":"\"On the one hand I want to move, on the other hand I love this house.\"","opts":[{"t":"Enerzijds wil ik verhuizen, anderzijds hou ik van dit huis.","ok":true,"why":"Correct — each half fronts its own clause and inverts, and 'anderzijds' correctly pairs with 'enerzijds'."},{"t":"Enerzijds wil ik verhuizen, enerzijds hou ik van dit huis.","ok":false,"why":"Repeats 'enerzijds' instead of pairing it with 'anderzijds' — the two halves need to contrast, not match."},{"t":"Enerzijds ik wil verhuizen, anderzijds hou ik van dit huis.","ok":false,"why":"No inversion in the first half — 'enerzijds' occupies position 1, so 'wil' must come before 'ik'."}]},{"k":"mc","sub":"A","prompt":"\"By the way, I still have a question for you.\"","opts":[{"t":"Ik heb trouwens nog een vraag voor je.","ok":true,"why":"Correct — 'trouwens' sits in the middle field, right after subject and verb, which is its natural home."},{"t":"Ik trouwens heb nog een vraag voor je.","ok":false,"why":"Wedges 'trouwens' between subject and verb — that's two elements competing for position 1, which V2 doesn't allow."},{"t":"Ik heb nog een vraag voor trouwens je.","ok":false,"why":"Splits the fixed phrase 'voor je' apart, which can't be broken up like that."}]},{"k":"mc","sub":"A","prompt":"\"Incidentally, I have never been to China.\"","opts":[{"t":"Ik ben overigens nog nooit in China geweest.","ok":true,"why":"Correct — 'overigens' takes its usual mid-clause slot, right after subject and verb."},{"t":"Ik overigens ben nog nooit in China geweest.","ok":false,"why":"Wedges 'overigens' before the verb — two elements before the conjugated verb breaks V2."},{"t":"Ik ben nog nooit in overigens China geweest.","ok":false,"why":"Splits the fixed phrase 'in China' apart, which isn't how the phrase works."}]},{"k":"mc","sub":"A","prompt":"\"We're going to the party anyway.\"","opts":[{"t":"We gaan sowieso naar het feest.","ok":true,"why":"Correct — 'sowieso' sits in the middle field, right after the conjugated verb."},{"t":"We sowieso gaan naar het feest.","ok":false,"why":"Wedges 'sowieso' before the verb — two elements before the conjugated verb breaks V2."},{"t":"We gaan naar sowieso het feest.","ok":false,"why":"Splits the fixed phrase 'naar het feest' apart, which isn't how the phrase works."}]},{"k":"mc","sub":"A","prompt":"\"She's not coming — she's sick, you see.\"","opts":[{"t":"Ze komt niet, ze is namelijk ziek.","ok":true,"why":"Correct — 'namelijk' sits after subject and verb; it explains the clause it's attached to, so it never leads."},{"t":"Ze komt niet, namelijk ze is ziek.","ok":false,"why":"Fronts 'namelijk' — explanatory adverbs like this don't lead a clause, since there's nothing yet for them to explain."},{"t":"Ze komt niet, ze namelijk is ziek.","ok":false,"why":"Wedges 'namelijk' before the verb, breaking V2 in that clause."}]},{"k":"mc","sub":"A","prompt":"\"It'll be fine, don't worry.\"","opts":[{"t":"Hoor, het komt goed.","ok":false,"why":"'hoor' at the front — this particle is sentence-final only, never an opener."},{"t":"Het komt goed, hoor.","ok":true,"why":"Correct — 'hoor' always closes the sentence; that's its only natural position."},{"t":"Het hoor komt goed.","ok":false,"why":"'hoor' wedged mid-clause — it doesn't sit inside the sentence, only at the very end."}]},{"k":"mc","sub":"A","prompt":"\"Can you just do that?\"","opts":[{"t":"Kun je dat even doen?","ok":true,"why":"Correct — 'even' sits right before the thing it softens, here the infinitive 'doen'."},{"t":"Kun je dat doen even?","ok":false,"why":"'even' stranded after the infinitive — it needs to sit before the verb it's softening, not trail after it."},{"t":"Even kun je dat doen?","ok":false,"why":"'even' can't launch a question — it's a softening particle, not a question word."}]},{"k":"mc","sub":"A","prompt":"\"Come on in.\" (a warm invitation, not an order)","opts":[{"t":"Maar kom binnen.","ok":false,"why":"'maar' at the front reads as the conjunction 'but' — that's a different word entirely, not the softening particle."},{"t":"Kom maar binnen.","ok":true,"why":"Correct — 'maar' sits right after the imperative verb, softening the command into an invitation."},{"t":"Kom binnen maar.","ok":false,"why":"'maar' stranded at the very end — it needs to sit right after the verb it's softening."}]},{"k":"mc","sub":"A","prompt":"\"The food doesn't look impressive, but it IS tasty.\" (contrastive emphasis)","opts":[{"t":"Het eten ziet er niet indrukwekkend uit, maar het is wel lekker.","ok":true,"why":"Correct — 'wel' sits right after the conjugated verb 'is', its normal slot when affirming against a doubt."},{"t":"Het eten ziet er niet indrukwekkend uit, maar het wel is lekker.","ok":false,"why":"'wel' wedged before the verb instead of after it — it belongs right after 'is', not before."},{"t":"Het eten ziet er niet indrukwekkend uit, maar het is lekker wel.","ok":false,"why":"'wel' stranded at the very end — it needs to sit right after the verb it's emphasizing."}]},{"k":"fill","prompt":"Dat is ___ niet zo moeilijk?","gloss":"(That's not that hard, is it? — inviting agreement)","ans":["toch"],"why":"'toch' turns the statement into a nudge for agreement — 'surely that's not so hard?'"},{"k":"fill","prompt":"A: Ik dacht dat je geen zin had. B: Ik heb ___ zin, ik was gewoon moe.","gloss":"(A: I thought you didn't feel like it. B: I DO feel like it, I was just tired.)","ans":["wel"],"why":"'wel' affirms against the doubt just raised ('I thought you didn't feel like it') — that's exactly the contrast it needs to do its job."},{"k":"fill","prompt":"Maak je geen zorgen, het komt goed, ___.","gloss":"(Don't worry, it'll be fine.)","ans":["hoor"],"why":"'hoor' closes the sentence with a reassuring, informal tag."},{"k":"fill","prompt":"Kun je dat ___ voor me pakken?","gloss":"(Can you just grab that for me?)","ans":["even"],"why":"'even' frames the request as quick and low-effort, softening it."},{"k":"fill","prompt":"Kom ___ binnen, de deur is open.","gloss":"(Come on in, the door's open.)","ans":["maar"],"why":"'maar' turns the imperative into an invitation rather than an order."},{"k":"fill","prompt":"Ik ben moe, ___ ik ga naar bed.","gloss":"(I'm tired, so I'm going to bed.)","ans":["dus"],"why":"'dus' draws the conclusion out loud — the word itself is the blank, regardless of which word order follows."},{"k":"fill","prompt":"We gaan ___ naar het feest, wat er ook gebeurt.","gloss":"(We're going to the party regardless, whatever happens.)","ans":["sowieso"],"why":"'sowieso' says the plan holds no matter what happens."},{"k":"fill","prompt":"Hij is misschien niet slim, maar hij is ___ aardig.","gloss":"(He's maybe not smart, but at least he's nice.)","ans":["tenminste"],"why":"'tenminste' names the one fallback truth worth conceding."},{"k":"fill","prompt":"___, we moeten door.","gloss":"(Anyway, we have to keep going. — three words)","ans":["hoe dan ook"],"why":"A fixed three-word unit meaning 'anyway' / 'no matter what' — treat it as one block, usually set off with a comma."},{"k":"fill","prompt":"Ze komt niet naar de vergadering, ze is ___ ziek.","gloss":"(She's not coming to the meeting — she's sick, you see.)","ans":["namelijk"],"why":"'namelijk' supplies the reason for what was just said — mid-clause, not at the front."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Eigenlijk heb ik geen zin om te koken vanavond.","ok":false,"why":"Correct — 'eigenlijk' fronted, verb inverted."},{"t":"Ik heb eigenlijk geen zin om te koken vanavond.","ok":false,"why":"Correct — 'eigenlijk' in its medial slot, after subject and verb."},{"t":"Eigenlijk ik heb geen zin om te koken vanavond.","ok":true,"why":"This is the error — no inversion after the fronted 'eigenlijk'; it should be 'Eigenlijk heb ik...'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik ben overigens niet boos op je.","ok":false,"why":"Correct — 'overigens' in its usual mid-clause slot."},{"t":"Ze is overigens ook uitgenodigd.","ok":false,"why":"Correct — same slot, different sentence."},{"t":"Ik overigens ben niet boos op je.","ok":true,"why":"This is the error — 'overigens' wedged before the verb; it should follow, not precede, 'ben'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Enerzijds snap ik het, anderzijds vind ik het jammer.","ok":false,"why":"Correct — 'enerzijds' and 'anderzijds' pair up as they should."},{"t":"Aan de ene kant snap ik het, aan de andere kant vind ik het jammer.","ok":false,"why":"Correct — the everyday spoken version of the same pairing."},{"t":"Enerzijds snap ik het, enerzijds vind ik het jammer.","ok":true,"why":"This is the error — repeats 'enerzijds' instead of pairing it with 'anderzijds'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik ga sowieso naar de bruiloft.","ok":false,"why":"Correct — 'sowieso' in its usual mid-clause slot after the verb."},{"t":"Dat boek wil ik sowieso lezen.","ok":false,"why":"Correct — the object 'dat boek' fronts instead, and 'sowieso' stays medial."},{"t":"Ik sowieso ga naar de bruiloft.","ok":true,"why":"This is the error — 'sowieso' wedged before the verb, giving the clause two elements before the conjugated verb."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hij belt niet terug, hij is namelijk zijn telefoon kwijt.","ok":false,"why":"Correct — 'namelijk' mid-clause, explaining the missed call."},{"t":"We komen later, het verkeer zit namelijk vast.","ok":false,"why":"Correct — same pattern, different sentence."},{"t":"Hij belt niet terug, namelijk hij is zijn telefoon kwijt.","ok":true,"why":"This is the error — fronts 'namelijk', which doesn't naturally lead a clause since it explains something already said."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Het is echt niet erg, hoor.","ok":false,"why":"Correct — 'hoor' closes the sentence, its only natural position."},{"t":"Je mag gewoon blijven zitten, hoor.","ok":false,"why":"Correct — same rule, different sentence."},{"t":"Hoor, het is echt niet erg.","ok":true,"why":"This is the error — 'hoor' can't open a sentence; it only ever closes one."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Wacht even, ik kom eraan.","ok":false,"why":"Correct — 'even' right before the imperative it softens."},{"t":"Mag ik je pen even lenen?","ok":false,"why":"Correct — 'even' right before the infinitive it softens."},{"t":"Mag ik je pen lenen even?","ok":true,"why":"This is the error — 'even' stranded after the infinitive; it needs to sit before the verb, not trail after it."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ga maar vast zitten, ik kom zo.","ok":false,"why":"Correct — 'maar' softens the imperative into an invitation."},{"t":"Doe maar wat jij het beste vindt.","ok":false,"why":"Correct — same softening use."},{"t":"Maar ga vast zitten, ik kom zo.","ok":true,"why":"This is the error — 'maar' at the front reads as the conjunction 'but', not the mid-clause softening particle."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik vond de film niet goed, maar de muziek was wel mooi.","ok":false,"why":"Correct — 'wel' right after the verb 'was', affirming against the earlier 'niet goed'."},{"t":"Hij komt niet altijd op tijd, maar hij is wel heel aardig.","ok":false,"why":"Correct — same contrastive pattern."},{"t":"Ik vond de film niet goed, maar de muziek wel was mooi.","ok":true,"why":"This is the error — 'wel' wedged before the verb instead of after it."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Dat is toch een goed idee?","ok":false,"why":"Correct — 'toch' inviting agreement, mid-sentence."},{"t":"Ik ga toch naar het feest, wat je ook zegt.","ok":false,"why":"Correct — 'toch' reinforcing resolve, mid-sentence."},{"t":"Toch dat is een goed idee?","ok":true,"why":"This is the error — 'toch' can't launch the sentence like this; the tag-particle use sits inside the clause."}]},{"k":"mc","sub":"D","prompt":"\"Actually, I'm staying home because I'm a bit sick.\"","opts":[{"t":"Eigenlijk blijf ik thuis omdat ik een beetje ziek ben.","ok":true,"why":"Correct throughout — 'eigenlijk' fronted with inversion, and 'ben' correctly ends the 'omdat' clause."},{"t":"Eigenlijk ik blijf thuis omdat ik een beetje ziek ben.","ok":false,"why":"No inversion after the fronted 'eigenlijk'."},{"t":"Eigenlijk blijf ik thuis omdat ik ben een beetje ziek.","ok":false,"why":"The 'omdat' clause reverts to main-clause order — 'ben' needs to end that clause, not sit mid-clause."}]},{"k":"mc","sub":"D","prompt":"\"I'm staying home, because I'm sick, you see.\"","opts":[{"t":"Ik blijf thuis, want ik ben namelijk ziek.","ok":true,"why":"Correct — 'want' keeps normal V2 (Verb last), and 'namelijk' sits in its usual medial slot after subject and verb."},{"t":"Ik blijf thuis, want namelijk ik ben ziek.","ok":false,"why":"Fronts 'namelijk' inside the 'want' clause, which explanatory adverbs don't do."},{"t":"Ik blijf thuis, want ik namelijk ben ziek.","ok":false,"why":"Wedges 'namelijk' before the verb — the 'want' clause still needs normal V2, verb in position 2."}]},{"k":"mc","sub":"D","prompt":"\"I'm going to the party anyway, even though it's raining.\"","opts":[{"t":"Ik ga sowieso naar het feest, hoewel het regent.","ok":true,"why":"Correct throughout — 'sowieso' medial after the verb, and 'regent' correctly ends the 'hoewel' clause."},{"t":"Ik sowieso ga naar het feest, hoewel het regent.","ok":false,"why":"Wedges 'sowieso' before the verb, breaking V2."},{"t":"Ik ga sowieso naar het feest, hoewel regent het.","ok":false,"why":"The 'hoewel' clause isn't verb-final — 'regent' needs to end that clause (Verb last's rule)."}]},{"k":"mc","sub":"D","prompt":"\"On the one hand I think that it's a good idea, on the other hand I'm scared.\"","opts":[{"t":"Enerzijds denk ik dat het een goed idee is, anderzijds ben ik bang.","ok":true,"why":"Correct throughout — 'enerzijds' inverts as it should, and 'is' correctly ends the 'dat' clause."},{"t":"Enerzijds ik denk dat het een goed idee is, anderzijds ben ik bang.","ok":false,"why":"No inversion after the fronted 'enerzijds'."},{"t":"Enerzijds denk ik dat het is een goed idee, anderzijds ben ik bang.","ok":false,"why":"The 'dat' clause isn't verb-final — 'is' needs to end that clause."}]},{"k":"mc","sub":"D","prompt":"\"I'm going anyway, because I promised it.\"","opts":[{"t":"Ik ga toch, omdat ik het beloofd heb.","ok":true,"why":"Correct throughout — 'toch' sits after the verb in the main clause, and 'beloofd heb' clusters at the end of the 'omdat' clause."},{"t":"Ik toch ga, omdat ik het beloofd heb.","ok":false,"why":"Wedges 'toch' before the verb — the particle sits after the conjugated verb, not before it."},{"t":"Ik ga toch, omdat ik heb het beloofd.","ok":false,"why":"The verb cluster isn't at the end of the 'omdat' clause — should be '...omdat ik het beloofd heb'."}]},{"k":"mc","sub":"D","prompt":"\"I think the presentation was boring, but the content WAS good.\"","opts":[{"t":"Ik denk dat de presentatie saai was, maar de inhoud was wel goed.","ok":true,"why":"Correct throughout — 'saai was' ends the 'dat' clause, and 'wel' sits right after 'was' in the main clause."},{"t":"Ik denk dat de presentatie saai was, maar de inhoud wel was goed.","ok":false,"why":"Wedges 'wel' before the verb instead of after it."},{"t":"Ik denk dat de presentatie was saai, maar de inhoud was wel goed.","ok":false,"why":"The 'dat' clause isn't verb-final — should be '...dat de presentatie saai was'."}]},{"k":"mc","sub":"D","prompt":"\"Could you just read this text for me?\"","opts":[{"t":"Kun je deze tekst even voor me lezen?","ok":true,"why":"Correct — 'even' sits right before the phrase it softens."},{"t":"Kun je deze tekst voor me lezen even?","ok":false,"why":"'even' stranded at the very end instead of before the verb phrase."},{"t":"Even kun je deze tekst voor me lezen?","ok":false,"why":"'even' can't launch a question — it's a softening particle, not a question word."}]},{"k":"mc","sub":"D","prompt":"\"Just come on in, don't worry.\"","opts":[{"t":"Kom maar binnen, hoor.","ok":true,"why":"Correct — 'maar' softens the imperative right after the verb, and 'hoor' closes the sentence."},{"t":"Hoor, kom maar binnen.","ok":false,"why":"'hoor' can't open the sentence — it only ever closes one."},{"t":"Kom hoor maar binnen.","ok":false,"why":"'hoor' wedged mid-clause instead of at the very end."}]},{"k":"mc","sub":"D","prompt":"\"I'm tired, so I think I'm going to bed.\"","opts":[{"t":"Ik ben moe, dus ik denk dat ik naar bed ga.","ok":true,"why":"Correct — 'dus' as a plain conjunction needs no inversion, and 'ga' correctly ends the 'dat' clause."},{"t":"Ik ben moe, dus ik denk dat ik ga naar bed.","ok":false,"why":"The 'dat' clause isn't verb-final — should be '...dat ik naar bed ga'."},{"t":"Ik ben moe, dus ik denken dat ik naar bed ga.","ok":false,"why":"Wrong verb form — 'denken' should be 'denk' to agree with 'ik'."}]},{"k":"mc","sub":"D","prompt":"\"Anyway, we have to keep going.\"","opts":[{"t":"Hoe dan ook, we moeten door.","ok":true,"why":"Correct — 'hoe dan ook' stays together as a fixed three-word unit, set off with a comma."},{"t":"Hoe, dan ook we moeten door.","ok":false,"why":"Splits the fixed phrase 'hoe dan ook' with an internal comma, which breaks up a unit that has to stay together."},{"t":"Dan ook hoe, we moeten door.","ok":false,"why":"Scrambles the word order inside the fixed phrase itself."}]},{"k":"tr","prompt":"Translate: \"Actually, I don't really feel like going out tonight.\"","ans":["eigenlijk heb ik geen zin om vanavond uit te gaan","ik heb eigenlijk geen zin om vanavond uit te gaan"],"why":"Both the fronted (inverted) and medial placements of 'eigenlijk' are correct."},{"k":"tr","prompt":"Translate: \"By the way, do you still have that book?\"","ans":["heb je trouwens dat boek nog","trouwens heb je dat boek nog"],"why":"Questions invert regardless of what's fronted, so both orders read naturally with 'trouwens' leading."},{"k":"tr","prompt":"Translate: \"I'm tired, so I'm going to bed.\"","ans":["ik ben moe dus ik ga naar bed","ik ben moe dus ga ik naar bed"],"why":"'dus' works as a plain conjunction (no inversion, like 'want') or as a fronted adverb (inversion) — both are correct."},{"k":"tr","prompt":"Translate: \"She's not coming to the meeting — she's sick, you see.\"","ans":["ze komt niet naar de vergadering ze is namelijk ziek"],"why":"'namelijk' explains what was just said, so it sits inside the second clause — never at the front."},{"k":"tr","prompt":"Translate: \"Incidentally, I'm not angry with you.\"","ans":["ik ben overigens niet boos op je","ik ben overigens niet kwaad op je"],"why":"'overigens' sits mid-clause, after subject and verb; 'boos' and 'kwaad' are interchangeable for 'angry'."},{"k":"tr","prompt":"Translate: \"We're going to the wedding anyway, whatever happens.\"","ans":["we gaan sowieso naar de bruiloft wat er ook gebeurt"],"why":"'sowieso' sits right after the verb, asserting the plan holds no matter what."},{"k":"tr","prompt":"Translate: \"He's maybe not the smartest, but at least he's honest.\"","ans":["hij is misschien niet de slimste maar hij is tenminste eerlijk"],"why":"'tenminste' names the one fallback truth worth conceding."},{"k":"tr","prompt":"Translate: \"On the one hand I want to stay, on the other hand I'm curious about the new city.\"","ans":["enerzijds wil ik blijven anderzijds ben ik nieuwsgierig naar de nieuwe stad","aan de ene kant wil ik blijven aan de andere kant ben ik nieuwsgierig naar de nieuwe stad"],"why":"The formal 'enerzijds...anderzijds' and the everyday 'aan de ene kant...aan de andere kant' are both correct."},{"k":"tr","prompt":"Translate: \"Can I just borrow your phone for a second?\"","ans":["mag ik even je telefoon lenen","mag ik je telefoon even lenen"],"why":"'even' can sit right before the object or right before the infinitive — both orders are natural."},{"k":"tr","prompt":"Translate: \"That's not that hard, is it?\"","ans":["dat is toch niet zo moeilijk","dat is niet zo moeilijk toch"],"why":"'toch' can sit mid-sentence or as a tag at the very end — both are common ways to invite agreement."},{"k":"match","prompt":"Match each flavor particle (in context) to the tone it adds.","L":[{"key":"1","t":"Het komt goed, hoor.","say":"Het komt goed, hoor."},{"key":"2","t":"Kun je dat even doen?","say":"Kun je dat even doen?"},{"key":"3","t":"Kom maar binnen.","say":"Kom maar binnen."},{"key":"4","t":"Dat is toch een goed idee?","say":"Dat is toch een goed idee?"},{"key":"5","t":"Het is wel lekker.","say":"Het is wel lekker."}],"R":[{"key":"3","t":"softens an order into an invitation — \"go ahead and...\"","say":""},{"key":"1","t":"reassures at the end of the sentence — \"don't worry\"","say":""},{"key":"5","t":"affirms against a doubt just raised — \"it IS...\"","say":""},{"key":"4","t":"invites agreement — \"isn't it?\"","say":""},{"key":"2","t":"softens a request — \"just, for a second\"","say":""}]},{"k":"match","prompt":"Match each connector to its function.","L":[{"key":"1","t":"namelijk","say":"namelijk"},{"key":"2","t":"trouwens","say":"trouwens"},{"key":"3","t":"sowieso","say":"sowieso"},{"key":"4","t":"enerzijds ... anderzijds","say":"enerzijds, anderzijds"},{"key":"5","t":"tenminste","say":"tenminste"}],"R":[{"key":"3","t":"true no matter what — \"anyway, regardless\"","say":""},{"key":"1","t":"introduces the reason for what was just said, mid-clause","say":""},{"key":"5","t":"names a fallback minimum — \"at least\"","say":""},{"key":"2","t":"adds a related side-remark — \"by the way\"","say":""},{"key":"4","t":"weighs two sides of something — \"on one hand... on the other\"","say":""}]}]},{"id":"dehet","group":"Words and sound","name":"De / het","title":"De/Het Drill","rule":"<h2>The rule<\/h2><p>Every Dutch noun has a fixed article, <code>de<\/code> or <code>het<\/code>. It cannot be reliably guessed from the meaning or the shape of the word, so learn each noun together with its article.<\/p><p>Two anchors that always hold: plurals take <code>de<\/code>, and diminutives ending in <code>-je<\/code> take <code>het<\/code>.<\/p><div class=\"callout\">Pick <code>de<\/code> or <code>het<\/code> for the noun in each sentence. Misses come back until they stick.<\/div>","items":[{"k":"mc","sub":"article","prompt":"Dit boek gaat over ___ economie.","gloss":"(This book is about economics.)","opts":[{"t":"het","ok":false,"why":"economie is a de-word, not a het-word."},{"t":"de","ok":true,"why":"economie is a de-word."}]},{"k":"mc","sub":"article","prompt":"Dit is ___ gelegenheid om te praten.","gloss":"(This is the opportunity to talk.)","opts":[{"t":"het","ok":false,"why":"gelegenheid is a de-word, not a het-word."},{"t":"de","ok":true,"why":"gelegenheid is a de-word."}]},{"k":"mc","sub":"article","prompt":"Ik leg ___ kaart op de stapel.","gloss":"(I place the card on the pile.)","opts":[{"t":"het","ok":false,"why":"kaart is a de-word, not a het-word."},{"t":"de","ok":true,"why":"kaart is a de-word."}]},{"k":"mc","sub":"article","prompt":"Ik zoek ___ aandacht.","gloss":"(I'm looking for the attention.)","opts":[{"t":"de","ok":true,"why":"aandacht is a de-word."},{"t":"het","ok":false,"why":"aandacht is a de-word, not a het-word."}]},{"k":"mc","sub":"article","prompt":"Ik zoek ___ deel.","gloss":"(I'm looking for the part.)","opts":[{"t":"de","ok":false,"why":"deel is a het-word d."}]}],"pool":500},{"id":"simplepast","group":"Verbs","name":"Simple past","title":"Simple Past Drill","rule":"<h2>The rule<\/h2><p>The simple past has a singular form (ik, jij, hij) and a plural form (wij, jullie, zij).<\/p><p><strong>Weak verbs<\/strong> add <code>-te<\/code> / <code>-ten<\/code> or <code>-de<\/code> / <code>-den<\/code> to the stem. The ’t kofschip rule picks which: a stem ending in t, k, f, s, ch or p takes <code>-te<\/code> / <code>-ten<\/code>; every other stem takes <code>-de<\/code> / <code>-den<\/code>.<\/p><blockquote class=\"example\"><span class=\"nl\">werken → ik werkte, wij werkten<\/span><\/blockquote><p><strong>Strong verbs<\/strong> change their vowel instead, and the plural can differ from the singular.<\/p><blockquote class=\"example\"><span class=\"nl\">bieden → ik bood, wij boden<\/span><\/blockquote><p>A separable verb splits in a main clause: <code>aanbieden<\/code> becomes <code>bood … aan<\/code>.<\/p>","items":[{"k":"tr","prompt":"Translate: \"The doctor recommended the treatment.\"","ans":["de dokter beval de behandeling aan"],"why":"aanbevelen -> beval aan (simple past, singular)."},{"k":"tr","prompt":"Translate: \"We took on the challenge.\"","ans":["wij gingen de uitdaging aan"],"why":"aangaan -> gingen aan (simple past, plural); 'een uitdaging aangaan' = to take on a challenge."},{"k":"tr","prompt":"Translate: \"The company hired a new employee.\"","ans":["het bedrijf nam een nieuwe medewerker aan"],"why":"aannemen -> nam aan (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The director appointed a successor.\"","ans":["de directeur wees een opvolger aan"],"why":"aanwijzen -> wees aan (simple past, singular)."},{"k":"tr","prompt":"Translate: \"The contracts expired in June.\"","ans":["de contracten liepen af in juni"],"why":"aflopen -> liepen af (simple past, plural)."},{"k":"tr","prompt":"Translate: \"She came up with a clever plan.\"","ans":["zij bedacht een slim plan"],"why":"bedenken -> bedacht (simple
