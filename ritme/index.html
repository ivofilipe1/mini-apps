 but the main clause isn't inverted."},{"t":"Omdat ik mijn sleutels ben vergeten, moet ik mijn buurman bellen.","ok":true,"why":"Cluster \"ben vergeten\" stays intact at the end of the \"omdat\" clause, and the main clause inverts correctly."},{"t":"Omdat ik ben mijn sleutels vergeten, moet ik mijn buurman bellen.","ok":false,"why":"Wedges the object \"mijn sleutels\" between the auxiliary and the participle."}]},{"k":"mc","sub":"D","prompt":"\"While I was reading, the phone rang.\"","opts":[{"t":"Terwijl ik was aan het lezen, ging de telefoon.","ok":false,"why":"Keeps main-clause order (\"was\" second) inside a subordinate clause — \"was\" needs to move to the very end."},{"t":"Terwijl ik aan het lezen was, ging de telefoon.","ok":true,"why":"\"aan het lezen was\" pushes the whole progressive phrase to the end, and the main clause inverts afterward — the same pattern from Verb last."},{"t":"Terwijl ik aan het lezen was, de telefoon ging.","ok":false,"why":"Main clause isn't inverted after the fronted \"terwijl\" clause."}]},{"k":"mc","sub":"D","prompt":"\"I believe that she has already arrived.\"","opts":[{"t":"Ik geloof dat ze aangekomen al is.","ok":false,"why":"Wedges \"al\" between the participle and the auxiliary."},{"t":"Ik geloof dat ze al aangekomen is.","ok":true,"why":"\"al\" precedes the intact cluster \"aangekomen is\" — \"is aangekomen\" would work equally well."},{"t":"Ik geloof dat ze al aangekomen heeft.","ok":false,"why":"\"aankomen\" is a motion verb and takes \"zijn\", not \"hebben\"."}]},{"k":"mc","sub":"D","prompt":"\"I hope that you can come tomorrow.\"","opts":[{"t":"Ik hoop dat je kan morgen komen.","ok":false,"why":"Wedges \"morgen\" between the modal and the infinitive."},{"t":"Ik hoop je kan morgen komen.","ok":false,"why":"Drops \"dat\" — without it this isn't a valid subordinate-clause construction."},{"t":"Ik hoop dat je morgen kan komen.","ok":true,"why":"\"morgen\" precedes the cluster \"kan komen\" — the standard modal-then-infinitive order."}]},{"k":"mc","sub":"D","prompt":"\"After she had just called, I felt relieved.\"","opts":[{"t":"Nadat ze net had gebeld, voelde ik me opgelucht.","ok":true,"why":"\"net\" precedes the intact cluster \"had gebeld\" — \"gebeld had\" would work equally well, just not with \"net\" in the middle."},{"t":"Nadat ze had net gebeld, voelde ik me opgelucht.","ok":false,"why":"Wedges \"net\" between the auxiliary and the participle."},{"t":"Nadat ze net had gebeld, ik voelde me opgelucht.","ok":false,"why":"Main clause isn't inverted after the fronted \"nadat\" clause."}]},{"k":"mc","sub":"D","prompt":"\"Since I can work from home, I save time.\"","opts":[{"t":"Sinds ik thuis werken kan, bespaar ik tijd.","ok":false,"why":"Reverses modal and infinitive — occurs regionally, but it's not the modern standard order."},{"t":"Sinds ik thuis kan werken, ik bespaar tijd.","ok":false,"why":"Main clause isn't inverted after the fronted \"sinds\" clause."},{"t":"Sinds ik thuis kan werken, bespaar ik tijd.","ok":true,"why":"Standard modal-then-infinitive cluster, main clause inverted correctly."}]},{"k":"mc","sub":"D","prompt":"\"She's happy, because she can finally travel.\"","opts":[{"t":"Ze is blij, want ze eindelijk reizen kan.","ok":false,"why":"Pushes the cluster to the end as if \"want\" were subordinating; \"want\" keeps normal V2."},{"t":"Ze is blij, want ze kan eindelijk reizen.","ok":true,"why":"\"want\" keeps normal V2 — \"kan\" stays second."},{"t":"Ze is blij. Want kan ze eindelijk reizen.","ok":false,"why":"Starting with the conjugated verb reads like a question, not a statement."}]},{"k":"mc","sub":"D","prompt":"\"I'll stay until they've already arrived.\"","opts":[{"t":"Ik blijf totdat ze al zijn aangekomen.","ok":true,"why":"\"al\" precedes the intact cluster \"zijn aangekomen\" — \"aangekomen zijn\" would work equally well."},{"t":"Ik blijf totdat ze zijn al aangekomen.","ok":false,"why":"Wedges \"al\" between the auxiliary and the participle."},{"t":"Ik blijf totdat ze al aangekomen hebben.","ok":false,"why":"\"aankomen\" is a motion verb and takes \"zijn\", not \"hebben\"."}]},{"k":"mc","sub":"D","prompt":"\"Unless he wants to help us, we'll do it alone.\"","opts":[{"t":"Tenzij hij wil ons helpen, doen we het alleen.","ok":false,"why":"Wedges the object \"ons\" between the modal and the infinitive."},{"t":"Tenzij hij ons wil helpen, we doen het alleen.","ok":false,"why":"Main clause isn't inverted after the fronted \"tenzij\" clause."},{"t":"Tenzij hij ons wil helpen, doen we het alleen.","ok":true,"why":"Object \"ons\" precedes the intact cluster \"wil helpen\"."}]},{"k":"mc","sub":"D","prompt":"\"I think that they have already left.\"","opts":[{"t":"Ik denk dat ze vertrokken al zijn.","ok":false,"why":"Wedges \"al\" between the participle and the auxiliary."},{"t":"Ik denk dat ze al vertrokken zijn.","ok":true,"why":"\"al\" precedes the intact cluster \"vertrokken zijn\" — \"zijn vertrokken\" would work equally well."},{"t":"Ik denk dat ze al vertrokken hebben.","ok":false,"why":"\"vertrekken\" takes \"zijn\", not \"hebben\"."}]},{"k":"tr","prompt":"Translate: \"I think that I have to call my mother.\"","ans":["ik denk dat ik mijn moeder moet bellen"],"why":"Modal + infinitive — \"moet bellen\" ends the clause in that fixed order."},{"k":"tr","prompt":"Translate: \"Because he had worked a lot, he was tired.\"","ans":["omdat hij veel had gewerkt was hij moe","omdat hij veel gewerkt had was hij moe"],"why":"Auxiliary + participle — both cluster orders are standard here."},{"k":"tr","prompt":"Translate: \"While she can still choose, she hesitates.\"","ans":["terwijl ze nog kan kiezen twijfelt ze"],"why":"Modal + infinitive cluster ends the fronted clause; the main clause inverts."},{"k":"tr","prompt":"Translate: \"After we had eaten, we watched a movie.\"","ans":["nadat we hadden gegeten keken we een film","nadat we gegeten hadden keken we een film"],"why":"Auxiliary + participle — either order is fine."},{"k":"tr","prompt":"Translate: \"I'm staying, because I want to help.\"","ans":["ik blijf want ik wil helpen"],"why":"\"want\" keeps normal V2 — \"wil\" stays second."},{"k":"tr","prompt":"Translate: \"Although he has already paid, he complains.\"","ans":["hoewel hij al betaald heeft klaagt hij","hoewel hij al heeft betaald klaagt hij"],"why":"Auxiliary + participle — both orders are standard, just keep \"al\" before the whole cluster."},{"k":"tr","prompt":"Translate: \"Unless she has to work, she's coming with us.\"","ans":["tenzij ze moet werken komt ze met ons mee"],"why":"Modal + infinitive cluster ends the \"tenzij\" clause; the main clause inverts."},{"k":"tr","prompt":"Translate: \"Since he has moved here, he seems calmer.\"","ans":["sinds hij hier is verhuisd lijkt hij rustiger","sinds hij hier verhuisd is lijkt hij rustiger"],"why":"Auxiliary + participle — both orders are standard."},{"k":"tr","prompt":"Translate: \"Before I can sleep, I need quiet.\"","ans":["voordat ik kan slapen heb ik rust nodig"],"why":"Modal + infinitive cluster ends the \"voordat\" clause."},{"k":"tr","prompt":"Translate: \"I'll wait until you have decided.\"","ans":["ik wacht totdat je hebt beslist","ik wacht totdat je beslist hebt"],"why":"Auxiliary + participle — either order is standard."},{"k":"match","prompt":"Match the modal verb to its meaning.","L":[{"key":"1","t":"kunnen","say":"kunnen"},{"key":"2","t":"moeten","say":"moeten"},{"key":"3","t":"willen","say":"willen"},{"key":"4","t":"mogen","say":"mogen"},{"key":"5","t":"zullen","say":"zullen"}],"R":[{"key":"4","t":"may / to be allowed to","say":""},{"key":"1","t":"can / to be able to","say":""},{"key":"5","t":"will / shall","say":""},{"key":"2","t":"must / have to","say":""},{"key":"3","t":"to want to","say":""}]},{"k":"match","prompt":"Match the Dutch clause ending to its English translation.","L":[{"key":"1","t":"...dat ik moet werken","say":""},{"key":"2","t":"...dat hij gebeld heeft","say":""},{"key":"3","t":"...omdat ze wil komen","say":""},{"key":"4","t":"...terwijl ze aan het lezen was","say":""},{"key":"5","t":"...nadat we waren vertrokken","say":""}],"R":[{"key":"4","t":"...while she was reading","say":""},{"key":"2","t":"...that he has called","say":""},{"key":"5","t":"...after we had left","say":""},{"key":"1","t":"...that I have to work","say":""},{"key":"3","t":"...because she wants to come","say":""}]}]},{"id":"perfect","group":"Verbs","name":"Perfect tense","title":"The Perfect Tense: Hebben or Zijn, Then the Participle","rule":"<h2>The rule<\/h2><p>The perfect tense (perfectum) has two parts: a conjugated form of <code>hebben<\/code> or <code>zijn<\/code>, and a past participle that goes all the way to the end of the clause — no exceptions, no matter how many other words come between them.<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ik heb gisteren een boek gelezen.<\/span><br><\/br>\n<span class=\"gloss\">I have yesterday a book read. → \"I read a book yesterday.\"<\/span>\n<\/blockquote><p>The auxiliary still obeys the word-order rules from Lessons 1–2: V2 in a main clause, verb-final in a subordinate clause — where it clusters together with the participle right at the end (Verb clusters covers what happens when a third verb joins that cluster).<\/p><h3>Forming the participle: regular (weak) verbs<\/h3><p>Most Dutch verbs are weak: <code>ge-<\/code> + stem + <code>t<\/code> or <code>d<\/code>. Which one depends on the last consonant of the stem — the <strong>'t kofschip<\/strong> rule (or for English speakers, the same list spells <strong>soft ketchup<\/strong>): if the stem ends in <code>t, k, f, s, ch, p<\/code>, add <code>-t<\/code>. Anything else, add <code>-d<\/code>.<\/p><blockquote class=\"example\">\n<span class=\"nl\">werken → stem \"werk\" (ends in k) → gewerkt<\/span><br><\/br>\n<span class=\"nl\">wonen → stem \"woon\" (ends in n) → gewoond<\/span>\n<\/blockquote><p>One wrinkle: verbs with an inseparable prefix (<code>be-, ge-, ver-, ont-, her-<\/code>) drop the <code>ge-<\/code> entirely — <code>betalen<\/code> → <code>betaald<\/code>, <code>bezoeken<\/code> → <code>bezocht<\/code>. Separable prefixes keep it, just relocated after the prefix: <code>aankomen<\/code> → <code>aangekomen<\/code>.<\/p><h3>Irregular (strong) verbs — and hebben vs. zijn<\/h3><p>A short list of high-frequency verbs skip the t/d pattern and have to be memorized as whole forms. This is also where the real error risk lives: most verbs take <code>hebben<\/code>, but a specific group — verbs of motion or change of state with a clear endpoint, plus <code>zijn<\/code> and <code>blijven<\/code> themselves — take <code>zijn<\/code> instead.<\/p><table>\n<tr><th>Infinitive<\/th><th>Participle<\/th><th>Takes<\/th><\/tr>\n<tr><td>zijn<\/td><td>geweest<\/td><td>zijn<\/td><\/tr>\n<tr><td>blijven<\/td><td>gebleven<\/td><td>zijn<\/td><\/tr>\n<tr><td>gaan<\/td><td>gegaan<\/td><td>zijn<\/td><\/tr>\n<tr><td>komen<\/td><td>gekomen<\/td><td>zijn<\/td><\/tr>\n<tr><td>worden<\/td><td>geworden<\/td><td>zijn<\/td><\/tr>\n<tr><td>sterven<\/td><td>gestorven<\/td><td>zijn<\/td><\/tr>\n<tr><td>veranderen*<\/td><td>veranderd<\/td><td>zijn<\/td><\/tr>\n<tr><td>vertrekken<\/td><td>vertrokken<\/td><td>zijn<\/td><\/tr>\n<tr><td>aankomen<\/td><td>aangekomen<\/td><td>zijn<\/td><\/tr>\n<tr><td>hebben<\/td><td>gehad<\/td><td>hebben<\/td><\/tr>\n<tr><td>doen<\/td><td>gedaan<\/td><td>hebben<\/td><\/tr>\n<tr><td>zien<\/td><td>gezien<\/td><td>hebben<\/td><\/tr>\n<tr><td>eten<\/td><td>gegeten<\/td><td>hebben<\/td><\/tr>\n<tr><td>drinken<\/td><td>gedronken<\/td><td>hebben<\/td><\/tr>\n<tr><td>nemen<\/td><td>genomen<\/td><td>hebben<\/td><\/tr>\n<tr><td>geven<\/td><td>gegeven<\/td><td>hebben<\/td><\/tr>\n<\/table><p>*<code>veranderen<\/code> takes <code>zijn<\/code> only when nothing else is doing the changing (<span class=\"nl\">de wereld is veranderd<\/span> — the world has changed). With a direct object it takes <code>hebben<\/code> (<span class=\"nl\">ik heb mijn mening veranderd<\/span> — I changed my mind).<\/p><p>A handful of motion verbs — <code>lopen<\/code>, <code>fietsen<\/code>, <code>rijden<\/code> — swing between the two depending on whether a destination is named: <span class=\"nl\">ik heb een uur gefietst<\/span> (I cycled for an hour — just the activity) versus <span class=\"nl\">ik ben naar Utrecht gefietst<\/span> (I cycled to Utrecht — there's an endpoint). Park this one for now; it's a B2/C1-level refinement and isn't tested in the exercises below.<\/p><div class=\"callout\">\n<strong>The consonant test:<\/strong> say the stem out loud. If it ends in <code>t, k, f, s, ch, p<\/code> ('t kofschip / soft ketchup), the participle ends in <code>-t<\/code>. Everything else takes <code>-d<\/code>.\n<\/div><div class=\"callout\">\n<strong>When in doubt, use hebben.<\/strong> It's the default for the vast majority of verbs. Reach for <code>zijn<\/code> only for: a change of place with an endpoint (gaan, komen, vertrekken, aankomen), a change of state with an endpoint (worden, sterven, veranderen when intransitive), or the verbs <code>zijn<\/code>/<code>blijven<\/code> themselves.\n<\/div>","items":[{"k":"mc","sub":"A","prompt":"\"I have worked today.\"","opts":[{"t":"Ik ben vandaag gewerkt.","ok":false,"why":"werken doesn't involve motion or change of state — it takes hebben, not zijn."},{"t":"Ik heb vandaag gewerkt.","ok":true,"why":"Correct — werken is a plain activity verb, so hebben is right, and gewerkt is the regular participle (stem 'werk' ends in k → -t)."},{"t":"Ik heb vandaag werkt.","ok":false,"why":"Missing the ge- prefix and participle ending — this is just the present-tense form, not the participle."}]},{"k":"mc","sub":"A","prompt":"\"She has become sick.\"","opts":[{"t":"Zij heeft ziek geworden.","ok":false,"why":"worden describes a change of state with a clear endpoint — it takes zijn, not hebben."},{"t":"Zij is ziek geworden.","ok":true,"why":"Correct — worden (to become) is a classic zijn-verb, and geworden is its irregular participle."},{"t":"Zij is ziek worden.","ok":false,"why":"Missing the ge- prefix — the irregular participle is geworden, not the bare infinitive worden."}]},{"k":"mc","sub":"A","prompt":"\"We have eaten pizza.\"","opts":[{"t":"Wij zijn pizza gegeten.","ok":false,"why":"eten is a plain transitive verb with no change of state for the subject — it takes hebben, not zijn."},{"t":"Wij hebben pizza gegeten.","ok":true,"why":"Correct — hebben is right for eten, and gegeten is the irregular participle."},{"t":"Wij hebben pizza geeten.","ok":false,"why":"Wrong participle spelling — the irregular form is gegeten, not the regularized geeten."}]},{"k":"mc","sub":"A","prompt":"\"He has gone home.\"","opts":[{"t":"Hij heeft naar huis gegaan.","ok":false,"why":"gaan is a motion verb with a clear destination — it takes zijn, not hebben."},{"t":"Hij is naar huis gegaan.","ok":true,"why":"Correct — gaan takes zijn, and gegaan is its irregular participle."},{"t":"Hij is naar huis gaan.","ok":false,"why":"Missing the ge- prefix — the participle is gegaan, not the bare infinitive."}]},{"k":"mc","sub":"A","prompt":"\"They have played football.\"","opts":[{"t":"Zij zijn voetbal gespeeld.","ok":false,"why":"spelen is a plain activity verb — it takes hebben, not zijn."},{"t":"Zij hebben voetbal gespeeld.","ok":true,"why":"Correct — hebben is right, and gespeeld is the regular participle (stem 'speel' ends in l → -d)."},{"t":"Zij hebben voetbal speeld.","ok":false,"why":"Missing the ge- prefix required on every regular participle."}]},{"k":"mc","sub":"A","prompt":"\"I have stayed home.\"","opts":[{"t":"Ik heb thuis gebleven.","ok":false,"why":"blijven is one of the fixed zijn-verbs, along with zijn itself — it never takes hebben."},{"t":"Ik ben thuis gebleven.","ok":true,"why":"Correct — blijven always takes zijn, and gebleven is its irregular participle."},{"t":"Ik ben thuis geblijven.","ok":false,"why":"Wrong participle spelling — the irregular form is gebleven, not a regularized geblijven."}]},{"k":"mc","sub":"A","prompt":"\"You (informal) have bought a book.\"","opts":[{"t":"Je bent een boek gekocht.","ok":false,"why":"kopen is a plain transaction verb, not a motion or state-change verb — it takes hebben."},{"t":"Je hebt een boek gekocht.","ok":true,"why":"Correct — hebben is right, and gekocht is kopen's irregular participle."},{"t":"Je hebt een boek gekoopt.","ok":false,"why":"Wrong participle — kopen doesn't follow the regular t/d pattern; the irregular form is gekocht."}]},{"k":"mc","sub":"A","prompt":"\"We have arrived early.\"","opts":[{"t":"Wij hebben vroeg aangekomen.","ok":false,"why":"aankomen is a motion verb with a clear endpoint — it takes zijn, not hebben."},{"t":"Wij zijn vroeg aangekomen.","ok":true,"why":"Correct — zijn is right, and aangekomen keeps komen's irregular participle with ge- moved after the separable prefix aan-."},{"t":"Wij zijn vroeg gekomen.","ok":false,"why":"Drops the separable prefix aan- — the participle should be aangekomen, not gekomen."}]},{"k":"mc","sub":"A","prompt":"\"My grandfather has died.\"","opts":[{"t":"Mijn opa heeft gestorven.","ok":false,"why":"sterven is a change of state with a clear endpoint — it takes zijn, not hebben."},{"t":"Mijn opa is gestorven.","ok":true,"why":"Correct — sterven always takes zijn, and gestorven is its irregular participle."},{"t":"Mijn opa is gestorf.","ok":false,"why":"Not a real Dutch participle — the irregular form is gestorven."}]},{"k":"mc","sub":"A","prompt":"\"I have read the letter.\"","opts":[{"t":"Ik ben de brief gelezen.","ok":false,"why":"lezen is a plain transitive verb — it takes hebben, not zijn."},{"t":"Ik heb de brief gelezen.","ok":true,"why":"Correct — hebben is right, and gelezen is lezen's irregular participle."},{"t":"Ik heb de brief leest.","ok":false,"why":"leest is a present-tense form, not the participle — the correct participle is gelezen."}]},{"k":"fill","prompt":"Ik ___ gisteren naar het feest gegaan.","gloss":"(I went to the party yesterday — auxiliary for gaan, ik-form)","ans":["ben"],"why":"Zijn-verb (motion with destination) — ik-form is 'ben'."},{"k":"fill","prompt":"Zij heeft de hele avond ___.","gloss":"(She worked the whole evening — participle of werken)","ans":["gewerkt"],"why":"Regular participle of werken — stem 'werk' ends in k, so it takes -t."},{"k":"fill","prompt":"We ___ vorige week verhuisd.","gloss":"(We moved last week — auxiliary for verhuizen, we-form)","ans":["zijn"],"why":"Verhuizen (to move house) is a change-of-location verb — takes zijn; we-form is 'zijn'."},{"k":"fill","prompt":"Heb jij die film al ___?","gloss":"(Have you already seen that movie? — participle of zien)","ans":["gezien"],"why":"Irregular participle of zien."},{"k":"fill","prompt":"Hij is vanochtend laat ___.","gloss":"(He got up late this morning — participle of opstaan)","ans":["opgestaan"],"why":"Irregular participle of opstaan — takes zijn (change of position), already given here."},{"k":"fill","prompt":"Ik heb net koffie ___.","gloss":"(I just drank coffee — participle of drinken)","ans":["gedronken"],"why":"Irregular participle of drinken."},{"k":"fill","prompt":"De kinderen ___ in de tuin gespeeld.","gloss":"(The children played in the garden — auxiliary for spelen, plural form)","ans":["hebben"],"why":"Spelen takes hebben — plural (de kinderen) form is 'hebben'."},{"k":"fill","prompt":"We ___ het antwoord niet gegeven.","gloss":"(We didn't give the answer — auxiliary for geven, we-form)","ans":["hebben"],"why":"Geven takes hebben — we-form is 'hebben'."},{"k":"fill","prompt":"Het weer is de laatste jaren erg ___.","gloss":"(The weather has changed a lot in recent years — participle of veranderen)","ans":["veranderd"],"why":"Regular participle of veranderen (stem ends in r → -d); takes zijn here because nothing else is doing the changing."},{"k":"fill","prompt":"Ik ___ die brief nog niet gelezen.","gloss":"(I haven't read that letter yet — auxiliary for lezen, ik-form)","ans":["heb"],"why":"Lezen takes hebben — ik-form is 'heb'."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik heb gisteren mijn moeder gebeld.","ok":false,"why":"This one is correct — bellen takes hebben, no motion or change of state involved."},{"t":"Ik ben gisteren mijn moeder gebeld.","ok":true,"why":"This is the error — bellen takes hebben, not zijn: 'Ik heb ... gebeld.'"},{"t":"Zij heeft gisteren haar moeder gebeld.","ok":false,"why":"This one is correct — same verb, same auxiliary, different subject."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Wij zijn naar Rotterdam verhuisd.","ok":false,"why":"This one is correct — verhuizen is a change-of-location verb, so zijn is right."},{"t":"Zij is de hele dag gewerkt.","ok":true,"why":"This is the error — werken takes hebben, not zijn: 'Zij heeft de hele dag gewerkt.'"},{"t":"Hij is vroeg wakker geworden.","ok":false,"why":"This one is correct — worden always takes zijn."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik heb een nieuwe fiets gekocht.","ok":false,"why":"This one is correct — kopen takes hebben, and gekocht is its irregular participle."},{"t":"We hebben de hele film gezien.","ok":false,"why":"This one is correct — zien takes hebben."},{"t":"Ik heb een nieuwe fiets gekoopt.","ok":true,"why":"This is the error — kopen doesn't regularize; the irregular participle is gekocht, not gekoopt."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Mijn oma is vorig jaar gestorven.","ok":false,"why":"This one is correct — sterven always takes zijn."},{"t":"De situatie is helemaal veranderd.","ok":false,"why":"This one is correct — veranderen takes zijn here since nothing else is doing the changing."},{"t":"De planten hebben snel gegroeid.","ok":true,"why":"This is the error — groeien describes a change of state, so it takes zijn: 'De planten zijn snel gegroeid.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Heb je het boek al gelezen?","ok":false,"why":"This one is correct — lezen takes hebben."},{"t":"Ben je gisteren naar het feest gegaan?","ok":false,"why":"This one is correct — gaan takes zijn."},{"t":"Heb je gisteren vroeg opgestaan?","ok":true,"why":"This is the error — opstaan takes zijn, not hebben: 'Ben je gisteren vroeg opgestaan?'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Wij hebben het hele weekend gestudeerd.","ok":false,"why":"This one is correct — studeren takes hebben."},{"t":"Wij zijn het antwoord gegeven.","ok":true,"why":"This is the error — geven takes hebben, not zijn: 'Wij hebben het antwoord gegeven.'"},{"t":"Zij heeft ons het antwoord gegeven.","ok":false,"why":"This one is correct — geven takes hebben."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hij is gisteren aangekomen.","ok":false,"why":"This one is correct — aankomen takes zijn."},{"t":"Ik heb het glas water gedronken.","ok":false,"why":"This one is correct — drinken takes hebben."},{"t":"Hij is gisteren aankomen.","ok":true,"why":"This is the error — the participle is missing its ge-: it should be aangekomen, not aankomen."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zij is naar Spanje vertrokken.","ok":false,"why":"This one is correct — vertrekken takes zijn."},{"t":"Zij heeft naar Spanje vertrokken.","ok":true,"why":"This is the error — vertrekken takes zijn, not hebben: 'Zij is naar Spanje vertrokken.'"},{"t":"We hebben lang gewacht.","ok":false,"why":"This one is correct — wachten takes hebben."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik ben moe geworden van het werk.","ok":false,"why":"This one is correct — worden always takes zijn."},{"t":"Hij heeft de hele nacht geslapen.","ok":false,"why":"This one is correct — slapen takes hebben."},{"t":"Ik heb moe geworden van het werk.","ok":true,"why":"This is the error — worden takes zijn, not hebben: 'Ik ben moe geworden.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"We hebben gisteren pizza gegeten.","ok":false,"why":"This one is correct — eten takes hebben, and gegeten is its irregular participle."},{"t":"We hebben gisteren pizza geeten.","ok":true,"why":"This is the error — the irregular participle is gegeten, not the regularized geeten."},{"t":"Zij is thuis gebleven.","ok":false,"why":"This one is correct — blijven always takes zijn."}]},{"k":"mc","sub":"D","prompt":"\"Yesterday I called my mother.\"","opts":[{"t":"Gisteren heb ik mijn moeder gebeld.","ok":true,"why":"Correct — 'heb' inverts into position 2 after the fronted time word 'gisteren', and 'gebeld' ends the clause."},{"t":"Gisteren ik heb mijn moeder gebeld.","ok":false,"why":"No inversion after the fronted time word — 'heb' needs to move to position 2, before 'ik'."},{"t":"Gisteren heb ik mijn moeder bellen.","ok":false,"why":"Wrong verb form at the end — that's the bare infinitive, not the participle 'gebeld'."}]},{"k":"mc","sub":"D","prompt":"\"I think that she has already left.\"","opts":[{"t":"Ik denk dat zij al vertrokken is.","ok":true,"why":"Correct — 'dat' sends the verb cluster to the end, and vertrekken takes zijn."},{"t":"Ik denk dat zij al vertrokken heeft.","ok":false,"why":"Wrong auxiliary — vertrekken takes zijn, not hebben."},{"t":"Ik denk zij al vertrokken is.","ok":false,"why":"Drops 'dat' — without it, this needs normal V2 order instead: 'ik denk, zij is al vertrokken.'"}]},{"k":"mc","sub":"D","prompt":"\"Because she had studied a lot, she passed.\"","opts":[{"t":"Omdat zij veel heeft gestudeerd, is zij geslaagd.","ok":true,"why":"Correct — the verb cluster ends the 'omdat' clause, and the main clause inverts ('is zij') right after it."},{"t":"Omdat zij veel heeft gestudeerd, zij is geslaagd.","ok":false,"why":"Main clause isn't inverted — it should be 'is zij geslaagd', not 'zij is geslaagd'."},{"t":"Omdat zij veel gestudeerd heeft, heeft zij geslaagd.","ok":false,"why":"Wrong auxiliary in the main clause — slagen (to pass/succeed) takes zijn, not hebben."}]},{"k":"mc","sub":"D","prompt":"\"While he had been sick, we visited him.\"","opts":[{"t":"Terwijl hij ziek is geweest, hebben wij hem bezocht.","ok":true,"why":"Correct — both verb clusters end their clauses, and the main clause inverts after the fronted 'terwijl' clause."},{"t":"Terwijl hij ziek is geweest, wij hebben hem bezocht.","ok":false,"why":"Main clause isn't inverted after the fronted subordinate clause."},{"t":"Terwijl hij ziek is geweest, hebben wij hem gebezocht.","ok":false,"why":"bezoeken has an inseparable prefix (be-) — no ge- is added; the participle is bezocht, not gebezocht."}]},{"k":"mc","sub":"D","prompt":"\"I have already eaten.\"","opts":[{"t":"Ik heb al gegeten.","ok":true,"why":"Correct — hebben plus the irregular participle gegeten."},{"t":"Ik ben al gegeten.","ok":false,"why":"Wrong auxiliary — eten takes hebben, not zijn."},{"t":"Ik heb al geëten.","ok":false,"why":"Wrong participle spelling — the irregular form is gegeten."}]},{"k":"mc","sub":"D","prompt":"\"Since he had been sick, he has stayed home.\"","opts":[{"t":"Sinds hij ziek is geweest, is hij thuis gebleven.","ok":true,"why":"Correct — both clusters end their clauses, and the main clause inverts after the fronted 'sinds' clause."},{"t":"Sinds hij ziek is geweest, hij is thuis gebleven.","ok":false,"why":"Main clause isn't inverted — it should be 'is hij thuis gebleven'."},{"t":"Sinds hij ziek is geweest, heeft hij thuis gebleven.","ok":false,"why":"Wrong auxiliary in the main clause — blijven always takes zijn."}]},{"k":"mc","sub":"D","prompt":"\"Although she has already eaten, she is still hungry.\"","opts":[{"t":"Hoewel zij al gegeten heeft, heeft zij nog steeds honger.","ok":true,"why":"Correct — the 'hoewel' clause ends in its verb cluster, and the main clause keeps normal V2 order ('heeft zij')."},{"t":"Hoewel zij al gegeten heeft, zij heeft nog steeds honger.","ok":false,"why":"Main clause isn't inverted after the fronted 'hoewel' clause."},{"t":"Hoewel zij al geëten heeft, heeft zij nog steeds honger.","ok":false,"why":"Wrong participle spelling in the subordinate clause — the irregular form is gegeten."}]},{"k":"mc","sub":"D","prompt":"\"We have lived here for ten years.\"","opts":[{"t":"Wij hebben hier tien jaar gewoond.","ok":true,"why":"Correct — wonen takes hebben, and gewoond is its regular participle (stem 'woon' ends in n → -d)."},{"t":"Wij zijn hier tien jaar gewoond.","ok":false,"why":"Wrong auxiliary — wonen isn't a motion or change-of-state verb; it takes hebben."},{"t":"Wij hebben hier tien jaar woond.","ok":false,"why":"Missing the ge- prefix required on every regular participle."}]},{"k":"mc","sub":"D","prompt":"\"Because the weather has changed, we are staying inside.\"","opts":[{"t":"Omdat het weer is veranderd, blijven we binnen.","ok":true,"why":"Correct — the 'omdat' clause ends in its verb cluster, and the main clause inverts ('blijven we') right after it."},{"t":"Omdat het weer is veranderd, we blijven binnen.","ok":false,"why":"Main clause isn't inverted — it should be 'blijven we binnen', not 'we blijven binnen'."},{"t":"Omdat het weer heeft veranderd, blijven we binnen.","ok":false,"why":"Wrong auxiliary in the subordinate clause — veranderen takes zijn when nothing else is doing the changing."}]},{"k":"mc","sub":"D","prompt":"\"He has left, and she has arrived.\"","opts":[{"t":"Hij is vertrokken, en zij is aangekomen.","ok":true,"why":"Correct — both vertrekken and aankomen take zijn, and 'en' is coordinating, so both clauses keep normal main-clause order."},{"t":"Hij heeft vertrokken, en zij heeft aangekomen.","ok":false,"why":"Wrong auxiliary in both clauses — vertrekken and aankomen both take zijn, not hebben."},{"t":"Hij is vertrokken, en zij aangekomen is.","ok":false,"why":"'en' is coordinating, not subordinating — it doesn't send the verb to the end, unlike 'omdat'. The second clause should keep normal order: 'zij is aangekomen.'"}]},{"k":"tr","prompt":"Translate: \"I ate an apple.\"","ans":["ik heb een appel gegeten"],"why":"Hebben + the irregular participle gegeten."},{"k":"tr","prompt":"Translate: \"She went to Amsterdam.\"","ans":["zij is naar amsterdam gegaan","ze is naar amsterdam gegaan"],"why":"Gaan takes zijn; zij/ze are both fine."},{"k":"tr","prompt":"Translate: \"We have already drunk coffee.\"","ans":["we hebben al koffie gedronken","wij hebben al koffie gedronken"],"why":"Drinken takes hebben; we/wij are both fine."},{"k":"tr","prompt":"Translate: \"He became sick.\"","ans":["hij is ziek geworden"],"why":"Worden always takes zijn."},{"k":"tr","prompt":"Translate: \"I have lived in Utrecht for five years.\"","ans":["ik heb vijf jaar in utrecht gewoond"],"why":"Wonen takes hebben; time before place is the natural order."},{"k":"tr","prompt":"Translate: \"They have stayed home.\"","ans":["zij zijn thuis gebleven","ze zijn thuis gebleven"],"why":"Blijven always takes zijn; zij/ze are both fine."},{"k":"tr","prompt":"Translate: \"I think that he has already arrived.\"","ans":["ik denk dat hij al aangekomen is","ik denk dat hij al is aangekomen"],"why":"Both cluster orders (participle-then-aux or aux-then-participle) are standard in a 'dat' clause."},{"k":"tr","prompt":"Translate: \"Because it rained, we're staying inside.\"","ans":["omdat het heeft geregend, blijven we binnen","omdat het geregend heeft, blijven we binnen"],"why":"Weather verbs like regenen take hebben; either cluster order is fine."},{"k":"tr","prompt":"Translate: \"I have never eaten sushi.\"","ans":["ik heb nog nooit sushi gegeten","ik heb nooit sushi gegeten"],"why":"Eten takes hebben; 'nog nooit' and 'nooit' are both natural."},{"k":"tr","prompt":"Translate: \"After my grandmother died, everything changed.\"","ans":["nadat mijn oma gestorven is, is alles veranderd","nadat mijn oma is gestorven, is alles veranderd"],"why":"Sterven and veranderen (intransitive) both take zijn; either cluster order works in the 'nadat' clause."},{"k":"match","prompt":"Match the infinitive to its correct past participle.","L":[{"key":"1","t":"gaan","say":"gaan"},{"key":"2","t":"eten","say":"eten"},{"key":"3","t":"blijven","say":"blijven"},{"key":"4","t":"drinken","say":"drinken"},{"key":"5","t":"worden","say":"worden"}],"R":[{"key":"4","t":"gedronken","say":""},{"key":"1","t":"gegaan","say":""},{"key":"5","t":"geworden","say":""},{"key":"3","t":"gebleven","say":""},{"key":"2","t":"gegeten","say":""}]},{"k":"match","prompt":"Match the infinitive to its correct past participle.","L":[{"key":"1","t":"werken","say":"werken"},{"key":"2","t":"wonen","say":"wonen"},{"key":"3","t":"zien","say":"zien"},{"key":"4","t":"kopen","say":"kopen"},{"key":"5","t":"vertrekken","say":"vertrekken"}],"R":[{"key":"4","t":"gekocht","say":""},{"key":"3","t":"gezien","say":""},{"key":"5","t":"vertrokken","say":""},{"key":"1","t":"gewerkt","say":""},{"key":"2","t":"gewoond","say":""}]}]},{"id":"modals","group":"Verbs","name":"Modal verbs","title":"Modal Verbs: Must, May, Can, Want, Will — and the Hoeven Trap","rule":"<h2>The rule<\/h2><p>Dutch has five true modal verbs, plus a sixth verb, <code>hoeven<\/code>, that behaves like a modal but only surfaces in negative or restrictive contexts. All six combine with an infinitive that goes to the end of the clause — with one structural difference: <code>hoeven<\/code> is the only one of the six that requires <code>te<\/code> before that infinitive.<\/p><table>\n<tr><th>Verb<\/th><th>Core meaning<\/th><th>Example<\/th><th>Gloss<\/th><\/tr>\n<tr><td><code>moeten<\/code><\/td><td>obligation — must, have to<\/td><td>Ik moet nu gaan.<\/td><td>I have to go now.<\/td><\/tr>\n<tr><td><code>mogen<\/code><\/td><td>permission — may, be allowed to<\/td><td>Mag ik het raam openen?<\/td><td>May I open the window?<\/td><\/tr>\n<tr><td><code>kunnen<\/code><\/td><td>ability/possibility — can, be able to<\/td><td>Kun je me helpen?<\/td><td>Can you help me?<\/td><\/tr>\n<tr><td><code>willen<\/code><\/td><td>desire — want to<\/td><td>Ik wil een koffie.<\/td><td>I want a coffee.<\/td><\/tr>\n<tr><td><code>zullen<\/code><\/td><td>future / softened suggestion — will, shall<\/td><td>Zullen we gaan?<\/td><td>Shall we go?<\/td><\/tr>\n<tr><td><code>hoeven<\/code><\/td><td>absence of obligation — needs <code>te<\/code>, negative-only<\/td><td>Je hoeft niet te wachten.<\/td><td>You don't have to wait.<\/td><\/tr>\n<\/table><blockquote class=\"example\">\n<span class=\"nl\">Zullen we samen koken?<\/span><br><\/br>\n<span class=\"gloss\">Shall we together cook? → \"Shall we cook together?\" — zullen softens an invitation into something less blunt than a plain command or a bare \"do you want to.\"<\/span>\n<\/blockquote><p><code>Mogen<\/code> is also your polite-request verb: <code>Mag ik u iets vragen?<\/code> (\"May I ask you something?\") reads as more deferential than <code>Kan ik...?<\/code>, which leans on ability/possibility rather than permission. Native speakers blur these two in casual speech, but the underlying distinction — permission versus capability — is what this lesson is really about, and it's sharpest in the negative.<\/p><h2>The moeten/hoeven trap<\/h2><p>This is the classic mistake at this level, and it sounds completely fluent when you make it — which is exactly why it's worth its own section. <code>Moeten<\/code> negated does not mean \"don't have to.\" It means \"must not.\"<\/p><blockquote class=\"example\">\n<span class=\"nl\">Je moet dat niet doen.<\/span><br><\/br>\n<span class=\"gloss\">You must that not do. → \"You shouldn't do that\" / \"you'd better not\" — advice or a mild warning, not neutral information about obligation.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Je hoeft dat niet te doen.<\/span><br><\/br>\n<span class=\"gloss\">You need that not to do. → \"You don't need to do that\" — there's simply no obligation. Nothing is being advised against.<\/span>\n<\/blockquote><p>Notice the second sentence needs <code>te<\/code> before the infinitive (<code>te doen<\/code>) — <code>moeten<\/code> never takes <code>te<\/code>, so this is also the single most common accidental tell that a learner meant <code>hoeven<\/code> but grabbed <code>moeten<\/code> instead, or grabbed <code>hoeven<\/code> but forgot the <code>te<\/code>. And <code>hoeven<\/code> almost never appears without a <code>niet<\/code>, <code>geen<\/code>, or similar restricting word nearby — unlike the other five modals, it doesn't really have a plain affirmative use.<\/p><p>There's a third player worth keeping in the same frame: <code>mogen<\/code> negated, which is about permission being denied rather than obligation being absent or advised against.<\/p><table>\n<tr><th>Form<\/th><th>Feel<\/th><th>Example<\/th><th>Gloss<\/th><\/tr>\n<tr><td><code>mag niet<\/code><\/td><td>forbidden — a rule or authority says no<\/td><td>Je mag hier niet roken.<\/td><td>You're not allowed to smoke here.<\/td><\/tr>\n<tr><td><code>moet niet<\/code><\/td><td>shouldn't — advice or a warning against it<\/td><td>Je moet niet zoveel piekeren.<\/td><td>You shouldn't worry so much.<\/td><\/tr>\n<tr><td><code>hoeft niet (te)<\/code><\/td><td>not required — free to skip it either way<\/td><td>Je hoeft niet te wachten.<\/td><td>You don't have to wait.<\/td><\/tr>\n<\/table><div class=\"callout\">\n<strong>The three-door test:<\/strong> <code>mag niet<\/code> — the door is locked; a rule or someone in authority forbids it. <code>moet niet<\/code> — the door's open, but I wouldn't walk through it if I were you; that's advice, not a rule. <code>hoeft niet<\/code> — the door's open and walking through is entirely optional; nobody's telling you either way. All three can gloss as some flavor of \"don't\" in English. In Dutch they're three different verbs, and swapping them changes what you're actually telling someone.\n<\/div><h2>Modal + infinitive: word order at the end of the clause<\/h2><p>Verb clusters covered verb clusters — what happens when a subordinate clause stacks two or three verbs at the end. Modal + infinitive is the cluster you'll produce most often, so it's worth being explicit about its shape. In a main clause, the modal takes the V2 slot and the infinitive is pushed to the very end:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ik moet dit boek lezen.<\/span><br><\/br>\n<span class=\"gloss\">I must this book read. → \"I have to read this book.\" Moet in position 2, lezen closes the clause.<\/span>\n<\/blockquote><p>In a subordinate clause, both verbs move to the end together, and the pairing keeps the modal directly before the infinitive:<\/p><blockquote class=\"example\">\n<span class=\"nl\">...omdat ik dit boek moet lezen.<\/span><br><\/br>\n<span class=\"gloss\">...because I this book must read. → \"...because I have to read this book.\" Not \"...omdat ik dit boek lezen moet\" — that reversed order exists in older or literary Dutch, but sounds distinctly formal/dated in ordinary speech today.<\/span>\n<\/blockquote>","items":[{"k":"mc","sub":"A","prompt":"\"I have to work tomorrow.\"","opts":[{"t":"Ik moet morgen werken.","ok":true,"why":"Correct — moet in the V2 slot, werken closes the clause."},{"t":"Ik moeten morgen werken.","ok":false,"why":"Wrong conjugation — 'ik' takes 'moet', not the plural 'moeten'."},{"t":"Ik moet werken morgen.","ok":false,"why":"Wrong order — the infinitive must be the last word in the clause; 'morgen' belongs before it."}]},{"k":"mc","sub":"A","prompt":"\"Are you allowed to park here?\"","opts":[{"t":"Mag je hier parkeren?","ok":true,"why":"Correct — mogen for rule-based permission, matching 'allowed to'."},{"t":"Mogen je hier parkeren?","ok":false,"why":"Wrong conjugation — 'je' takes 'mag', not the plural 'mogen'."},{"t":"Kun je hier parkeren?","ok":false,"why":"Wrong modal for this meaning — this asks about capability or available space, not permission."}]},{"k":"mc","sub":"A","prompt":"\"Shall we go for a walk?\"","opts":[{"t":"Zullen we een eindje wandelen?","ok":true,"why":"Correct — 'zullen we...?' is the standard softened-suggestion pattern."},{"t":"Zal we een eindje wandelen?","ok":false,"why":"Wrong conjugation — 'we' takes 'zullen', not 'zal'."},{"t":"Moeten we een eindje wandelen?","ok":false,"why":"Wrong modal — this turns an invitation into a chore ('do we have to'), not a suggestion."}]},{"k":"mc","sub":"A","prompt":"\"I want to learn Dutch.\"","opts":[{"t":"Ik wil Nederlands leren.","ok":true,"why":"Correct — wil holds position 2, leren closes the clause."},{"t":"Ik Nederlands wil leren.","ok":false,"why":"Two elements sit before the verb ('Ik' and 'Nederlands') — V2 allows only one."},{"t":"Ik willen Nederlands leren.","ok":false,"why":"Wrong conjugation — 'ik' takes 'wil', not the plural 'willen'."}]},{"k":"mc","sub":"A","prompt":"\"You don't have to wait.\"","opts":[{"t":"Je hoeft niet te wachten.","ok":true,"why":"Correct — hoeven takes 'te' before the infinitive; this is the no-obligation reading."},{"t":"Je hoeft niet wachten.","ok":false,"why":"Missing 'te' — hoeven always needs it before the infinitive, unlike the other modals."},{"t":"Je moet niet wachten.","ok":false,"why":"Wrong modal — 'moet niet' reads as advice against waiting ('you shouldn't'), not as 'no need to'."}]},{"k":"mc","sub":"A","prompt":"\"Can I borrow your pen?\"","opts":[{"t":"Kan ik jouw pen lenen?","ok":true,"why":"Correct — kan in position 2, lenen closes the clause."},{"t":"Kunnen ik jouw pen lenen?","ok":false,"why":"Wrong conjugation — 'ik' takes 'kan', not the plural 'kunnen'."},{"t":"Kan ik lenen jouw pen?","ok":false,"why":"Wrong order — the infinitive 'lenen' must be the last word, not mid-sentence."}]},{"k":"mc","sub":"A","prompt":"\"You're not allowed to smoke here.\" (posted rule)","opts":[{"t":"Je mag hier niet roken.","ok":true,"why":"Correct — mag niet marks a rule-based prohibition, the right register for a posted restriction."},{"t":"Je mogen hier niet roken.","ok":false,"why":"Wrong conjugation — 'je' takes 'mag', not the plural 'mogen'."},{"t":"Je moet hier niet roken.","ok":false,"why":"Wrong modal — 'moet niet' reads as personal advice ('you shouldn't'), not an official rule."}]},{"k":"mc","sub":"A","prompt":"\"He will probably call tonight.\"","opts":[{"t":"Hij zal vanavond wel bellen.","ok":true,"why":"Correct — zal in position 2, bellen closes the clause, 'wel' softens it into a likely prediction."},{"t":"Hij zullen vanavond wel bellen.","ok":false,"why":"Wrong conjugation — 'hij' takes 'zal', not the plural 'zullen'."},{"t":"Hij zal bellen vanavond wel.","ok":false,"why":"Wrong order — nothing should follow the clause-final infinitive 'bellen'."}]},{"k":"mc","sub":"A","prompt":"\"We may leave early today.\"","opts":[{"t":"We mogen vandaag vroeg weggaan.","ok":true,"why":"Correct — mogen agrees with 'we', weggaan (separable, joined) closes the clause."},{"t":"We mag vandaag vroeg weggaan.","ok":false,"why":"Wrong conjugation — 'we' takes 'mogen', not the singular 'mag'."},{"t":"We mogen vandaag weggaan vroeg.","ok":false,"why":"Wrong order — 'vroeg' needs to come before the infinitive, not after it."}]},{"k":"mc","sub":"A","prompt":"\"You don't need to buy a present.\"","opts":[{"t":"Je hoeft geen cadeau te kopen.","ok":true,"why":"Correct — hoeven + geen + te + infinitive, the standard no-obligation shape."},{"t":"Je hoeft geen cadeau kopen.","ok":false,"why":"Missing 'te' — hoeven requires it before the infinitive."},{"t":"Je moet geen cadeau kopen.","ok":false,"why":"Wrong modal — 'moet geen' reads as a prohibition against buying one, not 'no need to'."}]},{"k":"fill","prompt":"Ik ___ morgen werken.","gloss":"(I have to work tomorrow)","ans":["moet"],"why":"Moeten, ik-form: obligation."},{"k":"fill","prompt":"___ ik het raam openen?","gloss":"(May I open the window?)","ans":["mag"],"why":"Mogen, ik-form, in a permission question — same form whether inverted or not."},{"k":"fill","prompt":"Jij ___ heel goed koken.","gloss":"(You can cook very well)","ans":["kan","kunt"],"why":"Kunnen, jij-form: 'kan' colloquial, 'kunt' more formal/written — both accepted."},{"k":"fill","prompt":"Ik ___ graag een kopje koffie.","gloss":"(I'd like a cup of coffee)","ans":["wil"],"why":"Willen, ik-form: desire. 'Wil graag' softens it into a polite request."},{"k":"fill","prompt":"___ we morgen naar het strand gaan?","gloss":"(Shall we go to the beach tomorrow?)","ans":["zullen"],"why":"Zullen, we-form: the classic 'shall we...?' suggestion pattern."},{"k":"fill","prompt":"Je ___ niet te wachten.","gloss":"(You don't have to wait)","ans":["hoeft"],"why":"Hoeven, jij-form. Note 'te' is already there in the sentence — hoeven always needs it."},{"k":"fill","prompt":"Je ___ niet zoveel piekeren.","gloss":"(You shouldn't worry so much)","ans":["moet"],"why":"Moeten, jij-form, negated: advice/mild prohibition — 'moet niet' means 'shouldn't', not 'don't have to'."},{"k":"fill","prompt":"Je ___ geen jas mee te nemen.","gloss":"(You don't need to bring a coat)","ans":["hoeft"],"why":"Hoeven, jij-form, with 'geen' instead of 'niet' — still needs 'te' before the infinitive."},{"k":"fill","prompt":"___ ik de deur dichtdoen?","gloss":"(Shall I close the door?)","ans":["zal"],"why":"Zullen, ik-form: the classic polite-offer pattern, 'zal ik...?'."},{"k":"fill","prompt":"Het ___ zijn dat hij te laat is.","gloss":"(It could be that he's late)","ans":["kan"],"why":"Kunnen, het-form, expressing possibility rather than ability — 'het kan zijn dat...' = 'it could be that...'."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik moet morgen werken.","ok":false,"why":"Correct — moeten agrees with 'ik', werken closes the clause."},{"t":"Zij mag hier niet roken.","ok":false,"why":"Correct — mag niet marks the rule-based prohibition correctly."},{"t":"Je hoeft niet wachten.","ok":true,"why":"This is the error — hoeven always needs 'te' before the infinitive: 'Je hoeft niet te wachten.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Kun je me helpen?","ok":false,"why":"Correct — kan agrees with 'je'."},{"t":"Wil je een kopje thee?","ok":false,"why":"Correct — dropping 'hebben' here is a standard idiomatic offer, like English 'want a coffee?'."},{"t":"Ik moeten nu gaan.","ok":true,"why":"This is the error — 'ik' takes 'moet', not the plural 'moeten': 'Ik moet nu gaan.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zullen we vanavond koken?","ok":false,"why":"Correct — zullen agrees with 'we', koken closes the clause."},{"t":"Je mag hier binnen niet roken.","ok":false,"why":"Correct — 'hier binnen' sits before 'niet roken', and the infinitive is last."},{"t":"Ik wil leren Nederlands.","ok":true,"why":"This is the error — the infinitive must close the clause: 'Ik wil Nederlands leren.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ze hoeft vanavond niet te koken.","ok":false,"why":"Correct — hoeft agrees with 'ze', 'vanavond' sits before the te-infinitive."},{"t":"Wij mogen morgen laat opstaan.","ok":false,"why":"Correct — mogen agrees with 'wij', opstaan (separable, joined) closes the clause."},{"t":"Hij kunnen niet goed zwemmen.","ok":true,"why":"This is the error — 'hij' takes 'kan', not the plural 'kunnen': 'Hij kan niet goed zwemmen.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Mag ik iets vragen?","ok":false,"why":"Correct — mogen agrees with 'ik' in a permission question."},{"t":"Je moet niet zoveel werken.","ok":false,"why":"Correct — 'moet niet' here is genuine advice against overworking."},{"t":"Zij wil een verhaal vertellen mij.","ok":true,"why":"This is the error — the object 'mij' belongs before the infinitive, not after it: 'Zij wil mij een verhaal vertellen.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Wij zullen je morgen bellen.","ok":false,"why":"Correct — zullen agrees with 'wij'."},{"t":"Hij mag niet binnenkomen.","ok":false,"why":"Correct — mag agrees with 'hij', binnenkomen (separable, joined) closes the clause."},{"t":"Ik hoeft niet te betalen.","ok":true,"why":"This is the error — 'ik' takes 'hoef', not 'hoeft' (that ending belongs to jij/hij/zij/het): 'Ik hoef niet te betalen.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Kunnen jullie morgen komen?","ok":false,"why":"Correct — kunnen agrees with 'jullie' in this inverted question."},{"t":"Je hoeft niet mee te gaan.","ok":false,"why":"Correct — hoeft agrees with 'je', 'mee te gaan' is the right separable + te shape."},{"t":"Wij zal vroeg vertrekken.","ok":true,"why":"This is the error — 'wij' takes 'zullen', not 'zal': 'Wij zullen vroeg vertrekken.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zal ik het licht uitdoen?","ok":false,"why":"Correct — zal agrees with 'ik' in this inverted offer."},{"t":"Ze mag vanavond laat thuiskomen.","ok":false,"why":"Correct — mag agrees with 'ze', thuiskomen (separable, joined) closes the clause."},{"t":"Mogen jij hier fietsen?","ok":true,"why":"This is the error — 'jij' takes 'mag', not the plural 'mogen': 'Mag jij hier fietsen?'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik wil je iets vertellen.","ok":false,"why":"Correct — wil agrees with 'ik', vertellen closes the clause."},{"t":"Mogen wij hier fietsen?","ok":false,"why":"Correct — mogen agrees with 'wij' in this inverted question."},{"t":"Zij kan niet komt vanavond.","ok":true,"why":"This is the error — after a modal, the second verb must be a bare infinitive, not conjugated, and it belongs at the end: 'Zij kan vanavond niet komen.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Wij moeten dit formulier invullen.","ok":false,"why":"Correct — moeten agrees with 'wij', invullen (separable, joined) closes the clause."},{"t":"Je hoeft dit niet in te vullen.","ok":false,"why":"Correct — with hoeven + a separable verb, 'te' splits the prefix from the stem: 'niet in te vullen'."},{"t":"Zij hoeft dit te niet invullen.","ok":true,"why":"This is the error — 'te' has drifted to the wrong spot: 'Zij hoeft dit niet in te vullen.'"}]},{"k":"mc","sub":"D","prompt":"\"Because I have to work, I'm staying home.\"","opts":[{"t":"Omdat ik moet werken, blijf ik thuis.","ok":true,"why":"Correct — 'moet werken' clusters at the end of the omdat-clause, and 'blijf' inverts before 'ik' afterward."},{"t":"Omdat ik werken moet, blijf ik thuis.","ok":false,"why":"The cluster order is reversed — modern standard Dutch keeps the modal directly before the infinitive here: 'moet werken', not 'werken moet'."},{"t":"Omdat ik moet werken, ik blijf thuis.","ok":false,"why":"The main clause isn't inverted after the fronted omdat-clause."}]},{"k":"mc","sub":"D","prompt":"\"I hope that you don't have to work tomorrow.\"","opts":[{"t":"Ik hoop dat je morgen niet hoeft te werken.","ok":true,"why":"Correct — 'hoeft te werken' clusters at the end of the dat-clause with 'te' in place."},{"t":"Ik hoop dat je morgen niet hoeft werken.","ok":false,"why":"Missing 'te' — hoeven always needs it before the infinitive."},{"t":"Ik hoop dat je morgen niet moet werken.","ok":false,"why":"Wrong modal — this is the classic mix-up: 'niet moet werken' reads as advice against working, not 'doesn't have to'."}]},{"k":"mc","sub":"D","prompt":"\"Shall we ask if we may come in?\"","opts":[{"t":"Zullen we vragen of we mogen binnenkomen?","ok":true,"why":"Correct — 'mogen binnenkomen' clusters correctly at the end of the of-clause."},{"t":"Zullen we vragen of we binnenkomen mogen?","ok":false,"why":"The cluster order is reversed — the modal belongs directly before the infinitive: 'mogen binnenkomen'."},{"t":"Zullen we vragen we mogen binnenkomen?","ok":false,"why":"Drops 'of', which the subordinate clause needs to attach to 'vragen'."}]},{"k":"mc","sub":"D","prompt":"\"Although she can swim well, she doesn't want to swim today.\"","opts":[{"t":"Hoewel ze goed kan zwemmen, wil ze vandaag niet zwemmen.","ok":true,"why":"Correct — 'kan zwemmen' clusters correctly in the hoewel-clause, and 'wil' inverts before 'ze' afterward."},{"t":"Hoewel ze goed zwemmen kan, wil ze vandaag niet zwemmen.","ok":false,"why":"The cluster order is reversed in the hoewel-clause — it should be 'kan zwemmen', not 'zwemmen kan'."},{"t":"Hoewel ze goed kan zwemmen, ze wil vandaag niet zwemmen.","ok":false,"why":"The main clause isn't inverted after the fronted hoewel-clause."}]},{"k":"mc","sub":"D","prompt":"\"I know that you don't need to help.\"","opts":[{"t":"Ik weet dat je niet hoeft te helpen.","ok":true,"why":"Correct — 'hoeft te helpen' clusters at the end of the dat-clause with 'te' in place."},{"t":"Ik weet dat je niet hoeft helpen.","ok":false,"why":"Missing 'te' — hoeven always needs it before the infinitive."},{"t":"Ik weet dat je niet moet helpen.","ok":false,"why":"Wrong modal — 'niet moet helpen' reads as advice against helping, not 'doesn't need to'."}]},{"k":"mc","sub":"D","prompt":"\"Because it's raining, we can't cycle.\"","opts":[{"t":"Omdat het regent, kunnen we niet fietsen.","ok":true,"why":"Correct — 'regent' ends the omdat-clause, and 'kunnen' inverts before 'we' in the main clause."},{"t":"Omdat het regent, we kunnen niet fietsen.","ok":false,"why":"The main clause isn't inverted after the fronted omdat-clause."},{"t":"Omdat het regent, kunnen we fietsen niet.","ok":false,"why":"Wrong order — the infinitive 'fietsen' must close the clause, not 'niet'."}]},{"k":"mc","sub":"D","prompt":"\"I think that she wants to help you.\"","opts":[{"t":"Ik denk dat ze je wil helpen.","ok":true,"why":"Correct — 'wil helpen' clusters correctly at the end of the dat-clause."},{"t":"Ik denk dat ze je helpen wil.","ok":false,"why":"The cluster order is reversed — the modal belongs directly before the infinitive: 'wil helpen'."},{"t":"Ik denk ze wil je helpen.","ok":false,"why":"Drops 'dat', turning it into two separate main clauses instead of one dat-clause."}]},{"k":"mc","sub":"D","prompt":"\"We shall see whether he's allowed to come along.\"","opts":[{"t":"We zullen zien of hij mag meekomen.","ok":true,"why":"Correct — 'mag meekomen' clusters correctly at the end of the of-clause."},{"t":"We zullen zien of hij meekomen mag.","ok":false,"why":"The cluster order is reversed — the modal belongs directly before the infinitive: 'mag meekomen'."},{"t":"We zullen zien of hij moet meekomen.","ok":false,"why":"Wrong modal — 'moet meekomen' asks whether he has to come along, a different question from being allowed to."}]},{"k":"mc","sub":"D","prompt":"\"Because you don't need to hurry, we can walk slowly.\"","opts":[{"t":"Omdat je niet hoeft op te schieten, kunnen we rustig lopen.","ok":true,"why":"Correct — 'hoeft op te schieten' correctly splits the separable verb around 'te', and the main clause inverts after the comma."},{"t":"Omdat je niet hoeft opschieten, kunnen we rustig lopen.","ok":false,"why":"Missing 'te' — hoeven needs it even with separable verbs, splitting the prefix: 'op te schieten'."},{"t":"Omdat je niet hoeft op te schieten, we kunnen rustig lopen.","ok":false,"why":"The main clause isn't inverted after the fronted omdat-clause."}]},{"k":"mc","sub":"D","prompt":"\"I want to know if you may borrow the car.\"","opts":[{"t":"Ik wil weten of je de auto mag lenen.","ok":true,"why":"Correct — 'mag lenen' clusters correctly at the end of the of-clause."},{"t":"Ik wil weten of je de auto lenen mag.","ok":false,"why":"The cluster order is reversed — the modal belongs directly before the infinitive: 'mag lenen'."},{"t":"Ik wil weten je mag de auto lenen.","ok":false,"why":"Drops 'of', which the subordinate clause needs to attach to 'weten'."}]},{"k":"tr","prompt":"Translate: \"I have to work tomorrow.\"","ans":["ik moet morgen werken"],"why":"Moeten + infinitive, straightforward obligation."},{"k":"tr","prompt":"Translate: \"You don't have to come.\"","ans":["je hoeft niet te komen"],"why":"Hoeven always needs 'te' before the infinitive — the most common thing learners drop here."},{"k":"tr","prompt":"Translate: \"You shouldn't be late.\"","ans":["je moet niet te laat komen","je moet niet te laat zijn"],"why":"Moeten + niet is advisory/prohibitive ('shouldn't/mustn't') — different from hoeven's 'no obligation'. Note: this 'te' means 'too' (te laat = too late), unrelated to the hoeven-infinitive marker."},{"k":"tr","prompt":"Translate: \"May I ask you something?\"","ans":["mag ik je iets vragen","mag ik u iets vragen"],"why":"Mogen for a permission-flavored, polite request."},{"k":"tr","prompt":"Translate: \"Can you help me for a moment?\"","ans":["kun je me even helpen","kan je me even helpen","kunt u me even helpen"],"why":"Kunnen for a capability-based request — contrast with mogen's permission flavor."},{"k":"tr","prompt":"Translate: \"Shall we go for a walk?\"","ans":["zullen we een eindje wandelen","zullen we gaan wandelen"],"why":"'Zullen we...?' is the standard Dutch way to propose doing something together."},{"k":"tr","prompt":"Translate: \"You're not allowed to smoke here.\"","ans":["je mag hier niet roken"],"why":"Mag niet = forbidden by rule — contrast with hoeft niet (optional) and moet niet (advisory)."},{"k":"tr","prompt":"Translate: \"You don't need to bring anything.\"","ans":["je hoeft niets mee te nemen"],"why":"Hoeven + niets + te, with the separable verb 'meenemen' splitting around 'te': 'mee te nemen'."},{"k":"tr","prompt":"Translate: \"I want to ask you something.\"","ans":["ik wil je iets vragen"],"why":"Willen + infinitive, a plain statement of desire."},{"k":"tr","prompt":"Translate: \"Because I don't have to work tomorrow, I can sleep in.\"","ans":["omdat ik morgen niet hoef te werken, kan ik uitslapen"],"why":"Capstone: 'hoef te werken' clusters at the end of the omdat-clause with 'te' in place, and 'kan ik' inverts in the main clause afterward."},{"k":"match","prompt":"Match Dutch to English.","L":[{"key":"1","t":"Ik moet gaan.","say":"Ik moet gaan."},{"key":"2","t":"Mag ik binnenkomen?","say":"Mag ik binnenkomen?"},{"key":"3","t":"Kun je zwemmen?","say":"Kun je zwemmen?"},{"key":"4","t":"Ik wil koffie.","say":"Ik wil koffie."},{"key":"5","t":"Zullen we dansen?","say":"Zullen we dansen?"}],"R":[{"key":"3","t":"Can you swim?","say":""},{"key":"4","t":"I want coffee.","say":""},{"key":"2","t":"May I come in?","say":""},{"key":"5","t":"Shall we dance?","say":""},{"key":"1","t":"I have to go.","say":""}]},{"k":"match","prompt":"Match the Dutch negative form to its precise English meaning.","L":[{"key":"1","t":"Je mag hier niet roken.","say":"Je mag hier niet roken."},{"key":"2","t":"Je moet niet zoveel piekeren.","say":"Je moet niet zoveel piekeren."},{"key":"3","t":"Je hoeft niet te wachten.","say":"Je hoeft niet te wachten."},{"key":"4","t":"Je hoeft geen cadeau te kopen.","say":"Je hoeft geen cadeau te kopen."},{"key":"5","t":"Je mag hier niet parkeren.","say":"Je mag hier niet parkeren."}],"R":[{"key":"3","t":"There's no need to wait.","say":""},{"key":"5","t":"Parking here isn't allowed.","say":""},{"key":"1","t":"Smoking here is forbidden.","say":""},{"key":"4","t":"You don't have to buy a present.","say":""},{"key":"2","t":"You shouldn't worry so much.","say":""}]}]},{"id":"pronouns","group":"Word order","name":"Pronoun order","title":"Pronouns and Object Order: Where Everything Goes","rule":"<h2>The rule<\/h2><h3>1. Direct and indirect objects: who gets what, in what order<\/h3><p>Dutch marks \"who\" (indirect object, the receiver) and \"what\" (direct object, the thing given) by position, not by case endings. With two full noun phrases, the baseline order is <strong>indirect object before direct object<\/strong>:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ik geef <strong>de kinderen<\/strong> de cadeaus.<\/span><br><\/br>\n<span class=\"gloss\">I give the children the presents.<\/span>\n<\/blockquote><p>You can also demote the indirect object to a prepositional phrase with <code>aan<\/code> (\"to\"), which then trails after the direct object — common for emphasis, or once the direct object is already long:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ik geef de cadeaus <strong>aan de kinderen<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I give the presents to the children. — same meaning, recipient moved to the end for focus.<\/span>\n<\/blockquote><p>Now the part that trips people up: when <em>both<\/em> objects shrink to pronouns, the order <strong>flips<\/strong>. The direct-object pronoun jumps ahead of the indirect-object pronoun:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ik geef <strong>het<\/strong> <strong>haar<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I give it to her. — \"it\" (direct) before \"her\" (indirect): the reverse of the noun-noun order above.<\/span>\n<\/blockquote><p>Why the flip? Pronouns are \"light\" — already-known information — and light material races toward the front of the middle field, ahead of anything heavier. With a pronoun pair, the direct object (usually the more predictable \"thing\") slots in first, right after the verb; the indirect object follows immediately after it. If this feels backwards from English, that's because English keeps indirect-then-direct rigid (\"give her it\" barely gets used) — Dutch doesn't.<\/p><h3>2. \"Er\": the placeholder you can't skip<\/h3><p>English can drop a preposition's object entirely when it means \"it\": \"I love it\" needs no extra word after \"love.\" Dutch can't — a preposition always needs something after it, even an invisible \"it.\" For non-human or abstract referents, Dutch fuses <code>er<\/code> onto the preposition instead of using <code>het<\/code>:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Hou je van deze stad? — Ja, ik hou <strong>ervan<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">Do you love this city? — Yes, I love it. — not \"ik hou van het\".<\/span>\n<\/blockquote><p>The most common fused forms: <code>ervan<\/code> (of/about it), <code>ermee<\/code> (with it), <code>erover<\/code> (about it), <code>erin<\/code> (in it), <code>erop<\/code> (on it). This only covers things and ideas — for people, use the ordinary preposition plus personal pronoun (<code>over hem<\/code>, <code>met haar<\/code>), never <code>er<\/code>.<\/p><p>One wrinkle worth knowing: add <code>niet<\/code> (or certain other adverbs), and the fused word can split back apart, with the extra word wedged in the middle:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Ik denk <strong>er<\/strong> niet <strong>aan<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I'm not thinking about it. — not \"ik denk niet eraan\"; \"er\" moves up before \"niet\", same as any light pronoun.<\/span>\n<\/blockquote><h3>3. Reflexive pronouns<\/h3><p>Dutch reflexives (\"myself,\" \"yourself,\" and so on) mostly reuse the ordinary object pronouns — only the third person (and formal <em>u<\/em>) gets a dedicated word, <code>zich<\/code>:<\/p><table>\n<tr><th>Subject<\/th><th>Reflexive pronoun<\/th><\/tr>\n<tr><td>ik<\/td><td>me (mij)<\/td><\/tr>\n<tr><td>jij / je<\/td><td>je<\/td><\/tr>\n<tr><td>hij / zij / het, u<\/td><td>zich<\/td><\/tr>\n<tr><td>wij / we<\/td><td>ons<\/td><\/tr>\n<tr><td>jullie<\/td><td>je<\/td><\/tr>\n<tr><td>zij (plural)<\/td><td>zich<\/td><\/tr>\n<\/table><p>Common reflexive verbs worth knowing cold: <code>zich vergissen<\/code> (to be mistaken), <code>zich herinneren<\/code> (to remember), <code>zich wassen<\/code> (to wash oneself), <code>zich voelen<\/code> (to feel), <code>zich afvragen<\/code> (to wonder). Like other object pronouns, a reflexive is light and sits early — right after the finite verb in a main clause, right after the subject in a subordinate one:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Hij vergist <strong>zich<\/strong> vaak, omdat hij <strong>zich<\/strong> niet goed voorbereidt.<\/span><br><\/br>\n<span class=\"gloss\">He's often mistaken, because he doesn't prepare himself well.<\/span>\n<\/blockquote><h3>4. Where \"niet\" goes<\/h3><p>There's no one-line formula for \"niet\" placement, and anyone who gives you one is oversimplifying. The honest version: <strong>\"niet\" moves as far right as it can, but stops before whatever counts as the fixed \"endpoint\" of the clause.<\/strong> Worked examples beat a rule here:<\/p><blockquote class=\"example\">\n<span class=\"nl\">Hij rookt <strong>niet<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">He doesn't smoke. — nothing follows; \"niet\" simply ends the clause.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Ik heb het boek <strong>niet<\/strong> gelezen.<\/span><br><\/br>\n<span class=\"gloss\">I haven't read the book. — \"niet\" follows the definite direct object, precedes the participle.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Ik woon <strong>niet<\/strong> in Amsterdam.<\/span><br><\/br>\n<span class=\"gloss\">I don't live in Amsterdam. — \"niet\" goes before the prepositional phrase.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Nederlands is <strong>niet<\/strong> moeilijk.<\/span><br><\/br>\n<span class=\"gloss\">Dutch isn't difficult. — \"niet\" goes before the predicate adjective.<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Ik bel je <strong>niet<\/strong> terug.<\/span><br><\/br>\n<span class=\"gloss\">I'm not calling you back. — \"niet\" goes before the separable prefix.<\/span>\n<\/blockquote><p>The pattern across all five: a definite object or a light pronoun sits <em>before<\/em> \"niet\"; a prepositional phrase, a predicate adjective, a separable prefix, or the last verb of a cluster sits <em>after<\/em> it. Indefinite objects don't take \"niet\" at all — they take <code>geen<\/code> instead (<code>Ik heb geen tijd<\/code>, not <code>ik heb niet tijd<\/code>), which is its own lesson.<\/p><div class=\"callout\">\n<strong>The test that always works:<\/strong> light, already-known material — pronouns, reflexives, \"er,\" and \"niet\" itself — rushes toward the front of the middle field, right after the finite verb. Heavy or fixed material — a prepositional phrase, an adjective, a separable prefix, the last verb of a cluster — stays anchored at the back. Not sure where something goes? Ask whether it's light (pronoun-like) or the fixed endpoint of the clause. Light goes early, fixed stays late, and \"niet\" parks itself right at the seam between the two.\n<\/div><div class=\"callout\">\n<strong>Watch out — \"er\" is only for things, never people:<\/strong> <code>hij denkt erover na<\/code> works for a plan or a problem, but never for a person — \"he's thinking about her\" is <code>hij denkt aan haar<\/code>, not <code>hij denkt erover<\/code>. Mixing this up is one of the most common \"sounds foreign\" tells for English speakers, because English \"it\" doesn't force this split the way Dutch does.\n<\/div>","items":[{"k":"mc","sub":"A","prompt":"\"I give the teacher the book.\"","opts":[{"t":"Ik geef de leraar het boek.","ok":true,"why":"Correct — two full noun phrases, indirect object (de leraar) before direct object (het boek)."},{"t":"Ik geef het boek de leraar.","ok":false,"why":"A bare indirect noun can't trail after the direct object like this — it needs 'aan', or it needs to come first."},{"t":"Ik geef aan de leraar het boek.","ok":false,"why":"The 'aan'-phrase belongs after the direct object, not fronted before it."}]},{"k":"mc","sub":"A","prompt":"\"I'm giving the book to my sister.\"","opts":[{"t":"Ik geef het boek aan mijn zus.","ok":true,"why":"Correct — direct object first, then the recipient as an 'aan'-phrase at the end."},{"t":"Ik geef aan mijn zus het boek.","ok":false,"why":"The 'aan'-phrase is fronted here instead of trailing after the direct object."},{"t":"Ik geef mijn zus aan het boek.","ok":false,"why":"Swaps which noun 'aan' attaches to — this reads as giving your sister to the book."}]},{"k":"mc","sub":"A","prompt":"\"I'm giving it to him.\"","opts":[{"t":"Ik geef het hem.","ok":true,"why":"Correct — with two pronouns, the direct object (het) comes before the indirect object (hem)."},{"t":"Ik geef hem het.","ok":false,"why":"Reverses the pronoun-pair order — with two pronouns, direct comes before indirect, not the other way round."},{"t":"Ik het geef hem.","ok":false,"why":"Breaks V2 — the conjugated verb 'geef' must stay in second position, not the object 'het'."}]},{"k":"mc","sub":"A","prompt":"\"I'm giving it to her.\"","opts":[{"t":"Ik geef het haar.","ok":true,"why":"Correct — direct-object pronoun (het) before indirect-object pronoun (haar)."},{"t":"Ik geef haar het.","ok":false,"why":"Reverses the pronoun-pair order."},{"t":"Ik het geef haar.","ok":false,"why":"Breaks V2 — the finite verb has to stay second."}]},{"k":"mc","sub":"A","prompt":"\"I love it.\" (about a song, not a person)","opts":[{"t":"Ik hou ervan.","ok":true,"why":"Correct — 'van' fuses with 'er' for a non-human referent."},{"t":"Ik hou van het.","ok":false,"why":"'het' can't be the object of 'van' here — Dutch requires the fused form 'ervan' for things."},{"t":"Ik hou er van.","ok":false,"why":"When adjacent like this, 'er' and the preposition must fuse into one word: 'ervan', not two separate words."}]},{"k":"mc","sub":"A","prompt":"\"We're talking about it.\" (about a plan)","opts":[{"t":"We praten erover.","ok":true,"why":"Correct — 'over' fuses with 'er' for a non-human referent."},{"t":"We praten over het.","ok":false,"why":"'het' can't follow 'over' this way — the fused form 'erover' is required for things."},{"t":"We erover praten.","ok":false,"why":"Breaks V2 — 'erover' can't sit in front of the verb without triggering subject-verb inversion."}]},{"k":"mc","sub":"A","prompt":"\"He feels good today.\"","opts":[{"t":"Hij voelt zich goed vandaag.","ok":true,"why":"Correct — the reflexive 'zich' sits right after the verb, before the adjective and adverb."},{"t":"Hij voelt goed zich vandaag.","ok":false,"why":"'zich' should come right after the verb, not trail after the adjective."},{"t":"Hij zich voelt goed vandaag.","ok":false,"why":"Breaks V2 — the finite verb 'voelt' must be second, not 'zich'."}]},{"k":"mc","sub":"A","prompt":"\"I often make mistakes.\"","opts":[{"t":"Ik vergis me vaak.","ok":true,"why":"Correct — 'me' sits right after the verb, before the adverb 'vaak'."},{"t":"Ik vaak vergis me.","ok":false,"why":"Breaks V2 — the adverb can't sit before the finite verb here."},{"t":"Ik vergis vaak me.","ok":false,"why":"The light reflexive pronoun 'me' should come before the adverb, not after it."}]},{"k":"mc","sub":"A","prompt":"\"Dutch is not difficult.\"","opts":[{"t":"Nederlands is niet moeilijk.","ok":true,"why":"Correct — 'niet' goes right before the predicate adjective it negates."},{"t":"Nederlands is moeilijk niet.","ok":false,"why":"'niet' must precede the adjective it negates, not follow it."},{"t":"Nederlands niet is moeilijk.","ok":false,"why":"Breaks V2 — 'niet' can't sit before the finite verb 'is'."}]},{"k":"mc","sub":"A","prompt":"\"I'm not calling you back.\"","opts":[{"t":"Ik bel je niet terug.","ok":true,"why":"Correct — 'niet' goes before the separable prefix 'terug', after the light pronoun 'je'."},{"t":"Ik bel niet je terug.","ok":false,"why":"The light pronoun 'je' should come before 'niet', not after it."},{"t":"Ik bel je terug niet.","ok":false,"why":"'niet' must precede the separable prefix 'terug', not follow it."}]},{"k":"fill","prompt":"Ik geef het boek ___ mijn broer.","gloss":"(I give the book to my brother — fill the preposition)","ans":["aan"],"why":"The 'aan'-construction: direct object first, recipient as an 'aan'-phrase after it."},{"k":"fill","prompt":"Ik geef het ___.","gloss":"(I give it to her — object pronoun for \"her\")","ans":["haar"],"why":"With two pronouns, the direct object (het) comes first and the indirect object pronoun follows directly."},{"k":"fill","prompt":"Vind je deze muziek mooi? Ja, ik hou ___.","gloss":"(Yes, I love it — one fused word)","ans":["ervan"],"why":"Non-human referent + 'van' fuse into one word: 'ervan'."},{"k":"fill","prompt":"Wat vind je van dit plan? We moeten ___ praten.","gloss":"(...about it — one fused word)","ans":["erover"],"why":"Non-human referent (the plan) + 'over' fuse into one word: 'erover'."},{"k":"fill","prompt":"Zij voelt ___ niet lekker.","gloss":"(She doesn't feel well — reflexive pronoun for \"zij\")","ans":["zich"],"why":"Third person (zij) takes the dedicated reflexive pronoun 'zich', not a recycled object pronoun."},{"k":"fill","prompt":"Wij herinneren ___ die dag nog goed.","gloss":"(We still remember that day well — reflexive pronoun for \"wij\")","ans":["ons"],"why":"First person plural (wij) reuses the object pronoun 'ons' as its reflexive."},{"k":"fill","prompt":"Ik heb het boek ___ gelezen.","gloss":"(I haven't read the book)","ans":["niet"],"why":"'niet' follows the definite direct object (het boek) and precedes the participle."},{"k":"fill","prompt":"Ik woon ___ Amsterdam.","gloss":"(I don't live in Amsterdam — two words)","ans":["niet in"],"why":"'niet' goes before the prepositional phrase — here that means before 'in', two words together."},{"k":"fill","prompt":"Ik denk ___ aan.","gloss":"(I'm not thinking about it — the meeting — two words)","ans":["er niet"],"why":"Negation splits the fused 'eraan' back apart: 'er' fronts before 'niet', which sits before 'aan'."},{"k":"fill","prompt":"Ik bel je ___ op.","gloss":"(I'm not calling you — one word)","ans":["niet"],"why":"'niet' precedes the separable prefix 'op', after the light pronoun 'je'."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik geef de kinderen de cadeaus.","ok":false,"why":"Correct — indirect object (de kinderen) before direct object (de cadeaus), both full nouns."},{"t":"Ik geef de cadeaus de kinderen.","ok":true,"why":"This is the error — a bare indirect noun can't trail the direct object like this. Fix: 'Ik geef de cadeaus aan de kinderen' or 'Ik geef de kinderen de cadeaus.'"},{"t":"Ik geef de cadeaus aan de kinderen.","ok":false,"why":"Correct — the 'aan'-construction, direct object then recipient."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik geef het hem vandaag.","ok":false,"why":"Correct — direct pronoun (het) before indirect pronoun (hem), time adverb trailing."},{"t":"Ik stuur het haar gauw.","ok":false,"why":"Correct — same pronoun-pair order (het before haar), adverb trailing."},{"t":"Ik breng hem het straks.","ok":true,"why":"This is the error — reverses the pronoun-pair order. Fix: 'Ik breng het hem straks.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik geloof er echt in.","ok":false,"why":"Correct — 'er' fuses with 'in', split by the adverb 'echt' for emphasis."},{"t":"Zij denkt er vaak aan.","ok":false,"why":"Correct — the adverb 'vaak' can wedge between 'er' and 'aan', same pattern as with 'niet'."},{"t":"Hij rekent op er nu.","ok":true,"why":"This is the error — 'op' and 'er' are reversed and unfused. Fix: 'Hij rekent er nu op.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik praat over mijn zus.","ok":false,"why":"Correct — a person after 'over' takes the ordinary preposition, not 'er'."},{"t":"Ik praat er nu over.","ok":false,"why":"Correct — 'erover' split by the adverb 'nu', referring to a topic already established."},{"t":"Ik praat er over mijn zus.","ok":true,"why":"This is the error — 'er' can't combine with an explicit person-noun after 'over'. Fix: 'Ik praat over mijn zus' (drop 'er') or 'Ik praat erover' (drop the noun)."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik was me elke ochtend.","ok":false,"why":"Correct — 'me' is the reflexive for 'ik'."},{"t":"Zij vergist zich soms.","ok":false,"why":"Correct — 'zich' is the reflexive for third person 'zij'."},{"t":"Wij voelen zich moe.","ok":true,"why":"This is the error — 'zich' is third person only; 'wij' takes 'ons'. Fix: 'Wij voelen ons moe.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hij herinnert zich dat verhaal goed.","ok":false,"why":"Correct — 'zich' sits right after the verb, before the direct object."},{"t":"Je moet je niet afvragen waarom.","ok":false,"why":"Correct — under a modal, 'afvragen' stays whole at the end as an infinitive."},{"t":"Ik vraag af me dat vaak.","ok":true,"why":"This is the error — the separable prefix 'af' must move to the very end of the clause. Fix: 'Ik vraag me dat vaak af.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik heb de auto niet gewassen.","ok":false,"why":"Correct — 'niet' follows the definite direct object 'de auto'."},{"t":"Ik heb geen auto gewassen.","ok":false,"why":"Correct — an indefinite object takes 'geen', not 'niet'."},{"t":"Ik heb niet de auto gewassen.","ok":true,"why":"This is the error — 'niet' should follow the definite direct object, not precede it. Fix: 'Ik heb de auto niet gewassen.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zij woont niet in Rotterdam.","ok":false,"why":"Correct — 'niet' goes before the prepositional phrase 'in Rotterdam'."},{"t":"Hij belt me niet op.","ok":false,"why":"Correct — 'niet' goes before the separable prefix 'op'."},{"t":"Wij eten vanavond thuis niet.","ok":true,"why":"This is the error — 'niet' must precede 'thuis', not trail after it. Fix: 'Wij eten vanavond niet thuis.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik kan het niet vinden.","ok":false,"why":"Correct — 'niet' precedes the final infinitive 'vinden'."},{"t":"Zij wil dat niet doen.","ok":false,"why":"Correct — 'niet' precedes the final infinitive 'doen'."},{"t":"Hij mag hier roken niet.","ok":true,"why":"This is the error — 'niet' must precede the infinitive, not follow it. Fix: 'Hij mag hier niet roken.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik geef het hem niet.","ok":false,"why":"Correct — pronoun pair (het hem) stays together, 'niet' trails at the end."},{"t":"Ze stuurt het me niet.","ok":false,"why":"Correct — pronoun pair (het me) stays together, 'niet' trails at the end."},{"t":"Hij laat het niet me zien.","ok":true,"why":"This is the error — 'niet' splits the pronoun pair, which should stay together before 'niet'. Fix: 'Hij laat het me niet zien.'"}]},{"k":"mc","sub":"D","prompt":"\"I'm giving my father the car keys.\"","opts":[{"t":"Ik geef mijn vader de autosleutels.","ok":true,"why":"Correct — indirect object (mijn vader) before direct object (de autosleutels), both full nouns."},{"t":"Ik geef de autosleutels mijn vader.","ok":false,"why":"Bare double noun phrase with direct before indirect — needs 'aan' or the reverse order."},{"t":"Ik geef aan mijn vader de autosleutels.","ok":false,"why":"The 'aan'-phrase is fronted instead of trailing after the direct object."}]},{"k":"mc","sub":"D","prompt":"\"I'm sending it to her tomorrow.\"","opts":[{"t":"Ik stuur het haar morgen.","ok":true,"why":"Correct — pronoun pair (het haar) clusters right after the verb, before the time adverb 'morgen'."},{"t":"Ik stuur haar het morgen.","ok":false,"why":"Reverses the pronoun-pair order."},{"t":"Ik stuur morgen het haar.","ok":false,"why":"The adverb 'morgen' shouldn't wedge in between the verb and the pronoun pair."}]},{"k":"mc","sub":"D","prompt":"\"We don't believe in it.\" (the plan)","opts":[{"t":"We geloven er niet in.","ok":true,"why":"Correct — negation splits the fused word: 'er' fronts before 'niet', which precedes 'in'."},{"t":"We geloven niet erin.","ok":false,"why":"Once negated, 'er' should move ahead of 'niet' rat
