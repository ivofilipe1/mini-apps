her than staying fused after it."},{"t":"We geloven in er niet.","ok":false,"why":"Breaks the fused/split pattern entirely and misorders the preposition."}]},{"k":"mc","sub":"D","prompt":"\"I'm counting on it.\" (the bonus)","opts":[{"t":"Ik reken erop.","ok":true,"why":"Correct — 'op' fuses with 'er' for a non-human referent."},{"t":"Ik reken op er.","ok":false,"why":"Reverses and unfuses 'er' and the preposition."},{"t":"Ik erop reken.","ok":false,"why":"Breaks V2 — 'erop' can't sit in front of the finite verb like this."}]},{"k":"mc","sub":"D","prompt":"\"He washes himself every morning.\"","opts":[{"t":"Hij wast zich elke ochtend.","ok":true,"why":"Correct — 'zich' sits right after the verb, before the time adverb."},{"t":"Hij wast elke ochtend zich.","ok":false,"why":"The reflexive 'zich' should front right after the verb, not trail after the adverb."},{"t":"Hij zich wast elke ochtend.","ok":false,"why":"Breaks V2 — the finite verb 'wast' must be second, not 'zich'."}]},{"k":"mc","sub":"D","prompt":"\"He's coming later, because he made a mistake.\"","opts":[{"t":"Hij komt later, omdat hij zich vergist heeft.","ok":true,"why":"Correct — 'zich' sits right after the subject 'hij' in the subordinate clause, and the verb cluster 'vergist heeft' ends it."},{"t":"Hij komt later, omdat hij vergist zich heeft.","ok":false,"why":"'zich' is out of position — it should sit right after the subject, not after the participle."},{"t":"Hij komt later, omdat hij heeft zich vergist.","ok":false,"why":"Breaks the verb-final rule for subordinate clauses — 'heeft' shouldn't sit mid-clause."}]},{"k":"mc","sub":"D","prompt":"\"I haven't read that book.\"","opts":[{"t":"Ik heb dat boek niet gelezen.","ok":true,"why":"Correct — 'niet' follows the definite direct object 'dat boek', precedes the participle."},{"t":"Ik heb niet dat boek gelezen.","ok":false,"why":"'niet' should follow the definite direct object, not precede it."},{"t":"Ik heb dat boek gelezen niet.","ok":false,"why":"'niet' must come before the past participle, not after it."}]},{"k":"mc","sub":"D","prompt":"\"I'm not calling him back.\"","opts":[{"t":"Ik bel hem niet terug.","ok":true,"why":"Correct — the light pronoun 'hem' precedes 'niet', which precedes the separable prefix 'terug'."},{"t":"Ik bel niet hem terug.","ok":false,"why":"The light pronoun 'hem' should come before 'niet', not after it."},{"t":"Ik bel hem terug niet.","ok":false,"why":"'niet' must precede the separable prefix, not follow it."}]},{"k":"mc","sub":"D","prompt":"\"I'm not giving it to her.\"","opts":[{"t":"Ik geef het haar niet.","ok":true,"why":"Correct — pronoun pair (het haar) stays together, 'niet' trails at the very end."},{"t":"Ik geef haar het niet.","ok":false,"why":"Reverses the pronoun-pair order."},{"t":"Ik geef het niet haar.","ok":false,"why":"'niet' splits the pronoun pair, which should stay together first."}]},{"k":"mc","sub":"D","prompt":"\"He's not thinking about it.\"","opts":[{"t":"Hij denkt er niet aan.","ok":true,"why":"Correct — 'er' fronts before 'niet', which precedes 'aan', splitting the fused form."},{"t":"Hij denkt niet eraan.","ok":false,"why":"'er' should front ahead of 'niet' rather than staying fused after it, the same way any light pronoun would."},{"t":"Hij er denkt niet aan.","ok":false,"why":"Breaks V2 — 'er' can't sit in front of the finite verb without inversion."}]},{"k":"tr","prompt":"Translate: \"I give the children the presents.\"","ans":["ik geef de kinderen de cadeaus","ik geef de cadeaus aan de kinderen"],"why":"Both orders are natural: indirect-then-direct (bare nouns), or direct-then-'aan'-phrase."},{"k":"tr","prompt":"Translate: \"I'm giving it to him.\"","ans":["ik geef het hem","ik geef het aan hem"],"why":"Both the bare pronoun pair and the 'aan'-phrase with a pronoun are natural, especially in speech."},{"k":"tr","prompt":"Translate: \"I love it.\" (the city, not a person)","ans":["ik hou ervan","ik houd ervan"],"why":"'hou'/'houd' are both accepted spoken/written variants of 'houden' in the ik-form."},{"k":"tr","prompt":"Translate: \"We're not thinking about it.\"","ans":["we denken er niet aan"],"why":"Negation splits the fused form: 'er' fronts, 'niet' follows it, 'aan' ends the clause."},{"k":"tr","prompt":"Translate: \"I wash myself every morning.\"","ans":["ik was me elke ochtend","ik was mij elke ochtend"],"why":"'me' is the everyday unstressed form; 'mij' is an accepted stressed/formal variant."},{"k":"tr","prompt":"Translate: \"She often makes mistakes.\"","ans":["zij vergist zich vaak","ze vergist zich vaak"],"why":"'zij'/'ze' are both accepted forms of the third-person-singular subject pronoun here."},{"k":"tr","prompt":"Translate: \"The book is not difficult.\"","ans":["het boek is niet moeilijk"],"why":"'niet' precedes the predicate adjective 'moeilijk'."},{"k":"tr","prompt":"Translate: \"I'm not calling you back.\"","ans":["ik bel je niet terug"],"why":"'niet' precedes the separable prefix 'terug', after the light pronoun 'je'."},{"k":"tr","prompt":"Translate: \"He doesn't live in Utrecht.\"","ans":["hij woont niet in utrecht"],"why":"'niet' precedes the prepositional phrase 'in Utrecht'."},{"k":"tr","prompt":"Translate: \"I'm not giving him the keys.\"","ans":["ik geef hem de sleutels niet"],"why":"Indirect-object pronoun (hem) fronts before the direct noun (de sleutels); 'niet' follows the definite direct object at the end."},{"k":"match","prompt":"Match the reflexive verb to its English meaning.","L":[{"key":"1","t":"zich vergissen","say":"zich vergissen"},{"key":"2","t":"zich herinneren","say":"zich herinneren"},{"key":"3","t":"zich wassen","say":"zich wassen"},{"key":"4","t":"zich voelen","say":"zich voelen"},{"key":"5","t":"zich afvragen","say":"zich afvragen"}],"R":[{"key":"4","t":"to feel","say":""},{"key":"1","t":"to be mistaken","say":""},{"key":"5","t":"to wonder","say":""},{"key":"2","t":"to remember","say":""},{"key":"3","t":"to wash oneself","say":""}]},{"k":"match","prompt":"Match the \"er\"-word to what it's standing in for.","L":[{"key":"1","t":"ervan","say":"ervan"},{"key":"2","t":"ermee","say":"ermee"},{"key":"3","t":"erover","say":"erover"},{"key":"4","t":"erin","say":"erin"},{"key":"5","t":"erop","say":"erop"}],"R":[{"key":"3","t":"talking about it","say":""},{"key":"5","t":"counting on it","say":""},{"key":"1","t":"in love with it","say":""},{"key":"4","t":"believing in it","say":""},{"key":"2","t":"happy with it","say":""}]}]},{"id":"feelings","group":"Words and sound","name":"Feelings","title":"The Words for What You Actually Feel","rule":"<h2>The reference: three clusters of words<\/h2><p>Not a grammar rule this time — a curated set to actually learn. Each word has its plain meaning and a short phrase showing how it's normally used.<\/p><h3>Core emotions<\/h3><table>\n<tr><th>Dutch<\/th><th>English<\/th><th>Example phrase<\/th><\/tr>\n<tr><td><span class=\"nl\">blij<\/span><\/td><td>happy, glad<\/td><td>Ik ben heel blij met jou.<\/td><\/tr>\n<tr><td><span class=\"nl\">verdrietig<\/span><\/td><td>sad<\/td><td>Ze werd verdrietig van het nieuws.<\/td><\/tr>\n<tr><td><span class=\"nl\">boos<\/span><\/td><td>angry<\/td><td>Hij is boos op zichzelf.<\/td><\/tr>\n<tr><td><span class=\"nl\">teleurgesteld<\/span><\/td><td>disappointed<\/td><td>Ik was teleurgesteld in mezelf.<\/td><\/tr>\n<tr><td><span class=\"nl\">opgelucht<\/span><\/td><td>relieved<\/td><td>We waren opgelucht na het gesprek.<\/td><\/tr>\n<tr><td><span class=\"nl\">trots<\/span><\/td><td>proud<\/td><td>Ik ben trots op je.<\/td><\/tr>\n<tr><td><span class=\"nl\">jaloers<\/span><\/td><td>jealous<\/td><td>Een beetje jaloers, dat mag toch?<\/td><\/tr>\n<tr><td><span class=\"nl\">dankbaar<\/span><\/td><td>grateful<\/td><td>Dankbaar voor wat we hebben.<\/td><\/tr>\n<tr><td><span class=\"nl\">onzeker<\/span><\/td><td>insecure, unsure<\/td><td>Onzeker over de toekomst.<\/td><\/tr>\n<tr><td><span class=\"nl\">overweldigd<\/span><\/td><td>overwhelmed<\/td><td>Overweldigd door alles tegelijk.<\/td><\/tr>\n<tr><td><span class=\"nl\">ontroerd<\/span><\/td><td>moved, touched<\/td><td>Diep ontroerd door je woorden.<\/td><\/tr>\n<tr><td><span class=\"nl\">verlegen<\/span><\/td><td>shy<\/td><td>Verlegen bij nieuwe mensen.<\/td><\/tr>\n<\/table><h3>Relationship &amp; connection abstractions<\/h3><table>\n<tr><th>Dutch<\/th><th>English<\/th><th>Example phrase<\/th><\/tr>\n<tr><td><span class=\"nl\">vertrouwen<\/span><\/td><td>trust<\/td><td>Vertrouwen groeit langzaam.<\/td><\/tr>\n<tr><td><span class=\"nl\">verbondenheid<\/span><\/td><td>connectedness, bond<\/td><td>Een gevoel van verbondenheid. <em>(Related: verbonden — connected, adj. \"Ik voel me verbonden met jou.\")<\/em><\/td><\/tr>\n<tr><td><span class=\"nl\">begrip<\/span><\/td><td>understanding<\/td><td>Begrip tonen zonder oordelen.<\/td><\/tr>\n<tr><td><span class=\"nl\">waardering<\/span><\/td><td>appreciation<\/td><td>Waardering uitspreken helpt.<\/td><\/tr>\n<tr><td><span class=\"nl\">verwachting<\/span><\/td><td>expectation<\/td><td>Geen te hoge verwachtingen.<\/td><\/tr>\n<tr><td><span class=\"nl\">twijfel<\/span><\/td><td>doubt<\/td><td>Twijfel hoort erbij.<\/td><\/tr>\n<tr><td><span class=\"nl\">behoefte<\/span><\/td><td>need<\/td><td>Behoefte aan nabijheid.<\/td><\/tr>\n<tr><td><span class=\"nl\">nabijheid<\/span><\/td><td>closeness<\/td><td>Nabijheid zonder woorden.<\/td><\/tr>\n<tr><td><span class=\"nl\">kwetsbaarheid<\/span><\/td><td>vulnerability<\/td><td>Kwetsbaarheid durven tonen. <em>(Related: kwetsbaar — vulnerable, adj. \"Ik voel me kwetsbaar.\")<\/em><\/td><\/tr>\n<tr><td><span class=\"nl\">liefde<\/span><\/td><td>love<\/td><td>Liefde die blijft groeien.<\/td><\/tr>\n<tr><td><span class=\"nl\">verlangen<\/span><\/td><td>longing<\/td><td>Verlangen naar meer tijd samen.<\/td><\/tr>\n<tr><td><span class=\"nl\">gemis<\/span><\/td><td>the felt absence of someone/something<\/td><td>Een groot gemis. <em>(Related: iemand missen — to miss someone. \"Ik mis je.\")<\/em><\/td><\/tr>\n<tr><td><span class=\"nl\">geborgenheid<\/span><\/td><td>a felt sense of safety &amp; warmth<\/td><td>Geborgenheid voelen samen.<\/td><\/tr>\n<\/table><h3>Intensity &amp; hedging modifiers<\/h3><p>These don't show up on a \"top 100 words\" list, but they're what make emotional Dutch sound like a person talking instead of a form being filled in.<\/p><table>\n<tr><th>Dutch<\/th><th>English<\/th><th>Example phrase<\/th><\/tr>\n<tr><td><span class=\"nl\">eigenlijk<\/span><\/td><td>actually<\/td><td>Eigenlijk vind ik dat wel lastig.<\/td><\/tr>\n<tr><td><span class=\"nl\">best wel<\/span><\/td><td>actually quite, rather<\/td><td>Dat was best wel moeilijk.<\/td><\/tr>\n<tr><td><span class=\"nl\">een beetje<\/span><\/td><td>a little<\/td><td>Een beetje moe, niet erg.<\/td><\/tr>\n<tr><td><span class=\"nl\">nogal<\/span><\/td><td>rather, quite (more than expected)<\/td><td>Nogal veel, vond ik.<\/td><\/tr>\n<tr><td><span class=\"nl\">behoorlijk<\/span><\/td><td>fairly, considerably<\/td><td>Behoorlijk zenuwachtig, eerlijk gezegd.<\/td><\/tr>\n<tr><td><span class=\"nl\">ontzettend<\/span><\/td><td>incredibly, terribly<\/td><td>Ontzettend blij met dit nieuws.<\/td><\/tr>\n<tr><td><span class=\"nl\">een tikkeltje<\/span><\/td><td>a touch, a tad<\/td><td>Een tikkeltje overdreven, misschien.<\/td><\/tr>\n<\/table><blockquote class=\"example\">\n<span class=\"nl\">Ik ben eigenlijk best wel jaloers geweest, ik zei het gewoon niet.<\/span><br><\/br>\n<span class=\"gloss\">I am actually quite jealous been, I said it just not. → \"I was actually pretty jealous, I just didn't say it.\"<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Ik heb behoefte aan meer nabijheid, niet minder.<\/span><br><\/br>\n<span class=\"gloss\">I have need for more closeness, not less. → \"I need more closeness, not less.\"<\/span>\n<\/blockquote><div class=\"callout\">\n<strong>Flat vs. real:<\/strong> a bare emotion word — <code>Ik ben boos<\/code> — reads like a verdict. Add one hedge and it sounds like a person talking: <code>Ik ben eigenlijk best wel boos<\/code>. Rules of thumb: use <strong>one<\/strong> hedge, not two — <code>ontzettend een beetje<\/code> is a contradiction (extremely + a little), not extra emphasis. And <code>eigenlijk<\/code> almost always sits near the front of the sentence, framing the confession — it doesn't work bolted onto the end.\n<\/div>","items":[{"k":"mc","sub":"A","prompt":"\"I'm really grateful that you listened to me.\"","opts":[{"t":"Ik ben ontzettend dankbaar dat je naar me luisterde.","ok":true,"why":"Correct — dankbaar (grateful) matches the context."},{"t":"Ik ben ontzettend jaloers dat je naar me luisterde.","ok":false,"why":"Jaloers means jealous — being listened to isn't a trigger for jealousy."},{"t":"Ik ben ontzettend verlegen dat je naar me luisterde.","ok":false,"why":"Verlegen means shy — it describes a trait in company, not a reaction to being listened to."}]},{"k":"mc","sub":"A","prompt":"\"She felt a little overwhelmed after the move.\"","opts":[{"t":"Ze voelde zich een beetje overweldigd na de verhuizing.","ok":true,"why":"Correct — overweldigd (overwhelmed) fits too much happening at once."},{"t":"Ze voelde zich een beetje jaloers na de verhuizing.","ok":false,"why":"Jaloers means jealous — nothing in the context points to envy."},{"t":"Ze voelde zich een beetje opgelucht na de verhuizing.","ok":false,"why":"Opgelucht means relieved — the opposite feel from being overwhelmed."}]},{"k":"mc","sub":"A","prompt":"\"Trust is the most important thing in our relationship.\"","opts":[{"t":"Vertrouwen is het belangrijkste in onze relatie.","ok":true,"why":"Correct — vertrouwen (trust) is the word the sentence is actually about."},{"t":"Verwachting is het belangrijkste in onze relatie.","ok":false,"why":"Verwachting means expectation — a different, more one-sided concept than trust."},{"t":"Twijfel is het belangrijkste in onze relatie.","ok":false,"why":"Twijfel means doubt — calling doubt 'the most important thing' contradicts the point being made."}]},{"k":"mc","sub":"A","prompt":"\"He seemed proud of his daughter.\"","opts":[{"t":"Hij leek trots op zijn dochter.","ok":true,"why":"Correct — trots op (proud of) is the right word and the right preposition."},{"t":"Hij leek boos op zijn dochter.","ok":false,"why":"Boos op means angry at — same preposition, wrong emotion for the context."},{"t":"Hij leek jaloers op zijn dochter.","ok":false,"why":"Jaloers op means jealous of — grammatically fine, but an odd fit for a parent describing a daughter."}]},{"k":"mc","sub":"A","prompt":"\"I feel a little insecure about this decision.\"","opts":[{"t":"Ik voel me een beetje onzeker over deze beslissing.","ok":true,"why":"Correct — onzeker (insecure, unsure) is exactly this feeling."},{"t":"Ik voel me een beetje jaloers over deze beslissing.","ok":false,"why":"Jaloers means jealous — there's no rival or comparison in the sentence."},{"t":"Ik voel me een beetje opgelucht over deze beslissing.","ok":false,"why":"Opgelucht means relieved — a settled feeling, not an unsettled one."}]},{"k":"mc","sub":"A","prompt":"\"There's a real sense of closeness between them now.\"","opts":[{"t":"Er is nu echt sprake van nabijheid tussen hen.","ok":true,"why":"Correct — nabijheid (closeness) is the concept being described."},{"t":"Er is nu echt sprake van twijfel tussen hen.","ok":false,"why":"Twijfel means doubt — the opposite of the settled closeness the sentence describes."},{"t":"Er is nu echt sprake van verwachting tussen hen.","ok":false,"why":"Verwachting means expectation — about the future, not the current state between them."}]},{"k":"mc","sub":"A","prompt":"\"He was moved to tears by the speech.\"","opts":[{"t":"Hij was ontroerd door de toespraak.","ok":true,"why":"Correct — ontroerd (moved, touched) is precisely this reaction."},{"t":"Hij was overweldigd door de toespraak.","ok":false,"why":"Overweldigd means overwhelmed — closer to too-much-at-once than to being moved emotionally."},{"t":"Hij was teleurgesteld door de toespraak.","ok":false,"why":"Teleurgesteld means disappointed — the opposite reaction from being moved to tears."}]},{"k":"mc","sub":"A","prompt":"\"Doubt crept in after the argument.\"","opts":[{"t":"Twijfel kwam op na de ruzie.","ok":true,"why":"Correct — twijfel (doubt) is what the sentence describes."},{"t":"Waardering kwam op na de ruzie.","ok":false,"why":"Waardering means appreciation — an unlikely thing to surface right after a fight."},{"t":"Begrip kwam op na de ruzie.","ok":false,"why":"Begrip means understanding — possible eventually, but not what 'crept in' after an argument implies."}]},{"k":"mc","sub":"A","prompt":"\"Actually, I was quite jealous, I just didn't want to admit it.\"","opts":[{"t":"Eigenlijk was ik best wel jaloers, ik wilde het alleen niet toegeven.","ok":true,"why":"Correct — jaloers (jealous) is the feeling people typically keep quiet about, which matches 'didn't want to admit it'."},{"t":"Eigenlijk was ik best wel dankbaar, ik wilde het alleen niet toegeven.","ok":false,"why":"Dankbaar means grateful — not a feeling people usually hide or need to 'admit'."},{"t":"Eigenlijk was ik best wel trots, ik wilde het alleen niet toegeven.","ok":false,"why":"Trots means proud — like gratitude, not typically something kept secret."}]},{"k":"mc","sub":"A","prompt":"\"Vulnerability isn't always easy, but it's part of a relationship.\"","opts":[{"t":"Kwetsbaarheid voelt niet altijd makkelijk, maar het hoort bij een relatie.","ok":true,"why":"Correct — kwetsbaarheid (vulnerability) is the concept the sentence is about."},{"t":"Waardering voelt niet altijd makkelijk, maar het hoort bij een relatie.","ok":false,"why":"Waardering means appreciation — not something that's typically described as 'not always easy'."},{"t":"Verwachting voelt niet altijd makkelijk, maar het hoort bij een relatie.","ok":false,"why":"Verwachting means expectation — a mismatch for a sentence about something hard to sit with."}]},{"k":"fill","prompt":"Ik ben heel ___ dat je dit voor me deed.","gloss":"(I'm very grateful that you did this for me)","ans":["dankbaar"],"why":"Dankbaar = grateful — fits 'that you did this for me'."},{"k":"fill","prompt":"Ze voelt zich vaak ___ als ze met vreemden moet praten.","gloss":"(She often feels shy when she has to talk to strangers)","ans":["verlegen"],"why":"Verlegen = shy — the feeling around talking to strangers."},{"k":"fill","prompt":"Hij was ___ toen hij zijn diploma kreeg.","gloss":"(He was proud when he got his diploma)","ans":["trots"],"why":"Trots = proud — the natural reaction to getting a diploma."},{"k":"fill","prompt":"Ik voel me een beetje ___ over de toekomst.","gloss":"(I feel a little insecure about the future)","ans":["onzeker"],"why":"Onzeker = insecure/unsure — matches 'about the future'."},{"k":"fill","prompt":"We waren enorm ___ toen de test negatief was.","gloss":"(We were hugely relieved when the test was negative)","ans":["opgelucht"],"why":"Opgelucht = relieved — the reaction to a negative (i.e. good) test result."},{"k":"fill","prompt":"Zonder ___ kan een relatie niet groeien.","gloss":"(Without trust a relationship can't grow)","ans":["vertrouwen"],"why":"Vertrouwen = trust — what a relationship needs in order to grow."},{"k":"fill","prompt":"Ik heb ___ nodig, niet alleen woorden.","gloss":"(I need closeness, not just words)","ans":["nabijheid"],"why":"Nabijheid = closeness — contrasted here with 'just words'."},{"k":"fill","prompt":"Haar ___ voor wat je deed is oprecht.","gloss":"(Her appreciation for what you did is sincere)","ans":["waardering"],"why":"Waardering = appreciation — takes the preposition 'voor' (for)."},{"k":"fill","prompt":"Hij voelde een groot ___ nu zijn kinderen ver weg wonen.","gloss":"(He felt a great sense of missing them, now that his children live far away)","ans":["gemis"],"why":"Gemis = the felt absence of someone — 'een groot gemis' (a great sense of missing them)."},{"k":"fill","prompt":"Het was maar ___ pijnlijk, niet heel erg.","gloss":"(It was only a little painful, not very)","ans":["een beetje"],"why":"Een beetje = a little — softens 'pijnlijk' (painful) down from 'heel erg' (very much)."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik ben blij dat je er bent.","ok":false,"why":"Correct — blij (happy) fits being glad someone is there."},{"t":"Hij is boos omdat de trein te laat is.","ok":false,"why":"Correct — boos (angry) fits being annoyed at a late train."},{"t":"Ze is dankbaar omdat ze het cadeau niet leuk vond.","ok":true,"why":"This is the error — dankbaar (grateful) doesn't fit disliking a gift; that calls for teleurgesteld (disappointed)."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hij voelde zich verlegen tijdens het gesprek.","ok":false,"why":"Correct — verlegen (shy) fits a conversation with someone unfamiliar."},{"t":"Zij was ontzettend trots op haar werk.","ok":false,"why":"Correct — trots (proud) fits being proud of your own work."},{"t":"Wij waren erg opgelucht toen we het slechte nieuws hoorden.","ok":true,"why":"This is the error — opgelucht (relieved) doesn't fit hearing bad news; relief follows good news or resolved worry, not slecht nieuws."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Twijfel hoort bij elke grote beslissing.","ok":false,"why":"Correct — twijfel (doubt) belonging to a big decision is a very ordinary claim."},{"t":"Begrip groeit als je echt naar elkaar luistert.","ok":false,"why":"Correct — begrip (understanding) growing from real listening makes sense."},{"t":"Gemis groeit als je echt naar elkaar luistert.","ok":true,"why":"This is the error — gemis (the felt absence of someone) doesn't grow from listening to each other; that's begrip, not gemis."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Liefde groeit soms juist in moeilijke tijden.","ok":false,"why":"Correct — liefde (love) growing in hard times is a common, true observation."},{"t":"Verlangen voelt heel anders van dichtbij dan van ver weg.","ok":false,"why":"Correct — verlangen (longing) genuinely does feel different depending on distance."},{"t":"Geborgenheid voelt het sterkst als je helemaal alleen bent.","ok":true,"why":"This is the error — geborgenheid (a felt sense of safety and warmth) is almost always tied to being with someone or somewhere safe, not to being completely alone."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Behoefte aan nabijheid is heel normaal in een relatie.","ok":false,"why":"Correct — behoefte aan nabijheid (need for closeness) is a normal, healthy claim."},{"t":"Kwetsbaarheid delen kan een relatie sterker maken.","ok":false,"why":"Correct — sharing kwetsbaarheid (vulnerability) genuinely can strengthen a relationship."},{"t":"Waardering delen kan een relatie zomaar kapotmaken.","ok":true,"why":"This is the error — waardering (appreciation) is something that strengthens closeness, not something that 'kapotmaken' (destroys) a relationship."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ze was zo trots op haar broer tijdens de wedstrijd.","ok":false,"why":"Correct — trots (proud) fits being proud of a sibling at a competition."},{"t":"Hij werd boos toen zijn trein negen minuten vertraagd was.","ok":false,"why":"Correct — boos (angry) is a normal, mundane reaction to a delayed train."},{"t":"Ze was diep ontroerd toen ze haar sleutels niet kon vinden.","ok":true,"why":"This is the error — ontroerd (moved to tears) describes an emotionally touching moment, not the mundane frustration of losing your keys."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hij is jaloers op zijn collega's succes.","ok":false,"why":"Correct — jaloers op (jealous of) fits envying a colleague's success."},{"t":"Ik ben teleurgesteld dat het feest is afgelast.","ok":false,"why":"Correct — teleurgesteld (disappointed) is the natural reaction to a cancelled party."},{"t":"Ik ben overweldigd dat het feest is afgelast.","ok":true,"why":"This is the error — overweldigd (overwhelmed) fits too much happening at once, not a single cancelled event; that's teleurgesteld."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik ben eigenlijk best wel verdrietig, maar ik lach heel veel.","ok":false,"why":"Correct — eigenlijk best wel (actually quite) is a natural single hedge on verdrietig."},{"t":"Hij is nogal onzeker over zijn Nederlands, hoewel hij het al jaren spreekt.","ok":false,"why":"Correct — nogal (rather) is a natural single hedge on onzeker, and the hoewel-clause keeps its verb at the end correctly."},{"t":"Ze is ontzettend een beetje trots op haar diploma.","ok":true,"why":"This is the error — ontzettend (extremely) and een beetje (a little) contradict each other. Use one hedge, not two."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zijn behoefte aan begrip werd eindelijk gehoord.","ok":false,"why":"Correct — behoefte aan begrip (need for understanding) finally being heard makes sense."},{"t":"Haar verwachting van de reis was heel hoog.","ok":false,"why":"Correct — verwachting (expectation) can reasonably be described as 'heel hoog' (very high) before a trip."},{"t":"Haar gemis van de reis was heel hoog.","ok":true,"why":"This is the error — gemis (the felt absence of something already gone) doesn't fit anticipating a future trip; that's verwachting, not gemis."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik voel geborgenheid als we samen op de bank zitten.","ok":false,"why":"Correct — geborgenheid (a felt sense of safety and warmth) fits sitting together on the couch."},{"t":"Verbondenheid groeide toen we samen die moeilijke tijd doorstonden.","ok":false,"why":"Correct — verbondenheid (connectedness) growing from getting through something hard together makes sense."},{"t":"Verbondenheid voelde ik het sterkst toen we allebei niets tegen elkaar zeiden en boos wegliepen.","ok":true,"why":"This is the error — verbondenheid (a felt bond) doesn't describe an angry silent walkout; that moment calls for afstand (distance) or twijfel, not verbondenheid."}]},{"k":"mc","sub":"D","prompt":"\"Because I trust you, I'm telling you this.\"","opts":[{"t":"Omdat ik je vertrouw, vertel ik je dit.","ok":true,"why":"Correct — 'vertrouw' ends the omdat-clause with object before verb, and the main clause inverts correctly."},{"t":"Omdat ik je vertrouw, ik vertel je dit.","ok":false,"why":"The main clause isn't inverted — it should be 'vertel ik', not 'ik vertel'."},{"t":"Omdat je ik vertrouw, vertel ik je dit.","ok":false,"why":"Subject and object are swapped inside the omdat-clause — it should be 'ik je vertrouw', not 'je ik vertrouw'."}]},{"k":"mc","sub":"D","prompt":"\"I need more closeness, not less.\"","opts":[{"t":"Ik heb behoefte aan meer nabijheid, niet minder.","ok":true,"why":"Correct — 'behoefte aan' stays together as a fixed pair, and 'meer ... niet minder' matches the meaning."},{"t":"Ik heb aan behoefte meer nabijheid, niet minder.","ok":false,"why":"Breaks the fixed pairing 'behoefte aan' by inserting 'aan' before 'behoefte' instead of after it."},{"t":"Ik heb behoefte aan minder nabijheid, niet meer.","ok":false,"why":"Grammatically fine, but 'meer'/'minder' are swapped — this says the opposite: less closeness, not more."}]},{"k":"mc","sub":"D","prompt":"\"Even though I'm insecure about this, I'm going to tell you the truth.\"","opts":[{"t":"Hoewel ik hierover onzeker ben, ga ik je de waarheid vertellen.","ok":true,"why":"Correct — 'onzeker' fits the meaning, the hoewel-clause ends in 'ben', and the main clause inverts."},{"t":"Hoewel ik hierover jaloers ben, ga ik je de waarheid vertellen.","ok":false,"why":"Wrong word — jaloers means jealous, which changes the meaning to 'even though I'm jealous about this'."},{"t":"Hoewel ik hierover onzeker ben, ik ga je de waarheid vertellen.","ok":false,"why":"The main clause isn't inverted — it should be 'ga ik', not 'ik ga'."}]},{"k":"mc","sub":"D","prompt":"\"I was so relieved that I started crying.\"","opts":[{"t":"Ik was zo opgelucht dat ik begon te huilen.","ok":true,"why":"Correct — 'opgelucht' fits, and 'ik begon' correctly ends the dat-clause."},{"t":"Ik was zo jaloers dat ik begon te huilen.","ok":false,"why":"Wrong word — jaloers means jealous, not relieved."},{"t":"Ik was zo opgelucht dat begon ik te huilen.","ok":false,"why":"The dat-clause keeps V2 order here instead of sending the verb to the end — should be 'dat ik begon', not 'dat begon ik'."}]},{"k":"mc","sub":"D","prompt":"\"Trust grows slowly, but breaks quickly.\"","opts":[{"t":"Vertrouwen groeit langzaam, maar breekt snel.","ok":true,"why":"Correct — 'vertrouwen' fits, and both verbs stay in position 2 after their subject/adverb."},{"t":"Twijfel groeit langzaam, maar breekt snel.","ok":false,"why":"Wrong word — twijfel means doubt, which reverses the point being made."},{"t":"Vertrouwen langzaam groeit, maar snel breekt.","ok":false,"why":"V2 is broken — with 'vertrouwen' already in position 1, the verb 'groeit' must be position 2, not pushed after 'langzaam'."}]},{"k":"mc","sub":"D","prompt":"\"Although she doubts herself, she keeps trying.\"","opts":[{"t":"Hoewel ze aan zichzelf twijfelt, blijft ze het proberen.","ok":true,"why":"Correct — 'twijfelt' ends the hoewel-clause, with 'aan zichzelf' correctly ordered before it."},{"t":"Hoewel ze aan zichzelf twijfelt, ze blijft het proberen.","ok":false,"why":"The main clause isn't inverted — it should be 'blijft ze', not 'ze blijft'."},{"t":"Hoewel zichzelf aan ze twijfelt, blijft ze het proberen.","ok":false,"why":"Word order inside the hoewel-clause is scrambled — 'zichzelf' and 'ze' are swapped."}]},{"k":"mc","sub":"D","prompt":"\"There's a strong connectedness between us since that conversation.\"","opts":[{"t":"Er is een sterke verbondenheid tussen ons sinds dat gesprek.","ok":true,"why":"Correct — 'verbondenheid' fits, and 'tussen ons' stays together as a unit."},{"t":"Er is een sterke verbondenheid ons sinds dat gesprek tussen.","ok":false,"why":"The prepositional phrase 'tussen ons' is broken apart — 'tussen' has drifted to the end, away from 'ons'."},{"t":"Er is een sterke twijfel tussen ons sinds dat gesprek.","ok":false,"why":"Wrong word — twijfel means doubt, which doesn't fit 'strong' and a positive shared moment."}]},{"k":"mc","sub":"D","prompt":"\"Even though I'm a little jealous, I'm happy for you.\"","opts":[{"t":"Hoewel ik een beetje jaloers ben, ben ik blij voor jou.","ok":true,"why":"Correct — 'jaloers' fits, 'ben' ends the hoewel-clause, and the main clause inverts."},{"t":"Hoewel ik een beetje jaloers ben, ik ben blij voor jou.","ok":false,"why":"The main clause isn't inverted — it should be 'ben ik', not 'ik ben'."},{"t":"Hoewel ik ben een beetje jaloers, ben ik blij voor jou.","ok":false,"why":"The verb 'ben' sits mid-clause instead of ending the hoewel-clause."}]},{"k":"mc","sub":"D","prompt":"\"My need for understanding was bigger than my need for answers.\"","opts":[{"t":"Mijn behoefte aan begrip was groter dan mijn behoefte aan antwoorden.","ok":true,"why":"Correct — 'behoefte aan' stays intact both times, with 'begrip' and 'antwoorden' as its objects."},{"t":"Mijn begrip aan behoefte was groter dan mijn begrip aan antwoorden.","ok":false,"why":"'Behoefte' and 'begrip' are swapped, scrambling the fixed pairing 'behoefte aan begrip'."},{"t":"Mijn behoefte aan waardering was groter dan mijn behoefte aan antwoorden.","ok":false,"why":"Wrong word — waardering means appreciation, not understanding."}]},{"k":"mc","sub":"D","prompt":"\"Because he felt overwhelmed, he asked for a break.\"","opts":[{"t":"Omdat hij zich overweldigd voelde, vroeg hij om een pauze.","ok":true,"why":"Correct — 'overweldigd' ends the omdat-clause, and the main clause inverts correctly."},{"t":"Omdat hij zich overweldigd voelde, hij vroeg om een pauze.","ok":false,"why":"The main clause isn't inverted — it should be 'vroeg hij', not 'hij vroeg'."},{"t":"Omdat hij zich opgelucht voelde, vroeg hij om een pauze.","ok":false,"why":"Wrong word — opgelucht means relieved, the opposite of overwhelmed."}]},{"k":"tr","prompt":"Translate: \"I'm actually quite disappointed.\"","ans":["ik ben eigenlijk best wel teleurgesteld","eigenlijk ben ik best wel teleurgesteld"],"why":"Both orders work — 'eigenlijk' can open the sentence or sit right after 'ik ben'; either way only one hedge is used."},{"k":"tr","prompt":"Translate: \"I need more closeness.\"","ans":["ik heb behoefte aan meer nabijheid","ik heb meer nabijheid nodig"],"why":"Both 'behoefte hebben aan iets' and 'iets nodig hebben' are natural ways to say you need something."},{"k":"tr","prompt":"Translate: \"Trust takes time.\"","ans":["vertrouwen kost tijd","vertrouwen vraagt tijd"],"why":"Both 'kost tijd' (costs time) and 'vraagt tijd' (asks/requires time) are standard ways to say something takes time."},{"k":"tr","prompt":"Translate: \"She's rather proud of that.\"","ans":["ze is nogal trots daarop","ze is daar nogal trots op"],"why":"'Trots zijn op iets' can stay together as 'trots daarop', or split as 'daar ... op' — both are natural."},{"k":"tr","prompt":"Translate: \"I feel a little vulnerable right now.\"","ans":["ik voel me nu een beetje kwetsbaar","nu voel ik me een beetje kwetsbaar"],"why":"'Kwetsbaar' is the adjective form of kwetsbaarheid — the natural way to describe how you feel. Fronting 'nu' also works with the verb inverting."},{"k":"tr","prompt":"Translate: \"He's incredibly grateful for your help.\"","ans":["hij is ontzettend dankbaar voor jouw hulp","hij is ontzettend dankbaar voor je hulp"],"why":"'Jouw' and 'je' both mean 'your' here — 'je' is the more casual everyday choice."},{"k":"tr","prompt":"Translate: \"There's still some doubt, but also a lot of love.\"","ans":["er is nog twijfel maar ook veel liefde","er is nog steeds twijfel maar ook veel liefde"],"why":"'Nog' and 'nog steeds' both mean 'still' here — 'nog steeds' is slightly more emphatic."},{"k":"tr","prompt":"Translate: \"I feel safe and warm when I'm with you.\"","ans":["ik voel geborgenheid als ik bij jou ben","bij jou voel ik geborgenheid"],"why":"Either the als-clause or fronting 'bij jou' (with the verb inverting) works naturally."},{"k":"tr","prompt":"Translate: \"Longing for someone is a strange feeling.\"","ans":["verlangen naar iemand is een vreemd gevoel"],"why":"'Verlangen naar iemand' is the fixed way to say longing for someone."},{"k":"tr","prompt":"Translate: \"I miss you more than I expected.\"","ans":["ik mis je meer dan ik had verwacht","ik mis je meer dan verwacht"],"why":"'Missen' (to miss) is the verb behind the noun gemis. The short elliptical form 'dan verwacht' (dropping 'ik had') is very common in spoken Dutch."},{"k":"match","prompt":"Match Dutch to English — core emotions.","L":[{"key":"1","t":"blij","say":"blij"},{"key":"2","t":"verdrietig","say":"verdrietig"},{"key":"3","t":"overweldigd","say":"overweldigd"},{"key":"4","t":"trots","say":"trots"},{"key":"5","t":"dankbaar","say":"dankbaar"}],"R":[{"key":"3","t":"overwhelmed","say":""},{"key":"5","t":"grateful","say":""},{"key":"1","t":"happy","say":""},{"key":"4","t":"proud","say":""},{"key":"2","t":"sad","say":""}]},{"k":"match","prompt":"Match Dutch to English — connection & intensity.","L":[{"key":"1","t":"waardering","say":"waardering"},{"key":"2","t":"behoorlijk","say":"behoorlijk"},{"key":"3","t":"een tikkeltje","say":"een tikkeltje"},{"key":"4","t":"kwetsbaarheid","say":"kwetsbaarheid"},{"key":"5","t":"geborgenheid","say":"geborgenheid"}],"R":[{"key":"4","t":"vulnerability","say":""},{"key":"1","t":"appreciation","say":""},{"key":"5","t":"safety & warmth","say":""},{"key":"2","t":"fairly, considerably","say":""},{"key":"3","t":"a touch, a tad","say":""}]}]},{"id":"speech","group":"Words and sound","name":"Connected speech","title":"Connected Speech: Why Native Dutch Sounds So Fast","rule":"<h2>The rule<\/h2><p>Casual Dutch doesn't distort content words much — nouns and verb stems mostly survive intact. It's the small grammatical glue words that get crushed, because they carry the least stress and the least information. Once you can recognize the handful of ways that happens, entire sentences stop sounding like a blur.<\/p><h3>1. The two smallest words shrink to a single sound<\/h3><p><code>het<\/code> and <code>een<\/code> are almost never stressed, so in speech and in informal writing they routinely reduce to <code>'t<\/code> and <code>'n<\/code>.<\/p><table>\n<tr><th>Written / formal<\/th><th>You'll hear<\/th><th>Meaning<\/th><\/tr>\n<tr><td><code>het is mooi<\/code><\/td><td>'t is mooi <button class=\"say\" data-say=\"'t is mooi\" aria-label=\"Hear it\"><\/button><\/td><td>it's nice<\/td><\/tr>\n<tr><td><code>een huis<\/code><\/td><td>'n huis <button class=\"say\" data-say=\"'n huis\" aria-label=\"Hear it\"><\/button><\/td><td>a house<\/td><\/tr>\n<\/table><h3>2. Verb + pronoun fuses into one syllable<\/h3><p>When <code>je<\/code> or <code>hij<\/code> lands right after a conjugated verb, the two words routinely fuse. <code>je<\/code> after <code>heb<\/code> gives the well-known <code>hebbie<\/code>. <code>hij<\/code> after almost any verb reduces to an unstressed <code>-ie<\/code>, glued onto the verb — most often written with a hyphen (<code>wordt-ie<\/code>, <code>komt-ie<\/code>, <code>heeft-ie<\/code>) or fused directly with no hyphen (<code>is<\/code> + <code>ie<\/code> → <code>isie<\/code>). There's no official spelling for any of this — it's a spoken form, so you'll see some variation in how people write it down.<\/p><table>\n<tr><th>Written / formal<\/th><th>You'll hear<\/th><th>Meaning<\/th><\/tr>\n<tr><td><code>heb je dat gezien?<\/code><\/td><td>hebbie dat gezien? <button class=\"say\" data-say=\"hebbie dat gezien?\" aria-label=\"Hear it\"><\/button><\/td><td>did you see that?<\/td><\/tr>\n<tr><td><code>is hij thuis?<\/code><\/td><td>isie thuis? <button class=\"say\" data-say=\"isie thuis?\" aria-label=\"Hear it\"><\/button><\/td><td>is he home?<\/td><\/tr>\n<tr><td><code>wordt hij boos?<\/code><\/td><td>wordt-ie boos? <button class=\"say\" data-say=\"wordt-ie boos?\" aria-label=\"Hear it\"><\/button><\/td><td>is he getting angry?<\/td><\/tr>\n<\/table><div class=\"callout\">\n<strong>Important limit:<\/strong> the reduced <code>-ie<\/code> only exists glued onto the verb that precedes it. <code>Hij<\/code> at the front of a sentence never shrinks — <code>Hij komt vanavond<\/code> stays <code>hij<\/code>, never <code>Ie komt vanavond<\/code>. And the <code>-bie<\/code> ending is specific to <code>heb je<\/code> — it doesn't generalize to other verbs (<code>doe je<\/code> doesn't become <code>doebie<\/code>).\n<\/div><h3>3. The wider clitic family<\/h3><p><code>hebbie<\/code> and <code>-ie<\/code> are the two your ear needs most urgently, but they belong to a small, closed family of reduced pronouns and possessives that all work the same way — unstressed, glued to a neighboring word, and standard in speech and informal writing (chat, subtitles, forum posts) even though grammar books print the full forms.<\/p><table>\n<tr><th>Full form<\/th><th>Reduced<\/th><th>Example (you'll hear)<\/th><\/tr>\n<tr><td><code>ik<\/code><\/td><td><code>'k<\/code><\/td><td>'k weet het niet <button class=\"say\" data-say=\"'k weet het niet\" aria-label=\"Hear it\"><\/button><\/td><\/tr>\n<tr><td><code>hem<\/code><\/td><td><code>'m<\/code><\/td><td>geef 'm het boek <button class=\"say\" data-say=\"geef 'm het boek\" aria-label=\"Hear it\"><\/button><\/td><\/tr>\n<tr><td><code>haar<\/code><\/td><td><code>d'r<\/code><\/td><td>ik zie d'r niet <button class=\"say\" data-say=\"ik zie d'r niet\" aria-label=\"Hear it\"><\/button><\/td><\/tr>\n<tr><td><code>zijn / mijn<\/code><\/td><td><code>z'n / m'n<\/code><\/td><td>z'n auto is mooi <button class=\"say\" data-say=\"z'n auto is mooi\" aria-label=\"Hear it\"><\/button><\/td><\/tr>\n<tr><td><code>dat is<\/code><\/td><td><code>da's<\/code><\/td><td>da's mooi, zeg! <button class=\"say\" data-say=\"da's mooi, zeg!\" aria-label=\"Hear it\"><\/button><\/td><\/tr>\n<tr><td><code>zo een<\/code><\/td><td><code>zo'n<\/code><\/td><td>zo'n huis wil ik ook <button class=\"say\" data-say=\"zo'n huis wil ik ook\" aria-label=\"Hear it\"><\/button><\/td><\/tr>\n<\/table><p><code>zo'n<\/code> only replaces <code>zo een<\/code> before a singular noun — the plural is <code>zulke<\/code> (<code>zo'n huis<\/code>, but <code>zulke huizen<\/code>, never <code>zo'n huizen<\/code>).<\/p><h3>4. The final -n disappears — but only in some places<\/h3><p>In infinitives and plurals ending in <code>-en<\/code> (<code>lopen<\/code>, <code>dagen<\/code>, <code>hebben<\/code>), the <code>n<\/code> sits after an unstressed schwa and is dropped in casual pronunciation across the western Netherlands and the Randstad: <code>lopen<\/code> is commonly heard as <code>lope<\/code>. This is a <strong>regional and register<\/strong> feature, not a universal rule: Flemish speech keeps the <code>-n<\/code> clearly, careful/formal registers (news broadcasts, teachers, the standard reference pronunciation) keep it too, and the spelling never changes regardless of how it's said out loud. The <code>n<\/code> is never dropped when it's part of the verb stem itself rather than that unstressed <code>-en<\/code> ending — <code>ik ken<\/code> (\"I know\") is always <code>ken<\/code>, never <code>ke<\/code>.<\/p><h3>5. It's not just individual words — it's speed<\/h3><p>Beyond the specific contractions above, casual Dutch runs faster overall because unstressed syllables shorten toward a neutral schwa, and neighboring sounds blend across word boundaries (a final consonant reshaping to match the sound that follows it). None of this changes what's grammatically there — every word from the textbook is technically still present — but acoustically, the low-information function words can compress to almost nothing between two content words that stay clear. That's the real source of \"it sounds too fast\": the content words are running at a normal pace: the glue between them has just gotten very short.<\/p><div class=\"callout\">\n<strong>The one habit that moves the needle fastest:<\/strong> stop listening for whole words and start listening for the handful of reduced forms above (<code>'t<\/code>, <code>'n<\/code>, <code>hebbie<\/code>, <code>-ie<\/code>, <code>'k<\/code>, <code>'m<\/code>, <code>d'r<\/code>, <code>z'n/m'n<\/code>, <code>da's<\/code>, <code>zo'n<\/code>). Nouns and verb stems will keep sounding roughly like themselves; it's these ten shapes that are actually swallowing whole words you already know. Once your ear auto-recognizes them, sentences stop needing to be slowed down.\n<\/div>","items":[{"k":"mc","sub":"hear","prompt":"You hear: \"Isie al thuis?\"","opts":[{"t":"Is hij al thuis?","ok":true,"why":"Correct — 'isie' is 'is hij' fused after the verb."},{"t":"Is zij al thuis?","ok":false,"why":"Wrong subject — 'isie' reduces 'hij', not 'zij'."},{"t":"Was hij al thuis?","ok":false,"why":"Wrong tense — 'isie' is present tense 'is', not past tense 'was'."}],"say":"Isie al thuis?"},{"k":"mc","sub":"hear","prompt":"You hear: \"Hebbie dat gezien?\"","opts":[{"t":"Heb je dat gezien?","ok":true,"why":"Correct — 'hebbie' is 'heb je' fused together."},{"t":"Heeft hij dat gezien?","ok":false,"why":"Wrong subject — 'hebbie' contains 'je', not 'hij'."},{"t":"Had je dat gezien?","ok":false,"why":"Wrong tense — 'hebbie' is present tense, not past tense 'had'."}],"say":"Hebbie dat gezien?"},{"k":"mc","sub":"hear","prompt":"You hear: \"Wordt-ie boos?\"","opts":[{"t":"Wordt hij boos?","ok":true,"why":"Correct — 'wordt-ie' is 'wordt hij' fused after the verb."},{"t":"Werd hij boos?","ok":false,"why":"Wrong tense — 'wordt-ie' is present tense, not past tense 'werd'."},{"t":"Wordt zij boos?","ok":false,"why":"Wrong subject — '-ie' reduces 'hij', not 'zij'."}],"say":"Wordt-ie boos?"},{"k":"mc","sub":"hear","prompt":"You hear: \"'k Weet het niet.\"","opts":[{"t":"Ik weet het niet.","ok":true,"why":"Correct — ''k' is the unstressed clitic form of 'ik'."},{"t":"Jij weet het niet.","ok":false,"why":"Wrong subject — ''k' reduces 'ik', not 'jij'."},{"t":"Ik wist het niet.","ok":false,"why":"Wrong tense — 'weet' is present tense, not past tense 'wist'."}],"say":"'k Weet het niet."},{"k":"mc","sub":"hear","prompt":"You hear: \"Geef 'm het boek.\"","opts":[{"t":"Geef hem het boek.","ok":true,"why":"Correct — ''m' is the unstressed clitic form of 'hem'."},{"t":"Geef haar het boek.","ok":false,"why":"Wrong pronoun — ''m' reduces 'hem', not 'haar'."},{"t":"Geef mij het boek.","ok":false,"why":"Wrong pronoun — ''m' reduces 'hem', not 'mij'."}],"say":"Geef 'm het boek."},{"k":"mc","sub":"hear","prompt":"You hear: \"Ik zie d'r niet.\"","opts":[{"t":"Ik zie haar niet.","ok":true,"why":"Correct — 'd'r' is the unstressed clitic form of 'haar'."},{"t":"Ik zie hen niet.","ok":false,"why":"Wrong pronoun — 'd'r' reduces 'haar', not 'hen'."},{"t":"Ik zie ze niet.","ok":false,"why":"Wrong pronoun — 'd'r' reduces 'haar', not 'ze'."}],"say":"Ik zie d'r niet."},{"k":"mc","sub":"hear","prompt":"You hear: \"Da's mooi, zeg!\"","opts":[{"t":"Dat is mooi, zeg!","ok":true,"why":"Correct — 'da's' is 'dat is' fused into one word."},{"t":"Dat was mooi, zeg!","ok":false,"why":"Wrong tense — 'da's' is present tense 'is', not past tense 'was'."},{"t":"Dit is mooi, zeg!","ok":false,"why":"Wrong demonstrative — 'da's' reduces 'dat is', not 'dit is'."}],"say":"Da's mooi, zeg!"},{"k":"mc","sub":"hear","prompt":"You hear: \"Is 't al laat?\"","opts":[{"t":"Is het al laat?","ok":true,"why":"Correct — ''t' is the unstressed clitic form of 'het'."},{"t":"Is er al laat?","ok":false,"why":"Wrong word — ''t' reduces 'het', not 'er'."},{"t":"Is dit al laat?","ok":false,"why":"Wrong word — ''t' reduces 'het', not 'dit'."}],"say":"Is 't al laat?"},{"k":"mc","sub":"hear","prompt":"You hear: \"Zo'n huis wil ik ook.\"","opts":[{"t":"Zo een huis wil ik ook.","ok":true,"why":"Correct — 'zo'n' is 'zo een' fused, used before a singular noun."},{"t":"Zulke huizen wil ik ook.","ok":false,"why":"Wrong number — 'zo'n' pairs with a singular noun; the plural form is 'zulke'."},{"t":"Zo'n huizen wil ik ook.","ok":false,"why":"Mismatched — 'zo'n' only ever pairs with a singular noun, never a plural one."}],"say":"Zo'n huis wil ik ook."},{"k":"mc","sub":"hear","prompt":"Someone in the Randstad says: \"Ik ga zo lope.\"","opts":[{"t":"Ik ga zo lopen.","ok":true,"why":"Correct — regionally, the unstressed final -n of 'lopen' is dropped in casual speech."},{"t":"Ik ga zo lopende.","ok":false,"why":"Wrong form — the n-drop only affects the unstressed -en ending, not the whole verb shape."},{"t":"Ik ga zo gelopen.","ok":false,"why":"Wrong tense — n-dropping doesn't change tense; the meaning is still present/future 'lopen'."}],"say":"Ik ga zo lope."},{"k":"fill","prompt":"Formal: het is mooi weer. Casually, het shrinks to just ___.","gloss":"(type with the apostrophe)","ans":["'t"],"why":"'het' is almost never stressed, so it reduces to ''t' in speech and informal writing."},{"k":"fill","prompt":"Formal: een huis kopen. Casually, een shrinks to just ___.","gloss":"(type with the apostrophe)","ans":["'n"],"why":"'een' is almost never stressed, so it reduces to ''n' in speech and informal writing."},{"k":"fill","prompt":"Formal: heb je dat gehoord?. Casually this fuses into \"___ dat gehoord?\"","gloss":"(one glued word)","ans":["hebbie"],"why":"'heb' plus 'je' fuse into one glued word, 'hebbie'."},{"k":"fill","prompt":"Formal: komt hij ook?. Casually: \"komt-___ ook?\"","gloss":"(just the reduced pronoun, no hyphen)","ans":["ie"],"why":"After a verb, 'hij' reduces to the unstressed clitic 'ie', glued on with a hyphen or fused directly."},{"k":"fill","prompt":"Formal: ik weet het wel. Casually: \"___ weet het wel.\"","gloss":"(type with the apostrophe)","ans":["'k"],"why":"'ik' reduces to the unstressed clitic ''k' when unstressed."},{"k":"fill","prompt":"Formal: geef hem de sleutel. Casually: \"geef ___ de sleutel.\"","gloss":"(type with the apostrophe)","ans":["'m"],"why":"'hem' reduces to the unstressed clitic ''m' when unstressed."},{"k":"fill","prompt":"Formal: ik bel haar zo. Casually: \"ik bel ___ zo.\"","gloss":"(type with the apostrophe)","ans":["d'r"],"why":"'haar' reduces to the unstressed clitic 'd'r' when unstressed."},{"k":"fill","prompt":"Formal: dat is zijn probleem. Casually: \"dat is ___ probleem.\"","gloss":"(type with the apostrophe)","ans":["z'n"],"why":"'zijn' (his) reduces to the unstressed clitic 'z'n' when unstressed."},{"k":"fill","prompt":"Formal: ik ga lopen. In casual Randstad speech, 'lopen' is often heard as \"___\".","gloss":"(regional, informal pronunciation only — the spelling never changes)","ans":["lope"],"why":"In the western Netherlands / Randstad, the unstressed -en ending of infinitives is commonly heard without its final n. Flemish speech and formal registers keep the n."},{"k":"fill","prompt":"Formal: dat is grappig. Casually this fuses into \"___ grappig!\"","gloss":"(one glued word)","ans":["da's"],"why":"'dat' plus 'is' fuse into one glued word, 'da's' — present tense only."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Isie eindelijk klaar?","ok":false,"why":"Correct — '-ie' glued after the verb 'is' is exactly how the reduction works."},{"t":"Ie is eindelijk klaar.","ok":true,"why":"This is the error — 'ie' only exists glued onto a preceding verb, never as a fronted subject. It should be 'Hij is eindelijk klaar.'"},{"t":"Hij is nog steeds niet klaar.","ok":false,"why":"Correct — full 'hij' at the front of the sentence, never reduced."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Heeft-ie de sleutels?","ok":false,"why":"Correct — '-ie' glued after 'heeft' with a hyphen, standard pattern."},{"t":"Hij heeft de sleutels niet bij zich.","ok":false,"why":"Correct — full 'hij' used normally in a statement."},{"t":"Ie komt morgen ook langs.","ok":true,"why":"This is the error — 'ie' can't front a clause on its own. It should be 'Hij komt morgen ook langs.' or, with the verb first, 'Komt-ie morgen ook langs?'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hebbie dat pakketje al ontvangen?","ok":false,"why":"Correct — 'hebbie' is the standard fusion of 'heb je'."},{"t":"Doebie dat straks even?","ok":true,"why":"This is the error — the '-bie' fusion is specific to 'heb je'; it doesn't generalize to other verbs. It should be 'Doe je dat straks even?'"},{"t":"Doe je dat straks even?","ok":false,"why":"Correct — the full, unreduced form of 'doe je'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Hebbie mijn sleutels ergens gezien?","ok":false,"why":"Correct — 'hebbie' already stands in for 'heb je' on its own."},{"t":"Hebbie je mijn telefoon gezien?","ok":true,"why":"This is the error — 'hebbie' already contains 'je'; adding a separate 'je' afterward is redundant. It should be 'Hebbie mijn telefoon gezien?' or 'Heb je mijn telefoon gezien?'"},{"t":"Heb je mijn telefoon gezien?","ok":false,"why":"Correct — the full, unreduced form with 'je' stated once."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Wordt-ie hier een beetje boos van?","ok":false,"why":"Correct — '-ie' glued after 'wordt', standard pattern in a question."},{"t":"Ie wordt boos als je te laat komt.","ok":true,"why":"This is the error — 'ie' can't front the clause. It should be 'Hij wordt boos als je te laat komt.'"},{"t":"Hij wordt boos als je te laat komt.","ok":false,"why":"Correct — full 'hij' used normally at the front of a statement."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Komt-ie morgen ook langs?","ok":false,"why":"Correct — '-ie' glued after 'komt', standard pattern in a question."},{"t":"Hij komt morgen niet, hij is ziek.","ok":false,"why":"Correct — full 'hij' used normally at the front of a statement."},{"t":"Ie komt morgen ook langs.","ok":true,"why":"This is the error — 'ie' can't front the clause on its own. It should be 'Hij komt morgen ook langs.' or 'Komt-ie morgen ook langs?'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Dat is z'n fiets, niet de mijne.","ok":false,"why":"Correct — 'z'n' sits right before the noun it modifies, like any possessive."},{"t":"Dat is fiets z'n, niet de mijne.","ok":true,"why":"This is the error — reduced possessives go before the noun, never after. It should be 'Dat is z'n fiets, niet de mijne.'"},{"t":"Dat is m'n eigen idee.","ok":false,"why":"Correct — 'm'n' sits right before the noun it modifies."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Da's een goed idee, laten we dat doen.","ok":false,"why":"Correct — 'da's' (present tense 'dat is') fits a present-tense statement."},{"t":"Da's gisteren een goed idee geweest, nu niet meer.","ok":true,"why":"This is the error — 'da's' only stands for present-tense 'dat is'; with 'gisteren' the sentence needs past tense. It should be 'Dat was gisteren een goed idee, nu niet meer.'"},{"t":"Dat was gisteren een goed idee, nu niet meer.","ok":false,"why":"Correct — full past-tense 'dat was' matches 'gisteren'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zo'n huis wil ik later ook wel.","ok":false,"why":"Correct — 'zo'n' pairs with the singular noun 'huis'."},{"t":"Zo'n huizen wil ik later ook wel.","ok":true,"why":"This is the error — 'zo'n' only pairs with a singular noun; the plural needs 'zulke'. It should be 'Zulke huizen wil ik later ook wel.'"},{"t":"Zulke huizen wil ik later ook wel.","ok":false,"why":"Correct — 'zulke' pairs with the plural noun 'huizen'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Zo'n idee had ik nog nooit gehad.","ok":false,"why":"Correct — the apostrophe replaces 'ee', giving 'zo'n', not the reverse."},{"t":"Zon idee had ik nog nooit gehad.","ok":true,"why":"This is the error — dropping the apostrophe turns 'zo'n' into 'zon', which just means 'sun'. It should be 'Zo'n idee had ik nog nooit gehad.'"},{"t":"Zo een idee had ik nog nooit gehad.","ok":false,"why":"Correct — the full, uncontracted 'zo een' is also standard, just more formal."}]},{"k":"mc","sub":"D","prompt":"\"Is he home already?\"","opts":[{"t":"Isie al thuis?","ok":true,"why":"Correct — 'isie' fuses 'is hij' after the verb."},{"t":"Ie is al thuis?","ok":false,"why":"'ie' can't front the clause on its own — it only exists glued to the verb."},{"t":"Is al thuis hij?","ok":false,"why":"Word order is broken — 'hij' can't trail at the end like this."}]},{"k":"mc","sub":"D","prompt":"\"Have you seen my keys?\"","opts":[{"t":"Hebbie mijn sleutels gezien?","ok":true,"why":"Correct — 'hebbie' fuses 'heb je' cleanly, used once."},{"t":"Heb ie mijn sleutels gezien?","ok":false,"why":"Wrong clitic — 'ie' reduces 'hij', not 'je'; 'heb je' reduces to 'hebbie', not 'heb ie'."},{"t":"Hebbie je mijn sleutels gezien?","ok":false,"why":"Redundant — 'hebbie' already contains 'je', so adding it again is wrong."}]},{"k":"mc","sub":"D","prompt":"\"Is it nice weather?\"","opts":[{"t":"Is 't lekker weer?","ok":true,"why":"Correct — ''t' fuses 'het' before the unstressed noun phrase."},{"t":"Is 'n lekker weer?","ok":false,"why":"Wrong clitic — ''n' reduces 'een', not 'het'; this idiom doesn't take an article at all."},{"t":"Is het 'n lekker weer?","ok":false,"why":"Extra, wrong article — 'lekker weer' takes no article; 'n' shouldn't be added here."}]},{"k":"mc","sub":"D","prompt":"\"Such a nice day!\"","opts":[{"t":"Zo'n mooie dag!","ok":true,"why":"Correct — 'zo'n' pairs with the singular noun 'dag'."},{"t":"Zulke mooie dag!","ok":false,"why":"Wrong number — 'zulke' is for plural or mass nouns; 'dag' here is singular."},{"t":"Zo'n mooie dagen!","ok":false,"why":"Mismatched — 'zo'n' pairs with a singular noun, not the plural 'dagen'."}]},{"k":"mc","sub":"D","prompt":"\"He's getting angry.\"","opts":[{"t":"Wordt-ie boos.","ok":true,"why":"Correct — 'wordt-ie' fuses 'wordt hij' after the verb."},{"t":"Ie wordt boos.","ok":false,"why":"'ie' can't front the clause — it only exists glued to the verb."},{"t":"Wordt hij-ie boos.","ok":false,"why":"Double-marked — pick either 'hij' or the '-ie' clitic, not both."}]},{"k":"mc","sub":"D","prompt":"\"That's a good idea.\"","opts":[{"t":"Da's een goed idee.","ok":true,"why":"Correct — 'da's' fuses 'dat is', matching the singular 'idee'."},{"t":"Da's een goede ideeën.","ok":false,"why":"Number mismatch — 'een' plus 'idee' must stay singular, not plural 'ideeën'."},{"t":"Dat's een goed idee.","ok":false,"why":"Misspelled — the standard casual fusion is 'da's', not 'dat's'."}]},{"k":"mc","sub":"D","prompt":"\"I don't know.\"","opts":[{"t":"'k Weet het niet.","ok":true,"why":"Correct — ''k' fuses 'ik', with 'het niet' in standard order."},{"t":"'k Weet niet het.","ok":false,"why":"Object order is off — 'het' comes before 'niet', not after."},{"t":"Ik'k weet het niet.","ok":false,"why":"Double-marked — pick either 'ik' or the ''k' clitic, not both."}]},{"k":"mc","sub":"D","prompt":"\"Give him the book.\"","opts":[{"t":"Geef 'm het boek.","ok":true,"why":"Correct — ''m' fuses 'hem', placed right after the verb."},{"t":"Geef hem 'm het boek.","ok":false,"why":"Double-marked — pick either 'hem' or ''m', not both."},{"t":"Geef het boek 'm.","ok":false,"why":"Object order is unnatural — ''m' belongs right after the verb, not trailing at the end."}]},{"k":"mc","sub":"D","prompt":"\"I don't see her.\"","opts":[{"t":"Ik zie d'r niet.","ok":true,"why":"Correct — 'd'r' fuses 'haar', used once in normal object position."},{"t":"Ik zie haar 'r niet.","ok":false,"why":"Double-marked — pick either 'haar' or 'd'r', not both."},{"t":"Ik d'r zie niet.","ok":false,"why":"Word order is broken — the object can't jump in front of the verb like this."}]},{"k":"mc","sub":"D","prompt":"\"His car is nice.\"","opts":[{"t":"Z'n auto is mooi.","ok":true,"why":"Correct — 'z'n' fuses 'zijn', placed right before the noun it modifies."},{"t":"Z'n'n auto is mooi.","ok":false,"why":"Double-marked — the clitic is doubled up for no reason."},{"t":"Auto is z'n mooi.","ok":false,"why":"Word order is broken — the possessive must sit right before its noun, not after."}]},{"k":"tr","prompt":"Translate: \"Is he home?\"","ans":["is hij thuis","isie thuis"],"why":"Both the full form and the reduced 'isie' are correct — the reduction is purely a speech-register choice."},{"k":"tr","prompt":"Translate: \"Have you seen it?\"","ans":["heb je het gezien","hebbie het gezien"],"why":"Both the full form and the reduced 'hebbie' are correct."},{"k":"tr","prompt":"Translate: \"That's a good idea.\"","ans":["dat is een goed idee","da's een goed idee"],"why":"Both the full form and the reduced 'da's' are correct."},{"k":"tr","prompt":"Translate: \"I don't know.\"","ans":["ik weet het niet","'k weet het niet"],"why":"Both the full form and the reduced ''k' are correct."},{"k":"tr","prompt":"Translate: \"Give him the book.\"","ans":["geef hem het boek","geef 'm het boek"],"why":"Both the full form and the reduced ''m' are correct."},{"k":"tr","prompt":"Translate: \"Is it nice weather?\"","ans":["is het lekker weer","is 't lekker weer"],"why":"Both the full form and the reduced ''t' are correct."},{"k":"tr","prompt":"Translate: \"Such a nice house!\"","ans":["zo een mooi huis","zo'n mooi huis"],"why":"Both the full form and the reduced 'zo'n' are correct — the noun stays singular."},{"k":"tr","prompt":"Translate: \"I don't see her.\"","ans":["ik zie haar niet","ik zie d'r niet"],"why":"Both the full form and the reduced 'd'r' are correct."},{"k":"tr","prompt":"Translate: \"Is he getting angry?\"","ans":["wordt hij boos","wordt-ie boos"],"why":"Both the full form and the reduced 'wordt-ie' are correct."},{"k":"tr","prompt":"Translate: \"His car is nice.\"","ans":["zijn auto is mooi","z'n auto is mooi"],"why":"Both the full form and the reduced 'z'n' are correct."},{"k":"match","prompt":"Match the reduced form you hear to its formal written equivalent.","L":[{"key":"1","t":"'t is mooi","say":"'t is mooi"},{"key":"2","t":"'n huis","say":"'n huis"},{"key":"3","t":"hebbie dat gezien?","say":"hebbie dat gezien?"},{"key":"4","t":"isie thuis?","say":"isie thuis?"},{"key":"5","t":"wordt-ie boos?","say":"wordt-ie boos?"}],"R":[{"key":"4","t":"is hij thuis?","say":""},{"key":"1","t":"het is mooi","say":""},{"key":"5","t":"wordt hij boos?","say":""},{"key":"2","t":"een huis","say":""},{"key":"3","t":"heb je dat gezien?","say":""}]},{"k":"match","prompt":"Match the reduced form you hear to its formal written equivalent.","L":[{"key":"1","t":"'k weet het","say":"'k weet het"},{"key":"2","t":"geef 'm het boek","say":"geef 'm het boek"},{"key":"3","t":"ik zie d'r niet","say":"ik zie d'r niet"},{"key":"4","t":"da's mooi","say":"da's mooi"},{"key":"5","t":"zo'n huis","say":"zo'n huis"}],"R":[{"key":"3","t":"ik zie haar niet","say":""},{"key":"5","t":"zo een huis","say":""},{"key":"1","t":"ik weet het","say":""},{"key":"4","t":"dat is mooi","say":""},{"key":"2","t":"geef hem het boek","say":""}]}]},{"id":"separable","group":"Verbs","name":"Separable verbs","title":"Separable Verbs: Where Does the Prefix Go?","rule":"<h2>The rule<\/h2><p>Verbs like <em>opbellen<\/em> (to call up) and <em>aankomen<\/em> (to arrive) are really two parts: a prefix (<code>op<\/code>, <code>aan<\/code>) and a stem (<code>bellen<\/code>, <code>komen<\/code>). Where those two parts land depends on exactly one thing — the job the verb is doing in its clause.<\/p><h3>1. Main clause — the prefix jumps to the end<\/h3><blockquote class=\"example\">\n<span class=\"nl\">Ik bel mijn moeder <strong>op<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I call my mother up. → \"I'm calling my mother.\"<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">Ik kom morgen <strong>aan<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I arrive tomorrow. → \"I'm arriving tomorrow.\"<\/span>\n<\/blockquote><p><code>bel<\/code> and <code>kom<\/code> sit in the normal V2 position — only the prefix moves, and it moves all the way past every other word to the very end of the clause.<\/p><p><strong>One exception worth knowing:<\/strong> the prefix only detaches when the separable verb itself is the <em>finite<\/em> (conjugated) verb of the clause. If a modal like <code>moeten<\/code>, <code>kunnen<\/code>, or <code>willen<\/code> is doing that job instead, the separable verb stays whole, as a single-word infinitive, at the end: <code>Ik moet mijn moeder nog opbellen.<\/code> — not <code>... nog bellen op<\/code>.<\/p><h3>2. Subordinate clause — the prefix stays attached<\/h3><p>Verb last's verb-final rule wins here: the whole verb, prefix and stem together, moves to the end as one unbroken unit.<\/p><blockquote class=\"example\">\n<span class=\"nl\">... omdat ik mijn moeder <strong>opbel<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">... because I my mother call-up. → \"... because I'm calling my mother.\"<\/span>\n<\/blockquote><blockquote class=\"example\">\n<span class=\"nl\">... omdat ik morgen <strong>aankom<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">... because I tomorrow arrive. → \"... because I'm arriving tomorrow.\"<\/span>\n<\/blockquote><p>Compare the two rules side by side: <code>bel ... op<\/code> splits across the main clause, but <code>opbel<\/code> is one unbroken word at the end of the subordinate clause. Nothing is ever allowed to follow the prefix once it's inside a subordinate clause.<\/p><h3>3. Te + infinitive — te wedges into the middle<\/h3><blockquote class=\"example\">\n<span class=\"nl\">Ik hoop op tijd <strong>aan te komen<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I hope on time to-arrive. → \"I hope to arrive on time.\"<\/span>\n<\/blockquote><p><code>te<\/code> doesn't go in front of the whole verb the way English \"to\" does — it slots between the prefix and the stem, and all three are written as separate words: <code>aan te komen<\/code>, <code>op te ruimen<\/code>, <code>mee te nemen<\/code>.<\/p><h3>4. Past participle — ge- wedges into the same spot<\/h3><blockquote class=\"example\">\n<span class=\"nl\">Ik heb je gisteren <strong>opgebeld<\/strong>.<\/span><br><\/br>\n<span class=\"gloss\">I have you yesterday called-up. → \"I called you yesterday.\"<\/span>\n<\/blockquote><p><code>ge-<\/code> lands in exactly the same slot as <code>te<\/code> above — between the prefix and the stem — but this time the result is written as <strong>one word<\/strong>: <code>op<\/code> + <code>ge<\/code> + <code>beld<\/code> = <code>opgebeld<\/code>. Never <code>geopbeld<\/code>. (If you've covered the perfect tense already, this is the one irregularity to bolt onto what you know: everything else about forming the participle stays the same.)<\/p><p>Ten more you'll meet in the practice below: <code>opstaan<\/code> (get up), <code>uitgaan<\/code> (go out), <code>meenemen<\/code> (bring along), <code>doorgaan<\/code> (continue / go ahead), <code>terugkomen<\/code> (come back), <code>voorstellen<\/code> (suggest), <code>opruimen<\/code> (clean up), <code>aantrekken<\/code> (put on) — plus <code>opbellen<\/code> and <code>aankomen<\/code> already above.<\/p><div class=\"callout\">\n<strong>The test that always works:<\/strong> say the first part of the verb on its own. If it's a stressed word that also works alone as a preposition or adverb — <code>op<\/code>, <code>aan<\/code>, <code>uit<\/code>, <code>mee<\/code>, <code>door<\/code>, <code>terug<\/code>, <code>voor<\/code> — it's separable, and it splits in a main clause. If it's one of six always-unstressed prefixes — <strong>be-, ge-, er-, her-, ont-, ver-<\/strong> — it never splits, and it skips <code>ge-<\/code> in the past participle entirely (two unstressed prefixes back to back would be awkward, so Dutch just drops the second one).\n<table>\n<tr><th>Separable (splits)<\/th><th>Inseparable (never splits)<\/th><\/tr>\n<tr><td><code>opbellen<\/code> → <code>belt ... op<\/code> → <code>opgebeld<\/code><\/td><td><code>vergeten<\/code> → <code>vergeet<\/code> → <code>vergeten<\/code><\/td><\/tr>\n<tr><td><code>aankomen<\/code> → <code>komt ... aan<\/code> → <code>aangekomen<\/code><\/td><td><code>beginnen<\/code> → <code>begint<\/code> → <code>begonnen<\/code><\/td><\/tr>\n<tr><td><code>opruimen<\/code> → <code>ruimt ... op<\/code> → <code>opgeruimd<\/code><\/td><td><code>ontmoeten<\/code> → <code>ontmoet<\/code> → <code>ontmoet<\/code><\/td><\/tr>\n<\/table>\nNear-misses happen because the prefixes are short and unfamiliar, not because the words look alike — <code>voorstellen<\/code> (separable) and <code>vergeten<\/code> (inseparable) share nothing but a rough silhouette. Run the stress test, don't guess from shape.\n<\/div>","items":[{"k":"mc","sub":"A","prompt":"\"I call my brother every day.\"","opts":[{"t":"Ik opbel mijn broer elke dag.","ok":false,"why":"opbellen never appears glued together like this — the prefix has to detach and move to the very end."},{"t":"Ik bel mijn broer elke dag op.","ok":true,"why":"Correct — bel stays in the normal V2 slot and op travels all the way to the end of the clause."},{"t":"Ik bel op mijn broer elke dag.","ok":false,"why":"op is left sitting right after the verb instead of traveling to the very end of the clause."}]},{"k":"mc","sub":"A","prompt":"\"The train arrives at nine.\"","opts":[{"t":"De trein komt om negen uur aan.","ok":true,"why":"Correct — komt holds position 2, aan is stranded at the very end."},{"t":"De trein aankomt om negen uur.","ok":false,"why":"aankomen is never written as one glued word in a main clause — it has to split."},{"t":"De trein komt aan om negen uur.","ok":false,"why":"aan is left mid-clause instead of moving all the way to the end."}]},{"k":"mc","sub":"A","prompt":"\"I always get up at seven.\"","opts":[{"t":"Ik sta altijd om zeven uur op.","ok":true,"why":"Correct — sta holds position 2, op is stranded after the time phrase at the very end."},{"t":"Ik opsta altijd om zeven uur.","ok":false,"why":"opstaan is never written as one glued word in a main clause — it has to split."},{"t":"Ik sta op altijd om zeven uur.","ok":false,"why":"op is stranded too early — it needs to move past the whole time phrase to the very end."}]},{"k":"mc","sub":"A","prompt":"\"We're going out this weekend.\"","opts":[{"t":"We gaan dit weekend uit.","ok":true,"why":"Correct — gaan holds position 2, uit is stranded at the very end after the time phrase."},{"t":"We uitgaan dit weekend.","ok":false,"why":"uitgaan is never written as one glued word in a main clause — it has to split."},{"t":"We gaan uit dit weekend.","ok":false,"why":"uit is stranded too early — it needs to move past the time phrase to the very end."}]},{"k":"mc","sub":"A","prompt":"\"I'm happy because I'm bringing my camera.\"","opts":[{"t":"Ik ben blij omdat ik mijn camera meeneem.","ok":true,"why":"Correct — meeneem is kept together as one unit at the end of the omdat-clause."},{"t":"Ik ben blij omdat ik mijn camera neem mee.","ok":false,"why":"Splitting into neem ... mee only happens in a main clause — this is a subordinate clause, so it must stay glued together."},{"t":"Ik ben blij omdat ik meeneem mijn camera.","ok":false,"why":"The verb has to be the very last word of the omdat-clause, not sit in front of the object."}]},{"k":"mc","sub":"A","prompt":"\"I think that he's suggesting a good solution.\"","opts":[{"t":"Ik denk dat hij een goede oplossing voorstelt.","ok":true,"why":"Correct — voorstelt is kept together as one unit at the end of the dat-clause."},{"t":"Ik denk dat hij een goede oplossing stelt voor.","ok":false,"why":"Splitting into stelt ... voor only happens in a main clause — inside the dat-clause it must stay glued together."},{"t":"Ik denk dat hij voorstelt een goede oplossing.","ok":false,"why":"The verb has to sit at the very end of the dat-clause, not right after the subject."}]},{"k":"mc","sub":"A","prompt":"\"I hope to arrive on time.\"","opts":[{"t":"Ik hoop op tijd aan te komen.","ok":true,"why":"Correct — te wedges between the prefix aan and the stem komen, all written as separate words."},{"t":"Ik hoop op tijd te aankomen.","ok":false,"why":"te can't sit in front of the whole verb here — it has to wedge inside, between the prefix and the stem."},{"t":"Ik hoop op tijd aankomen te.","ok":false,"why":"te has landed at the very end instead of in its usual slot between the prefix and the stem."}]},{"k":"mc","sub":"A","prompt":"\"Don't forget to tidy your room.\"","opts":[{"t":"Vergeet niet je kamer op te ruimen.","ok":true,"why":"Correct — te wedges between op and ruimen, all written as separate words."},{"t":"Vergeet niet je kamer te opruimen.","ok":false,"why":"te can't sit in front of the whole verb here — it belongs between the prefix and the stem."},{"t":"Vergeet niet je kamer ruimen op te.","ok":false,"why":"Both the word order and the te-placement are wrong — te belongs directly between op and ruimen."}]},{"k":"mc","sub":"A","prompt":"\"I called you yesterday.\"","opts":[{"t":"Ik heb je gisteren opgebeld.","ok":true,"why":"Correct — ge- wedges between op and beld, and the whole participle stays at the very end of the clause."},{"t":"Ik heb je gisteren geopbeld.","ok":false,"why":"ge- is glued to the front of the whole word instead of wedging between the prefix and the stem."},{"t":"Ik heb je opgebeld gisteren.","ok":false,"why":"The participle has drifted out of its clause-final position — it belongs after gisteren, not before it."}]},{"k":"mc","sub":"A","prompt":"\"I forgot my umbrella.\"","opts":[{"t":"Ik ben mijn paraplu vergeten.","ok":true,"why":"Correct — vergeten never splits and never takes ge-, so the participle is identical to the infinitive."},{"t":"Ik ben mijn paraplu gevergeten.","ok":false,"why":"ver- is an inseparable, unstressed prefix — the participle skips ge- entirely, so this extra ge- is wrong."},{"t":"Ik ben vergeten mijn paraplu.","ok":false,"why":"The participle has to stay at the very end of the clause, after the object — not sit right after the auxiliary."}]},{"k":"fill","prompt":"Ik bel mijn vader morgen ___.","gloss":"(I call my father tomorrow — opbellen)","ans":["op"],"why":"opbellen splits in a main clause — bel stays in position 2, op travels to the very end."},{"k":"fill","prompt":"De bus komt om acht uur ___.","gloss":"(The bus arrives at eight — aankomen)","ans":["aan"],"why":"Same pattern — komt stays put, aan moves to the end of the clause."},{"k":"fill","prompt":"Ik ga vroeg naar bed omdat ik morgen vroeg ___.","gloss":"(...because I get up early tomorrow — opstaan, ik-form)","ans":["opsta"],"why":"Inside an omdat-clause the prefix stays glued to the stem — one word, opsta, at the very end."},{"k":"fill","prompt":"Ik beloof snel ___.","gloss":"(I promise to come back soon — terugkomen)","ans":["terug te komen"],"why":"te wedges between the prefix and the stem: terug + te + komen, three separate words."},{"k":"fill","prompt":"Ik heb de keuken net ___.","gloss":"(I just tidied the kitchen — opruimen)","ans":["opgeruimd"],"why":"ge- goes between the prefix and the stem, and the whole thing is written as one word: opgeruimd."},{"k":"fill","prompt":"Ik heb hem gisteren voor het eerst ___.","gloss":"(I met him for the first time yesterday — ontmoeten)","ans":["ontmoet"],"why":"ontmoeten's prefix ont- is inseparable and unstressed, so the participle skips ge- entirely — it matches the present-tense stem form."},{"k":"fill","prompt":"We gaan dit weekend ___.","gloss":"(We're going out this weekend — uitgaan)","ans":["uit"],"why":"uitgaan splits the same way — gaan stays second, uit moves to the very end."},{"k":"fill","prompt":"Ze is blij omdat ik een oplossing ___.","gloss":"(...because I'm suggesting a solution — voorstellen, ik-form)","ans":["voorstel"],"why":"Attached as one unit at the end of the omdat-clause: voorstel, not stel ... voor."},{"k":"fill","prompt":"Vergeet niet je jas ___.","gloss":"(Don't forget to put on your coat — aantrekken)","ans":["aan te trekken"],"why":"Same te-insertion pattern: aan + te + trekken, three separate words."},{"k":"fill","prompt":"Ik ben dit boek helemaal ___.","gloss":"(I've completely forgotten this book — vergeten)","ans":["vergeten"],"why":"vergeten never splits and never takes ge- in the participle — it's identical to the infinitive here."},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik weet dat hij morgen aankomt.","ok":false,"why":"Correct — aankomt stays one unbroken unit at the end of the dat-clause."},{"t":"Ik weet dat hij morgen komt aan.","ok":true,"why":"This is the error — inside a subordinate clause the prefix can't detach: it should be '... dat hij morgen aankomt.'"},{"t":"Ik weet dat hij vanavond terugkomt.","ok":false,"why":"Correct — terugkomt is likewise kept together at the end of the clause."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik probeer op tijd aan te komen.","ok":false,"why":"Correct — te sits between the prefix aan and the stem komen, three separate words."},{"t":"Ik probeer op tijd te aankomen.","ok":true,"why":"This is the error — te can't sit in front of the whole verb; it belongs between the prefix and the stem: 'aan te komen'."},{"t":"Ik probeer op tijd te vertrekken.","ok":false,"why":"Correct — vertrekken's ver- is an inseparable prefix, so te simply goes in front like a normal infinitive."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik heb je gisteren opgebeld.","ok":false,"why":"Correct — ge- sits between op and beld: opgebeld."},{"t":"Ik heb mijn jas aangetrokken.","ok":false,"why":"Correct — ge- sits between aan and getrokken: aangetrokken."},{"t":"Ik heb mijn kamer geopruimd.","ok":true,"why":"This is the error — ge- has to wedge between the prefix and the stem, not sit in front of the whole word: 'opgeruimd', not 'geopruimd'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik heb hem gisteren ontmoet.","ok":false,"why":"Correct — ontmoeten's ont- is inseparable and unstressed, so the participle skips ge-: ontmoet."},{"t":"Ik ben net op tijd begonnen.","ok":false,"why":"Correct — beginnen starts with the inseparable prefix be-, so its participle skips ge- too: begonnen."},{"t":"Ik heb de vraag geherhaald.","ok":true,"why":"This is the error — her- is inseparable and unstressed, so ge- is skipped here too: 'herhaald', not 'geherhaald'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik sta elke dag om zeven uur op.","ok":false,"why":"Correct — main clause, op correctly stranded at the very end."},{"t":"Ze weet dat ik morgen laat opsta.","ok":false,"why":"Correct — subordinate clause, opsta kept together as one unit at the end."},{"t":"Ze weet dat ik morgen laat sta op.","ok":true,"why":"This is the error — inside a dat-clause the verb can't split: it should be '... dat ik morgen laat opsta.'"}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Vergeet niet je paspoort mee te nemen.","ok":false,"why":"Correct — te sits between mee and nemen: mee te nemen."},{"t":"Ik hoop dat de vergadering kan doorgaan.","ok":false,"why":"Correct — doorgaan stays one unbroken unit at the end of the dat-clause, after the modal kan."},{"t":"Vergeet niet je paspoort te meenemen.","ok":true,"why":"This is the error — te has to wedge inside the verb, not sit in front of it: 'mee te nemen', not 'te meenemen'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik trek mijn jas aan.","ok":false,"why":"Correct — trek stays in position 2, aan moves to the end."},{"t":"We gaan morgen uit.","ok":false,"why":"Correct — same pattern with uitgaan."},{"t":"Ik aantrek mijn jas.","ok":true,"why":"This is the error — aantrekken always splits in a main clause; it can't stay glued together like this."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik heb een goed plan voorgesteld.","ok":false,"why":"Correct — ge- wedged between voor and gesteld: voorgesteld."},{"t":"Ik hoop dat hij snel komt terug.","ok":true,"why":"This is the error — terugkomen can't split inside a subordinate clause: it should be '... dat hij snel terugkomt.'"},{"t":"Ik hoop dat hij snel terugkomt.","ok":false,"why":"Correct — terugkomt kept together at the end of the dat-clause elsewhere, this one is fine as written."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Heb je de tafel al opgeruimd?","ok":false,"why":"Correct — ge- sits between op and ruimd: opgeruimd."},{"t":"Wanneer ben je precies begonnen?","ok":false,"why":"Correct — beginnen's be- is inseparable, so begonnen has no ge- either."},{"t":"Heb je de tafel al geopruimd?","ok":true,"why":"This is the error — ge- belongs between the prefix and the stem, not glued to the front of the whole word: 'opgeruimd', not 'geopruimd'."}]},{"k":"mc","sub":"C","prompt":"Which sentence has the mistake?","opts":[{"t":"Ik moet mijn moeder nog opbellen.","ok":false,"why":"Correct — moeten is the finite verb here, so opbellen stays together as one infinitive at the end."},{"t":"Ik moet dit nog een keer herhalen.","ok":false,"why":"Correct — herhalen is inseparable anyway, so it was never at risk of splitting."},{"t":"Ik moet mijn moeder nog bellen op.","ok":true,"why":"This is the error — the split only happens when the separable verb itself is the finite verb. With moet carrying that role, opbellen stays whole: '... nog opbellen', not '... nog bellen op.'"}]},{"k":"mc","sub":"D","prompt":"\"Because I arrive tomorrow, I'll cal
